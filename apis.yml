image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/moment.png

name: Moment

description: Moment is the AI operating system for investment management and the fixed-income infrastructure that powers bond data, pricing, and
  trading for digital wealth platforms, RIAs, and brokerages. Through simple REST and WebSocket APIs it delivers institutional-grade reference
  data on 500,000+ (1M+ global) fixed-income securities — corporates, treasuries, agencies, municipals, CDs, ABS/MBS and structured products —
  plus real-time and historical evaluated pricing, live top-of-order-book and full order books, and advanced analytics (yield conversion, markups,
  duration, spreads, liquidity scores, implied default). Its execution management system covers orders, RFQs, smart order routing, allocations,
  block trades, corporate actions, portfolio optimization, model and asset-allocation management, and account, risk-control, and cash-raise operations.
  Moment works with wealth firms overseeing more than $10 trillion in assets across 60,000+ advisors.

