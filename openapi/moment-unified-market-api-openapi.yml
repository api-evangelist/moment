openapi: 3.2.0
info:
  title: Quotes Unified Market API
  description: 'Moment''s Quotes API is a modern platform for algorithmic fixed income trading.

    For complete documentation on the Quotes API and to obtain your keys, visit:

    Moment API Documentation.

    Once you have your keys, go to the environments tab to quickly get started.'
  version: 1.0.0
  contact:
    name: Moment Support
    email: support@withmoment.com
    url: https://withmoment.com/support
servers:
- url: https://live.moment-api.com
- url: https://paper.moment-api.com
tags:
- name: Unified Market
paths:
  /v1/trading/market/{instrument_id}/:
    get:
      tags:
      - Unified Market
      summary: Unified Market
      description: 'The Unified Market API returns the cumulative information for a specified bond for a given risk group.


        If the specified bond exists in our universe, you will receive a response with the full order book, the evaluated price, yield-to-worst and yield-to-maturity, a yield grid, the accrued interest and par value, and the total fees for the instrument.


        If the specified bond does not exist in our universe or is inactive, you will receive a `not_found` error.'
      operationId: getUnifiedMarket
      parameters:
      - $ref: '#/components/parameters/instrument_id'
      - name: risk_group_id
        in: query
        description: The risk group ID to use for this quote. A risk group is required for fees and yields to be accurately reflected in the return.
        required: true
        schema:
          type: string
      - name: skip_fees
        in: query
        description: Do not include fees in the response.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/FullOrderBookResponse'
                - type: object
                  properties:
                    evaluated_price:
                      description: The evaluated price of the bond
                      type: number
                    evaluated_yield_to_maturity:
                      description: The evaluated yield to maturity of the bond
                      type:
                      - number
                      - 'null'
                    evaluated_yield_to_worst:
                      description: The evaluated yield to worst of the bond
                      type:
                      - number
                      - 'null'
                    accrued_interest:
                      description: The accrued interest of the bond
                      type: number
                      example: 0
                    par_value:
                      description: The par value of the bond
                      type: number
                    fees:
                      description: Fees from the risk group
                      type: array
                      items:
                        type: object
                        properties:
                          receipient_id:
                            description: The ID of the fee owner
                            type: string
                          type:
                            description: The type of the fee
                            type: string
                            enum:
                            - markup
                            - commission
                          amount_type:
                            type: string
                            enum:
                            - dollar_per_trade
                            - percentage_of_par
                            - percentage_of_notional
                          amount:
                            description: The amount of the fee
                            type: number
                    yield_grid:
                      properties:
                        price:
                          description: Prices, represented as a percentage of par.
                          type: array
                          items:
                            type: number
                        yield_to_maturity:
                          description: Yield to maturity for each price.
                          type: array
                          items:
                            type:
                            - number
                            - 'null'
                        yield_to_worst:
                          description: Yield to worst for each price, when available.
                          type: array
                          items:
                            type:
                            - number
                            - 'null'
components:
  schemas:
    FullOrderBookResponse:
      type: object
      properties:
        asks:
          type: array
          items:
            type: object
            properties:
              min_balance_remaining:
                description: The minimum amount in par that must remain on the quote after a partial fill. If an incoming order would reduce the remaining balance below this minimum, the entire remaining balance is filled instead.
                type:
                - number
                - 'null'
              min_increment:
                description: The minimum quantity increment for which orders can be placed on this quote. All orders executing on this quote must be in multiples of this value.
                type:
                - number
                - 'null'
              min_size:
                description: Ask minimum trade size in par value
                type: number
              price:
                description: Ask price
                type: number
              size:
                description: Ask size in par value
                type: number
              spread_benchmark_isin:
                description: Benchmark ISIN for the spread
                type:
                - string
                - 'null'
              spread_to_benchmark_bps:
                description: Spread to benchmark in basis points
                type:
                - string
                - 'null'
              venue_mpid:
                description: The venue's Market Participant Identifier
                type: string
              yield_to_maturity:
                description: Ask yield to maturity
                type:
                - number
                - 'null'
              yield_to_worst:
                description: Ask yield to worst
                type:
                - number
                - 'null'
        bids:
          type: array
          items:
            type: object
            properties:
              min_balance_remaining:
                description: The minimum amount in par that must remain on the quote after a partial fill. If an incoming order would reduce the remaining balance below this minimum, the entire remaining balance is filled instead.
                type:
                - number
                - 'null'
              min_increment:
                description: The minimum quantity increment for which orders can be placed on this quote. All orders executing on this quote must be in multiples of this value.
                type:
                - number
                - 'null'
              min_size:
                description: Bid minimum trade size in par value
                type: number
              price:
                description: Bid price
                type: number
              size:
                description: Bid size in par value
                type: number
              spread_benchmark_isin:
                description: Benchmark ISIN for the spread
                type:
                - string
                - 'null'
              spread_to_benchmark_bps:
                description: Spread to benchmark in basis points
                type:
                - string
                - 'null'
              venue_mpid:
                description: The venue's Market Participant Identifier
                type: string
              yield_to_maturity:
                description: Bid yield to maturity
                type:
                - number
                - 'null'
              yield_to_worst:
                description: Bid yield to worst
                type:
                - number
                - 'null'
        timestamp:
          description: Timestamp in RFC-3339 format with nanosecond precision
          type: string
          format: date-time
      title: FullOrderBookResponse
  parameters:
    instrument_id:
      name: instrument_id
      in: path
      required: true
      description: Instrument CUSIP or ISIN
      schema:
        type: string
        example: US91915WAB81
