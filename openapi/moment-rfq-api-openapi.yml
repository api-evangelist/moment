openapi: 3.2.0
info:
  title: Moment RFQ API
  version: 1.0.0
  contact:
    name: Moment Support
    email: support@withmoment.com
    url: https://withmoment.com/support
  description: 'Operations tagged RFQ across 2 of this provider''s published API definitions: moment-orders-api-openapi.yml, moment-rfq-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://live.moment-api.com
- url: https://paper.moment-api.com
tags:
- name: RFQ
paths:
  /v1/trading/rfq/:
    post:
      tags:
      - RFQ
      summary: Create RFQ
      description: Creates a new RFQ.
      operationId: createRFQ
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRFQ'
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRFQResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    get:
      tags:
      - RFQ
      summary: List RFQs
      description: Retrieves a list of RFQs for the authenticated organization.
      operationId: listRFQs
      parameters:
      - name: client_rfq_id
        in: query
        schema:
          $ref: '#/components/schemas/ClientRFQID'
      - name: ib_id
        in: query
        schema:
          description: The ID of the introducing broker placing the RFQ.
          type: string
          title: Introducing Broker ID
      - name: status
        in: query
        description: A comma-separated list of statuses to filter by.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Status'
        explode: false
        style: form
        x-go-name: Statuses
      - name: created_at_start
        in: query
        description: The inclusive start of the created_at time range to filter by.
        schema:
          $ref: '#/components/schemas/CreatedAt'
      - name: created_at_end
        in: query
        description: The inclusive end of the created_at time range to filter by.
        schema:
          $ref: '#/components/schemas/CreatedAt'
      - name: list_id
        in: query
        description: The ID of the list to filter by.
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                description: Standard error response format returned by all API endpoints.
                properties:
                  error:
                    type: string
                    description: Human-readable error message describing what went wrong.
                  error_details:
                    description: Additional structured information about the error.
                    x-go-type: any
                    x-go-type-skip-optional-pointer: true
                    x-oapi-codegen-extra-tags:
                      exhaustruct: optional
                  error_type:
                    type: string
                    description: High-level error category for programmatic error handling.
                    enum:
                    - invalid_request
                    - not_found
                    - server_error
                    - unauthorized
                    - rate_limited
                    - forbidden
                    - closed
                    - not_implemented
                    x-enum-varnames:
                    - ErrorTypeInvalidRequest
                    - ErrorTypeNotFound
                    - ErrorTypeServerError
                    - ErrorTypeUnauthorized
                    - ErrorTypeRateLimited
                    - ErrorTypeForbidden
                    - ErrorTypeNeedsMarketState
                    - ErrorTypeNotImplemented
                required:
                - error
                - error_type
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1trading~1rfq~1/get/responses/400/content/application~1json/schema'
    servers:
    - url: https://live.moment-api.com
    - url: https://paper.moment-api.com
  /v1/trading/rfq/{id}/:
    delete:
      tags:
      - RFQ
      summary: Cancel RFQ
      description: Attempts to cancel an open RFQ. If the RFQ is no longer cancelable, a subsequent cancel reject event will be sent to the client via the Real-Time RFQ API.
      operationId: deleteRfq
      parameters:
      - name: id
        in: path
        description: The id of the RFQ you wish to cancel.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Successful response
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    get:
      tags:
      - RFQ
      summary: Get RFQ
      description: Retrieves an RFQ by its id.
      operationId: getRFQ
      parameters:
      - name: id
        in: path
        description: The id of the RFQ you wish to retrieve.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRFQResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1trading~1rfq~1/get/responses/400/content/application~1json/schema'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1trading~1rfq~1/get/responses/400/content/application~1json/schema'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1trading~1rfq~1/get/responses/400/content/application~1json/schema'
    servers:
    - url: https://live.moment-api.com
    - url: https://paper.moment-api.com
  /v1/trading/rfq/event/:
    get:
      tags:
      - RFQ
      summary: List RFQ Events
      description: Retrieves RFQ events for the authenticated organization.
      operationId: getRFQEvents
      parameters:
      - name: rfq_id
        in: query
        schema:
          description: The ID of the RFQ to retrieve events for.
          type: string
      - name: start
        in: query
        schema:
          description: The message number to start from (inclusive).
          type: integer
      - name: end
        in: query
        schema:
          description: The message number to end with (inclusive).
          type: integer
      - name: event_type
        in: query
        schema:
          description: Filter events by type.
          type: array
          items:
            $ref: '#/components/schemas/RFQEventType'
        explode: false
        style: form
      - name: start_time
        in: query
        description: The time from which to start fetching RFQ updates in RFC-3339 format
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1trading~1rfq~1/get/responses/400/content/application~1json/schema'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1trading~1rfq~1/get/responses/400/content/application~1json/schema'
      security:
      - bearerAuth: []
    servers:
    - url: https://live.moment-api.com
    - url: https://paper.moment-api.com
  /v1/trading/rfq/list/:
    post:
      tags:
      - RFQ
      summary: Create List RFQ
      description: Creates a new list of RFQs.
      operationId: createListRFQ
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRFQList'
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRFQListResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1trading~1rfq~1/get/responses/400/content/application~1json/schema'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1trading~1rfq~1/get/responses/400/content/application~1json/schema'
      security:
      - bearerAuth: []
    servers:
    - url: https://live.moment-api.com
    - url: https://paper.moment-api.com
components:
  schemas:
    OrderSize:
      type: object
      title: Amount
      description: 'The Amount of an order with a specified `type` indicating how the amount is represented.

        - **Par:** Represents the order size in face value (e.g., a corporate bond with a $1,000 face value).

        - **Notional:** Represents the order size in notional dollar value.

        - **Shares:** Represents the order size in number of shares (for equities).'
      properties:
        value:
          type: number
          example: 10000
          x-go-type: float64
        type:
          type: string
          enum:
          - par
          - notional
          - shares
          default: par
          x-enumNames:
          - SizeTypePar
          - SizeTypeNotional
          - SizeTypeShares
      required:
      - value
      - type
    IntroducingBrokerID:
      description: The ID of the introducing broker placing the order. If not specified, the organization associated with the API key will be used.
      type: string
    OrderSide:
      type: string
      enum:
      - buy
      - sell
      example: buy
      title: OrderSide
      description: 'Represents which side this order is on:


        - buy

        - sell'
    DisclosureType:
      description: Disclosure types
      type: string
      enum:
      - disclosed
      - anonymous
      - unspecified
    CreateRFQ:
      description: Request body for creating a standalone RFQ.
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/OrderSize'
        client_rfq_id:
          description: The ID of the RFQ as provided by the client.
          type: string
          title: Client RFQ ID
        custodian_id:
          description: The ID of the custodian for the RFQ. This field is required when venue is TMC.
          type: string
        disclosure:
          $ref: '#/components/schemas/DisclosureType'
        due_time:
          description: The time at which quotes for this RFQ are due.
          type: string
          format: date-time
        expire_time:
          description: The time at which the RFQ will expire.
          type: string
          format: date-time
        firm_until_time:
          description: The time until which the quotes for this RFQ are firm.
          type: string
          format: date-time
        ib_id:
          $ref: '#/components/schemas/IntroducingBrokerID'
        instrument_id:
          description: The ISIN of the instrument being traded.
          type: string
        moment_order_id:
          description: When creating an RFQ to trade against an existing order, the identifier of the corresponding order.
          type: string
          example: 01FJ4B9B2D3H5Y8N0R0X3FQ1Z5
          title: Moment Order ID
          x-go-name: MomentOrderID
        risk_group_id:
          $ref: '#/components/schemas/RiskGroupID'
        settlement_date:
          description: The date on which the trade for this RFQ is to be settled.
          type:
          - string
          - 'null'
          format: date
        side:
          $ref: '#/components/schemas/OrderSide'
        skip_fees:
          description: Whether to skip fees for this RFQ. If true, the quotes will not include fees.
          type: boolean
        type:
          $ref: '#/components/schemas/RFQType'
        venue_mpid:
          description: The Market Participant Identifier (MPID) of the venue.
          type: string
        venue_trader_info:
          $ref: '#/components/schemas/VenueTraderInfo'
      required:
      - ib_id
      - risk_group_id
      - instrument_id
      - type
      - side
      - amount
      - venue_mpid
      - disclosure
    RFQType:
      description: RFQ types
      type: string
      enum:
      - bin
      - asap
      - unspecified
    VenueTraderInfo:
      title: Venue Trader Info
      type: object
      required:
      - venue_mpid
      - custodian_id
      - venue_trader_id
      - custodian_account_at_venue
      properties:
        venue_mpid:
          type: string
          description: The MPID of the venue.
          x-go-name: VenueMPID
        custodian_id:
          type: string
          description: The ID of the custodian for the venue trader info.
          x-go-name: CustodianID
        venue_trader_id:
          type: string
          description: The ID of the venue trader.
          x-go-name: VenueTraderID
        custodian_account_at_venue:
          type: string
          description: The ID of the custodian account for the venue trader.
    ErrorType:
      type: string
      description: High-level error category for programmatic error handling.
      enum:
      - invalid_request
      - not_found
      - server_error
      - unauthorized
      - rate_limited
      - forbidden
      - closed
      - not_implemented
      - resource_conflict
      x-enum-varnames:
      - ErrorTypeInvalidRequest
      - ErrorTypeNotFound
      - ErrorTypeServerError
      - ErrorTypeUnauthorized
      - ErrorTypeRateLimited
      - ErrorTypeForbidden
      - ErrorTypeNeedsMarketState
      - ErrorTypeNotImplemented
      - ErrorTypeResourceConflict
    APIError:
      type: object
      description: Standard error response format returned by all API endpoints.
      properties:
        error:
          type: string
          description: Human-readable error message describing what went wrong.
        error_details:
          description: Additional structured information about the error.
          x-go-type: any
          x-go-type-skip-optional-pointer: true
          x-oapi-codegen-extra-tags:
            exhaustruct: optional
        error_type:
          $ref: '#/components/schemas/ErrorType'
      required:
      - error
      - error_type
    CreateRFQResponse:
      type: object
      properties:
        rfq_id:
          description: Unique, Moment-generated identifier for the RFQ.
          type: string
          example: 01JGEVEGS2X0EGYP1JK2X16AHV
          x-go-name: RfqID
      required:
      - rfq_id
    RiskGroupID:
      description: The risk group ID to use for this order. If not specified, the default risk group for the organization will be used. The risk group must belong to the organization specified by ib_id. Orders for which the risk group does not belong to the specified organization will be rejected with "invalid risk group id."
      type: string
    ExpireTimeNullable:
      type:
      - object
      - 'null'
      allOf:
      - $ref: '#/components/schemas/ExpireTime'
    CounterHistory:
      description: History of counter offers for an RFQ quote response.
      type: object
      properties:
        counter_type:
          $ref: '#/components/schemas/CounterType'
        created_at:
          description: The time at which the counter was created in RFC-3339 format.
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          description: The time at which the counter expires in RFC-3339 format.
          type:
          - string
          - 'null'
          format: date-time
        price:
          description: The price of the counter offer represented as a percentage of par.
          type: number
          x-go-type: decimal.Decimal
          x-go-type-import:
            path: github.com/shopspring/decimal
        price_value:
          description: An object to represent the price value. This can be a percent price, spread price, discount yield, money market yield.
          type: object
          x-go-type: prices.Price
          x-go-type-import:
            path: github.com/moment-technology/warren-protobuffett/types/go/prices
        quantity:
          $ref: '#/components/schemas/Size'
        quote_response_id:
          description: The ID of the quote response this counter is associated with.
          type: string
        settlement_date:
          description: The settlement date of the counter quote as a Unix timestamp.
          type:
          - integer
          - 'null'
          format: int64
        venue_price_type:
          description: The type of price used by the venue for this quote.
          $ref: '#/components/schemas/PriceValueType'
    DueTimeNullable:
      type:
      - object
      - 'null'
      allOf:
      - $ref: '#/components/schemas/DueTime'
    GetRFQResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/RFQ'
      - type: object
        required:
        - latest_msg_num
        properties:
          latest_msg_num:
            description: The `msg_number` for the most recent RFQ event corresponding to this RFQ. This is a string representation of a 64-bit unsigned integer `YYYYMMDDxxxxxxxxxx`.
            type: string
    RFQCancel:
      type: object
      allOf:
      - $ref: '#/components/schemas/RFQEvent'
      - $ref: '#/components/schemas/RFQEventSummary'
      - type: object
        required:
        - msg_type
        - event
        properties:
          event:
            $ref: '#/components/schemas/RFQCancelEvent'
          msg_type:
            type: string
            enum:
            - rfq_update
      title: RFQ Cancel Event
    ContraQuoteID:
      description: The ID of the quote that is being traded against.
      type: string
      title: Contra Quote ID
    ClientOrderID:
      description: Client-provided unique ID for the order.
      type: string
      title: Client Order ID
    DueTime:
      description: The time at which quotes for this RFQ are due.
      type: string
      format: date-time
    RFQFirmUntilTimeEvent:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseRFQEvent'
      - type: object
        required:
        - event_type
        - ib_id
        - firm_until_time
        properties:
          event_type:
            allOf:
            - $ref: '#/components/schemas/RFQEventTypeBase'
            - enum:
              - firm_until_time
          firm_until_time:
            $ref: '#/components/schemas/FirmUntilTime'
          ib_id:
            $ref: '#/components/schemas/IntroducingBrokerID_2'
    ListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GetRFQResponse'
      required:
      - data
    CreateRFQListItem:
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Size'
        client_rfq_id:
          $ref: '#/components/schemas/ClientRFQID'
        instrument_id:
          $ref: '#/components/schemas/ISIN'
        moment_order_id:
          description: When creating an RFQ to trade against an existing order, the identifier of the corresponding order.
          type: string
          example: 01FJ4B9B2D3H5Y8N0R0X3FQ1Z5
          title: Moment Order ID
          x-go-type: ulid.ULID
          x-go-type-import:
            path: github.com/moment-technology/go-shiny/pkg/ulid
        side:
          $ref: '#/components/schemas/Side'
      required:
      - client_rfq_id
      - instrument_id
      - side
      - amount
    VenueTraderInfo_2:
      description: Trader information for a venue.
      x-go-type: parentorder.VenueTraderInfo
      x-go-type-import:
        path: github.com/moment-technology/core-api/pkg/parentorder
    RFQQuoteResponse:
      type: object
      properties:
        client_order_id:
          $ref: '#/components/schemas/ClientOrderID'
        contra_quote_id:
          $ref: '#/components/schemas/ContraQuoteID'
        created_at:
          description: The time at which the quote response was created in RFC-3339 format.
          type:
          - string
          - 'null'
          format: date-time
        id:
          $ref: '#/components/schemas/OrderID'
        status:
          $ref: '#/components/schemas/RFQQuoteResponseStatus'
      required:
      - id
      - client_order_id
      - contra_quote_id
      - status
      - created_at
    VenueMPID:
      description: The Market Participant Identifier (MPID) of the venue.
      type: string
    RFQReject:
      type: object
      allOf:
      - $ref: '#/components/schemas/RFQEvent'
      - $ref: '#/components/schemas/RFQEventSummary'
      - type: object
        required:
        - msg_type
        - event
        properties:
          event:
            $ref: '#/components/schemas/RFQRejectEvent'
          msg_type:
            type: string
            enum:
            - rfq_update
      title: RFQ Reject Event
    SpreadPrice:
      description: The spread price of the RFQ represented as a percentage of par.
      type: object
      x-go-type: prices.SpreadPrice
      x-go-type-import:
        path: github.com/moment-technology/warren-protobuffett/types/go/prices
    CreateRFQList:
      type: object
      properties:
        disclosure:
          $ref: '#/components/schemas/Disclosure'
        due_time:
          $ref: '#/components/schemas/DueTime'
        expire_time:
          $ref: '#/components/schemas/ExpireTime'
        firm_until_time:
          $ref: '#/components/schemas/FirmUntilTime'
        ib_id:
          description: The ID of the introducing broker placing the RFQ list.
          type: string
          title: Introducing Broker ID
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreateRFQListItem'
        list_name:
          description: The name of this list of RFQs.
          type: string
          title: List Name
        risk_group_id:
          description: The ID of the risk group placing the RFQ list.
          type: string
          title: Risk Group ID
        skip_fees:
          description: Whether to skip fees for this RFQ list. If true, the quotes will not include fees.
          type: boolean
        type:
          $ref: '#/components/schemas/Type'
        venue_mpid:
          $ref: '#/components/schemas/VenueMPID'
        venue_trader_info:
          $ref: '#/components/schemas/VenueTraderInfo_2'
      required:
      - list_name
      - ib_id
      - risk_group_id
      - venue_mpid
      - type
      - disclosure
      - items
    RFQExpireEvent:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseRFQEvent'
      - type: object
        required:
        - event_type
        - ib_id
        - rfq_expired_at
        properties:
          event_type:
            allOf:
            - $ref: '#/components/schemas/RFQEventTypeBase'
            - enum:
              - expire
          ib_id:
            $ref: '#/components/schemas/IntroducingBrokerID_2'
          rfq_expired_at:
            description: The time at which the RFQ expired in RFC-3339 format.
            type: string
            format: date-time
    OrderID:
      description: Unique, Moment-generated ID for the order.
      type: string
      example: 01JBFQZXMWZ08XDMTG08P2Z4XT
      title: Order ID
      x-go-type: ulid.ULID
      x-go-type-import:
        path: github.com/moment-technology/go-shiny/pkg/ulid
    RFQRejectEvent:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseRFQEvent'
      - type: object
        required:
        - event_type
        - ib_id
        - reason
        properties:
          event_type:
            allOf:
            - $ref: '#/components/schemas/RFQEventTypeBase'
            - enum:
              - reject
          ib_id:
            $ref: '#/components/schemas/IntroducingBrokerID_2'
          reason:
            description: The reason for the rejection.
            type: string
    RFQAckEvent:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseRFQEvent'
      - type: object
        required:
        - event_type
        - ib_id
        properties:
          event_type:
            allOf:
            - $ref: '#/components/schemas/RFQEventTypeBase'
            - enum:
              - ack
          ib_id:
            $ref: '#/components/schemas/IntroducingBrokerID_2'
    RFQAck:
      type: object
      allOf:
      - $ref: '#/components/schemas/RFQEvent'
      - $ref: '#/components/schemas/RFQEventSummary'
      - type: object
        required:
        - msg_type
        - event
        properties:
          event:
            $ref: '#/components/schemas/RFQAckEvent'
          msg_type:
            type: string
            enum:
            - rfq_update
      title: RFQ Ack Event
    Type:
      description: The type of the RFQ.
      type: string
      enum:
      - bin
      - asap
      x-go-type: rfq.Type
      x-go-type-import:
        path: github.com/moment-technology/core-api/pkg/rfq
    RFQID:
      description: Unique, Moment-generated identifier for the RFQ.
      type: string
      example: 01JGEVEGS2X0EGYP1JK2X16AHV
      x-go-type: ulid.ULID
      x-go-type-import:
        path: github.com/moment-technology/go-shiny/pkg/ulid
    Price:
      description: The price of the RFQ represented as a percentage of par.
      type: number
      x-go-type: decimal.Decimal
      x-go-type-import:
        path: github.com/shopspring/decimal
    RFQApprove:
      type: object
      allOf:
      - $ref: '#/components/schemas/RFQEvent'
      - $ref: '#/components/schemas/RFQEventSummary'
      - type: object
        required:
        - msg_type
        - event
        properties:
          event:
            $ref: '#/components/schemas/RFQApproveEvent'
