      description: 'Removes one or more equity strategy securities and redistributes their combined weight across the remaining ones in proportion to their existing weights; the sources leave the buyable universe. A SecurityReplacementOverride targeting CSH_USD parks the freed weight in cash instead. `asset_subtypes` and `includes_cash` narrow which remaining securities receive a share; an ineligible one keeps its own weight.

