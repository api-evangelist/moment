          allOf:
          - $ref: '#/components/schemas/TaxRate'
          title: Custom Capital Gains Tax
          x-go-type-skip-optional-pointer: true
        account_total_value:
          description: 'The whole account''s value on every basis, with and without cash.

            Read only by validate-accounts, to build a `target` flavor''s

            denominator: `sleeve_target_allocation` times the entry matching

            the flavor''s `weight_basis` and `include_cash`. All three bases are

