          maximum: 100
          title: Tax Sensitivity
        short_term_tax_rate:
          description: Combined effective short-term tax rate (federal + state + local) as a decimal fraction. Used to estimate the tax bill on short-term realized gains.
          type: number
          minimum: 0
          maximum: 1
          title: Short Term Tax Rate
        long_term_tax_rate:
          description: Combined effective long-term tax rate (federal + state + local) as a decimal fraction. Used to estimate the tax bill on long-term realized gains.
          type: number
          minimum: 0
          maximum: 1
          title: Long Term Tax Rate
        tax_budget_weight:
          description: This account entry's share of the parent account's tax budget, in [0,1]. Sleeves of one account are optimized as independent entries, so each gets a pro-rata slice (by market value) of the account-level tax headroom; the optimizer scales every derived tax-budget cap (short/long-term and estimated-tax-bill) by this weight. Defaults to 1.0 (the whole budget) for single-entry accounts and callers that don't split.
