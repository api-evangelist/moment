            rebuild them from Accounts.'
          type: string
          title: ID
        sources:
          description: Instrument IDs to remove; their combined weight is redistributed pro-rata across the remaining strategy securities.
          type: array
          items:
            type: string
          title: Sources
        asset_subtypes:
          description: Only remaining securities of these refdata `asset_subtype` values receive a share of the freed weight; omitted or empty means all of them do. Accepts Stock, DepositoryReceipt, PreferredShares, Units, ExchangeTradedFund, ExchangeTradedCommodity and Fund. The account fails if nothing matches.
