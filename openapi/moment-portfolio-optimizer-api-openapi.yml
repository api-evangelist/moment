      description: 'Override that substitutes equity strategy securities 1:1 before optimization. The target replaces the source in both the tracking-error benchmark (inheriting the source''s weight) and the buyable universe; a held source remains sellable. A target of CSH_USD leaves that weight as cash. `map` is keyed by source instrument_id with target instrument_id values.

