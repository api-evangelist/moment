openapi: 3.0.0
info:
  title: Portfolio Optimizer API
  description: 'Moment''s Portfolio Optimizer API is a modern platform for generating fixed income portfolios.


    For complete documentation on the Portfolio Optimizer API and to obtain your keys head to https://withmoment.com/docs/api-documentation/api-v1/. Once you have your keys, head to the environments tab to quickly get started.'
  version: 0.1.0
  contact:
    name: Moment Support
    email: support@withmoment.com
    url: https://withmoment.com/support
servers:
- url: https://live.moment-api.com
- url: https://paper.moment-api.com
security:
- bearerAuth: []
paths:
  /v1/optimization/:
    post:
      tags:
      - Optimization
      summary: Submit Optimization
      description: 'The Submit Optimization API submits a set of accounts and their strategies to generate an optimized portfolio.


        The API returns an optimization ID that can be used to check the status of the optimization and retrieve the orders generated by the optimization.'
      operationId: postOptimization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  optimization_id:
                    type: string
                    title: Optimization ID
                required:
                - optimization_id
  /v1/optimization/backtests/:
    post:
      tags:
      - Backtesting
      summary: Submit Backtest
      description: 'The Submit Backtest API initiates a backtest of portfolio optimizations over a specified date range.


        The API returns a backtest ID that can be used to check the status of the backtest and retrieve the results of the optimizations.'
      operationId: postBacktest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  backtest_id:
                    type: string
                    title: Backtest ID
  /v1/optimization/backtests/{backtest_id}/:
    get:
      tags:
      - Backtesting
      summary: Get Backtest Status
      description: 'The Get Backtest Status API returns the current status and results of a specific backtest.


        If the specified backtest ID does not exist, you will receive a `not_found` error.'
      operationId: getBacktestStatus
      parameters:
      - name: backtest_id
        in: path
        required: true
        schema:
          type: string
          title: Backtest ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestResult'
  /v1/optimization/preview/:
    post:
      tags:
      - Optimization
      summary: Generate Preview
      description: 'The Generate Preview API submits an account and its strategy to create a preview of

        an optimized portfolio. This endpoint synchronously returns the generated orders for

        the account, utilizing cached market data and relaxing certain constraints to quickly

        provide a preview of the expected orders. Note that the `Trade` constraint is not enforced, when generating a preview.'
      operationId: postPreview
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                    title: Orders
  /v1/optimization/replacement-candidates/:
    post:
      tags:
      - Optimization
      summary: Get Replacement Candidates
      description: The Get Replacement Candidates API returns the replacement candidates for a specific instrument, across a set of accounts.
      operationId: postReplacementCandidates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacementCandidatesRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplacementCandidatesResponse'
  /v1/optimization/{optimization_id}/:
    get:
      tags:
      - Optimization
      summary: Get Optimization Status
      description: 'The Get Optimization Status API returns the status for a specific optimization. The status can be one of the following:

        - `queued`: The optimization has been queued for processing.

        - `running`: The optimization is currently running.

        - `success`: The optimization has completed successfully.

        - `failed`: The optimization has failed.

        - `unknown`: The status of the optimization is unknown.


        If the specified optimization ID does not exist, you will receive a `not_found` error.'
      operationId: getOptimizationStatus
      parameters:
      - name: optimization_id
        in: path
        required: true
        schema:
          type: string
          title: Optimization ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/OptimizationStatus'
                required:
                - status
  /v1/optimization/{optimization_id}/orders/:
    get:
      tags:
      - Optimization
      summary: Get Optimization Orders
      description: 'The Get Optimization Orders API returns the orders for a specific optimization.


        If the specified optimization ID does not exist, you will receive a `not_found` error.'
      operationId: getOptimizationsOrders
      parameters:
      - name: optimization_id
        in: path
        required: true
        schema:
          type: string
          title: Optimization ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                    title: Orders
                required:
                - orders
components:
  schemas:
    OptimizationStatus:
      description: Lifecycle state of a single optimization run.
      type: string
      enum:
      - queued
      - running
      - success
      - failed
      - unknown
      title: OptimizationStatus
    Decimal:
      type: number
      format: double
      title: Decimal
      x-go-type: decimal.Decimal
      x-go-type-import:
        path: github.com/shopspring/decimal
        name: decimal
    InstrumentID:
      description: Instrument ISIN
      type: string
      example: US594918AD66
      title: Instrument ID
    FilterDictionary:
      type: object
      properties:
        and:
          description: A list of filters to be applied in an AND relationship.
          type: array
          items:
            $ref: '#/components/schemas/FilterDictionary'
          default: []
          title: And
        and_list:
          description: Alias for `and`. A list of filters to be applied in an AND relationship. Supplying both `and` and `and_list` is an error.
          type: array
          items:
            $ref: '#/components/schemas/FilterDictionary'
          title: And List
        not:
          description: A filter to be applied in a NOT relationship.
          $ref: '#/components/schemas/FilterDictionary'
          title: Not
        not_filter:
          description: Alias for `not`. A filter to be applied in a NOT relationship. Supplying both `not` and `not_filter` is an error.
          $ref: '#/components/schemas/FilterDictionary'
          title: Not Filter
        or:
          description: A list of filters to be applied in an OR relationship.
          type: array
          items:
            $ref: '#/components/schemas/FilterDictionary'
          default: []
          title: Or
        or_list:
          description: Alias for `or`. A list of filters to be applied in an OR relationship. Supplying both `or` and `or_list` is an error.
          type: array
          items:
            $ref: '#/components/schemas/FilterDictionary'
          title: Or List
      additionalProperties:
        $ref: '#/components/schemas/Filter'
      title: FilterDictionary
    Filter:
      type: object
      properties:
        equal_to:
          description: The value to be equal to.
          anyOf:
          - type: string
          - type: number
          - type: boolean
          title: Equal To
        greater_than:
          description: The value to be greater than.
          anyOf:
          - type: string
          - type: number
          - type: boolean
          title: Greater Than
        greater_than_or_equal_to:
          description: The value to be greater than or equal to.
          anyOf:
          - type: string
          - type: number
          - type: boolean
          title: Greater Than Or Equal To
        in:
          description: The value to be in the list.
          anyOf:
          - items:
              anyOf:
              - type: string
              - type: number
              - type: boolean
            type: array
          title: In List
        in_filter_list:
          description: The value to be in the filter list.
          type: string
          title: In Filter List
        in_list:
          description: Alias for `in`. The value to be in the list. Supplying both `in` and `in_list` is an error.
          anyOf:
          - items:
              anyOf:
              - type: string
              - type: number
              - type: boolean
            type: array
          title: In List
        includes:
          description: The value to include.
          type: string
          title: Includes
        superset:
          description: Match a string-list column containing every element of this list. Elements match exactly and case-sensitively; leading and trailing whitespace is ignored. Null lists do not match.
          type: array
          items:
            type: string
          minItems: 1
          example:
          - NY
          - NJ
          title: Superset
        subset:
          description: Match a string-list column whose every element is in this list. Elements match exactly and case-sensitively; leading and trailing whitespace is ignored. Empty lists match; null lists do not.
          type: array
          items:
            type: string
          minItems: 1
          example:
          - NY
          - NJ
          title: Subset
        not_superset:
          description: 'Match a string-list column missing at least one element of this list. The negation of `superset`: null lists match.'
          type: array
          items:
            type: string
          minItems: 1
          example:
          - NY
          - NJ
          title: Not Superset
        not_subset:
          description: 'Match a string-list column with at least one element outside this list. The negation of `subset`: null lists match; empty lists do not.'
          type: array
          items:
            type: string
          minItems: 1
          example:
          - NY
          - NJ
          title: Not Subset
        is_null:
          description: Match values that are null.
          type: boolean
          title: Is Null
        less_than:
          description: The value to be less than.
          anyOf:
          - type: string
          - type: number
          - type: boolean
          title: Less Than
        less_than_or_equal_to:
          description: The value to be less than or equal to.
          anyOf:
          - type: string
          - type: number
          - type: boolean
          title: Less Than Or Equal To
        not_equal_to:
          description: The value to not be equal to.
          anyOf:
          - type: string
          - type: number
          - type: boolean
          title: Not Equal To
        not_in:
          description: The value to not be in the list.
          anyOf:
          - items:
              anyOf:
              - type: string
              - type: number
              - type: boolean
            type: array
          title: Not In List
        not_in_filter_list:
          description: The value to be not in the filter list.
          type: string
          title: Not In Filter List
        not_in_list:
          description: Alias for `not_in`. The value to not be in the list. Supplying both `not_in` and `not_in_list` is an error.
          anyOf:
          - items:
              anyOf:
              - type: string
              - type: number
              - type: boolean
            type: array
          title: Not In List
        not_includes:
          description: The value to not include.
          type: string
          title: Not Includes
        not_starts_with:
          description: The value to not start with.
          type: string
          title: Not Starts With
        starts_with:
          description: The value to start with.
          type: string
          title: Starts With
        ends_with:
          description: The value to end with.
          type: string
          title: Ends With
      title: Filter
    EvaluatedFieldTerm:
      description: A field term decorated with its evaluated value.
      type: object
      properties:
        factor:
          description: The scaling factor applied to the field value.
          type: number
          format: double
          default: 1
        field:
          description: The name of the field to reference.
          type: string
        filter:
          description: Optional filter applied to the field.
          $ref: '#/components/schemas/FilterDictionary'
        type:
          type: string
          enum:
          - field
          default: field
        value:
          description: The evaluated value of this field term.
          type: number
          format: double
      required:
      - type
      - field
      - value
      title: EvaluatedFieldTerm
    EvaluatedObjectiveTerm:
      description: An evaluated objective term with computed values at each node of the term tree.
      discriminator:
        propertyName: type
        mapping:
          field: '#/components/schemas/EvaluatedFieldTerm'
          operation: '#/components/schemas/EvaluatedOperationTerm'
      oneOf:
      - $ref: '#/components/schemas/EvaluatedFieldTerm'
      - $ref: '#/components/schemas/EvaluatedOperationTerm'
      title: EvaluatedObjectiveTerm
    ObjectiveTermOperation:
      description: The operation to apply between objective terms.
      type: string
      enum:
      - add
      - subtract
      - multiply
      - divide
      - max
      - min
      title: ObjectiveTermOperation
    EvaluatedOperationTerm:
      description: An operation term decorated with its computed value and evaluated children.
      type: object
      properties:
        left:
          $ref: '#/components/schemas/EvaluatedObjectiveTerm'
        operation:
          description: The operation to apply.
          $ref: '#/components/schemas/ObjectiveTermOperation'
        right:
          $ref: '#/components/schemas/EvaluatedObjectiveTerm'
        type:
          type: string
          enum:
          - operation
          default: operation
        value:
          description: The computed result of applying the operation.
          type: number
          format: double
      required:
      - type
      - operation
      - left
      - right
      - value
      title: EvaluatedOperationTerm
    ObjectiveComponentDetail:
      description: An enriched objective function component with a decorated term tree containing evaluated values at each node.
      type: object
      properties:
        factor:
          description: The scaling factor applied to the term value.
          type: number
          format: double
          title: Factor
        term:
          description: The evaluated term tree with computed values at each node.
          $ref: '#/components/schemas/EvaluatedObjectiveTerm'
          title: Term
        value:
          description: The computed value of this component (factor * evaluated term value).
          $ref: '#/components/schemas/Decimal'
          title: Value
      required:
      - factor
      - term
      - value
      title: ObjectiveComponentDetail
    Side:
      type: string
      enum:
      - buy
      - sell
      title: Side
    OrderSizeType:
      description: 'The unit in which the optimizer decided an order''s size: share count (equity, ETF), par dollars (fixed income), or notional dollars (mutual funds). Mirrors the trading-system order size types.'
      type: string
      enum:
      - shares
      - par
      - notional
      x-enum-varnames:
      - OrderSizeTypeShares
      - OrderSizeTypePar
      - OrderSizeTypeNotional
      title: Order Size Type
    Order:
      type: object
      properties:
        account_id:
          description: The account ID that the order belongs to. On account-based optimization this is the composite `{account_id}:{sleeve_id}`, not a bare account id.
          type: string
          title: Account ID
        block_id:
          description: A unique ID for the block trade that the order belongs to. This can be used to easily group orders that can be submitted as part of a single block trade.
          type: integer
          title: Block ID
        cusip:
          description: The CUSIP is a nine-digit numeric or nine-character alphanumeric code that identifies a North American financial security.
          type: string
          example: 594918AD6
          title: CUSIP
        instrument_id:
          $ref: '#/components/schemas/InstrumentID'
        is_full_liquidation:
          description: True when this sell order takes the whole position to zero. On notional (mutual fund) orders it also means `net_money` may carry a sub-dollar remainder, so consumers must use it as given rather than rounding it to whole dollars and re-deriving the share count. Absent or false on buys, on partial sells, and from optimizers that predate the field.
          type: boolean
          title: Is Full Liquidation
        is_sale_violating_universe_constraint:
          description: A flag to indicate whether a sell order is due to a universe constraint violation. Will be left null for buy orders.
          type: boolean
          title: Is Sale Violating Universe Constraint
        limit_price:
          description: The limit price of the order.
          $ref: '#/components/schemas/Decimal'
          title: Limit Price
        limit_ytm:
          description: The limit yield to maturity of the order.
          $ref: '#/components/schemas/Decimal'
          title: Limit Yield to Maturity
        limit_ytw:
          description: The limit yield to worst of the order.
          $ref: '#/components/schemas/Decimal'
          title: Limit Yield to Worst
        lock:
          description: If true, this order was locked from a prior proposal and passed through unchanged.
          type: boolean
          title: Lock
        lot_id:
          description: Unique identifier for the lot (moment_lot_id). Present on sell orders when lot-level optimization is enabled.
          type: string
          title: Lot ID
        net_money:
          description: The net money of the order in dollars. This is caclulated as quantity * (limit_price / 100) + (quantity / par_value) * accrued_interest.
          $ref: '#/components/schemas/Decimal'
          title: Net Money
        objective:
          description: The optimization objective value returned by the optimizer for this order.
          $ref: '#/components/schemas/Decimal'
          title: Objective
        objective_components:
          description: Enriched objective function decomposition with full term definitions, computed values, and individual leaf values for each component.
          type: array
          items:
            $ref: '#/components/schemas/ObjectiveComponentDetail'
          title: Objective Components
        par_value:
          description: The par value of the instrument.
          $ref: '#/components/schemas/Decimal'
          title: Par Value
        portfolio_id:
          description: The portfolio the order belongs to. Household optimization only.
          type: string
          title: Portfolio ID
        quantity:
          description: The quantity of the instrument to be traded, in notional value.
          $ref: '#/components/schemas/Decimal'
          title: Quantity
        side:
          $ref: '#/components/schemas/Side'
        size_type:
          description: The unit in which the optimizer decided this order's size. For notional orders (mutual funds), net_money carries the exact decided dollars and is the authoritative order size; quantity is the derived share count (net_money / NAV) and carries float-division error. For shares / par orders, quantity is authoritative.
          $ref: '#/components/schemas/OrderSizeType'
          title: Size Type
        sleeve_id:
          description: The sleeve (the account-and-portfolio cell) the order belongs to. Household optimization only.
          type: string
          title: Sleeve ID
        tax_effective_limit_ytw:
          description: The tax effective limit yield to worst of the order. Calculated as limit_ytw * (1 - tax_rate) / (1 - federal_tax_rate - state_tax_rate - local_tax_rate)
          $ref: '#/components/schemas/Decimal'
          title: Tax Effective Limit Yield to Worst
        post_tax_limit_ytw:
          description: The post-tax limit yield to worst of the order.
          $ref: '#/components/schemas/Decimal'
          title: Post Tax Limit Yield to Worst
        transaction_cost:
          description: The estimated transaction cost of the order.
          type: number
          title: Transaction Cost
      required:
      - block_id
      - side
      - instrument_id
      - quantity
      - limit_price
      - account_id
      - net_money
      title: Order
    NullDecimal:
      type: number
      format: double
      title: NullDecimal
      nullable: true
      x-go-type: decimal.NullDecimal
      x-go-type-import:
        path: github.com/shopspring/decimal
        name: decimal
    FixedCostPerTrade:
      description: An optional fixed cost per trade to apply to the optimization.
      type: number
      minimum: 0
      title: Fixed Cost Per Trade
    OptimizationRequest:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountOptimization'
          title: Accounts
        allow_sell_universe_constraint_violations:
          description: When true, the optimizer is allowed to keep existing holdings that violate sell-universe constraints (no forced sells purely to clear universe violations). Mirrored onto every account in the request.
          type: boolean
          default: false
          title: Allow Sell Universe Constraint Violations
          x-go-type-skip-optional-pointer: true
        batch_id:
          description: An optional batch ID to group optimizations together. This can be used to easily identify optimizations that were submitted together. Must contain only alphanumeric characters, hyphens, and underscores.
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          nullable: true
        fixed_cost_per_trade:
          $ref: '#/components/schemas/FixedCostPerTrade'
        limit_price_buffer:
          description: An optional limit price buffer to apply to the optimization. This is a percentage value that will be added to the limit price of all the orders.
          $ref: '#/components/schemas/NonNegativeDecimal'
          title: Limit Price Buffer
        optimization_source:
          description: Origin tag for the request, recorded for audit and used by downstream filtering. Taken from the `Moment-Optimization-Source` request header, falling back to a per-route default when that header is absent or unrecognized; a value supplied in the request body is ignored.
          allOf:
          - $ref: '#/components/schemas/OptimizationSource'
          nullable: true
        optimizer_params:
          $ref: '#/components/schemas/OptionalOptimizerParams'
        organization_id:
          description: Organization identifier, taken from the authenticated `Moment-Organization` request header. A value supplied in the request body is ignored; responses that serve a stored request payload back report the header-derived value.
          type: string
          nullable: true
          title: Organization ID
        parent_organization_id:
          description: Parent organization identifier, taken from the authenticated `Moment-Parent-Organization` request header. A value supplied in the request body is ignored; responses that serve a stored request payload back report the header-derived value.
          type: string
          nullable: true
          title: Parent Organization ID
        timestamp:
          description: An optional historical timestamp at which to run the optimization. The timestamp's date must be between 2024-05-01 and the current date, and the timestamp's time must be between 09:35 AM and 4:00 PM Eastern Time.
          type: string
          format: date-time
          nullable: true
          title: Timestamp
        valuation_config:
          description: 'Valuation configuration the caller resolved for the requesting org,

            typically a proposal''s. If absent, the optimizer resolves the org''s

            configuration itself.'
          allOf:
          - $ref: '#/components/schemas/ValuationConfig'
          nullable: true
      required:
      - accounts
      - optimizer_params
      title: OptimizationRequest
    AllowRebalancing:
      description: A boolean flag to indicate if rebalancing is allowed in the optimization.
      type: boolean
      default: false
      title: Allow Rebalancing
    AllowSellUniverseConstraintViolations:
      description: A boolean flag to indicate if sells are allowed in the optimization. This will enable selling of securities that invalidate any `Universe` constraints.
      type: boolean
      default: false
      title: Allow Sell Universe Constraint Violations
    FieldTerm:
      description: A term that references a field value from the instrument data.
      type: object
      properties:
        factor:
          description: The scaling factor applied to the field value.
          type: number
          format: double
          default: 1
        field:
          description: The name of the field to reference.
          type: string
        filter:
          description: Optional filter applied to the field.
          $ref: '#/components/schemas/FilterDictionary'
        type:
          type: string
          enum:
          - field
          default: field
      required:
      - type
      - field
      title: FieldTerm
    ConcreteObjectiveTerm:
      description: A leaf or operation node in an objective term tree — either a field reference or an operation applied to other nodes.
      discriminator:
        propertyName: type
        mapping:
          field: '#/components/schemas/FieldTerm'
          operation: '#/components/schemas/OperationTerm'
      oneOf:
      - $ref: '#/components/schemas/FieldTerm'
      - $ref: '#/components/schemas/OperationTerm'
      title: ConcreteObjectiveTerm
    OperationTerm:
      description: A term that applies an operation to other terms.
      type: object
      properties:
        left:
          description: The left operand.
          $ref: '#/components/schemas/ConcreteObjectiveTerm'
        operation:
          description: The operation to apply.
          $ref: '#/components/schemas/ObjectiveTermOperation'
        right:
          description: The right operand.
          $ref: '#/components/schemas/ConcreteObjectiveTerm'
        type:
          type: string
          enum:
          - operation
          default: operation
      required:
      - type
      - operation
      - left
      - right
      title: OperationTerm
    ObjectiveTerm:
      description: Top-level wrapper for an objective function term with scaling factor.
      type: object
      properties:
        factor:
          description: The scaling factor applied to the term value.
          type: number
          format: double
          default: 1
        term:
          $ref: '#/components/schemas/ConcreteObjectiveTerm'
      required:
      - term
      title: ObjectiveTerm
    NonNegativeDecimal:
      description: A decimal quantity that must not be negative.
      type: number
      format: double
      minimum: 0
      title: NonNegativeDecimal
      x-go-type: decimal.Decimal
      x-go-type-import:
        path: github.com/shopspring/decimal
        name: decimal
    CashRaiseRequest:
      type: object
      properties:
        min_raise_amount:
          description: The minimum amount of cash to raise.
          $ref: '#/components/schemas/NonNegativeDecimal'
        raise_strategy:
          description: The strategy to use to raise cash. `maintain_compliance` will raise cash to maintain compliance with the existing constraints.
          type: string
          enum:
          - maintain_compliance
      required:
      - min_raise_amount
      - raise_strategy
      title: CashRaiseRequest
    CashflowTarget:
      type: object
      properties:
        amount:
          description: The amount of cashflow to target for each bucket. Omit for no dollar floor (the maximize_cashflows input).
          type: number
          format: double
          minimum: 0
          title: Amount
        call_assumption:
          description: The call assumption of the cashflow target.
          type: string
          enum:
          - maturity_date
          - next_call_date
          - workout_date
          title: Call Assumption
        end_date:
          description: The end date of the cashflow target.
          type: string
          format: date
          title: End Date
        frequency:
