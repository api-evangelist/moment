            field) into `average_value` constraints and the three rating

            averages (`avg_sp_rating`, `avg_moodys_rating`, `avg_lowest_rating`)

            only, and is refused under `invested_mv`. The fixed-denominator

            averages still follow `weight_denominator_formulation` alone.

            `false` is a no-op. Cash never joins an `allocation` bucket, and

            this field is not in this schema''s immutable-after-creation set.'
