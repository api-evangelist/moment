    ValuationConfig:
      description: 'How statistics are computed: the valuation basis (clean, dirty or par),

        the price they are computed on (eval or limit), and what portfolio weights

        are denominated against. Immutable after proposal creation.'
      type: object
      properties:
        basis:
          description: 'Valuation basis to build market-value weight columns and

            totals on. clean excludes accrued interest; dirty includes it;

            par values a position at its factor-adjusted (current) face —

            quantity × principal_factor — ignoring market price and accrued

            interest, so a paid-down bond values at remaining face.

            Instruments with no par value (equities) continue to be valued

            at their quoted price on every basis, including par.

