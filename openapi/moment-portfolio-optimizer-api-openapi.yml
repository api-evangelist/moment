        weight_denominator_formulation:
          description: 'What portfolio-weight bounds are denominated against. `total_mv` is

            the account''s total market value (held securities plus cash);

            `invested_mv` is the post-trade market value of held securities

            alone, so uninvested cash does not dilute a weight. Affects only

            bounds expressed as weights — an explicit market-value bound is

            unchanged. If absent, gets derived by proposal kind: `invested_mv`

            for synthetic proposals, `total_mv` for real-account proposals,

