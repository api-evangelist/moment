tags:
- name: Calendar
paths:
  /v1/trading/calendar/:
    get:
      tags:
      - Calendar
      summary: Trading Calendar
      description: The Trading Calendar API returns a list of days in sequential order, with information regarding whether that day is a full trading day, half trading day, holiday, or weekend. Currently, Moment only supports dates between 2023-08-01 and 2026-01-01 (inclusive).
      operationId: getTradingCalendar
      parameters:
      - name: start_date
        in: query
        description: The start date of the calendar formatted as yyyy-mm-dd.
        schema:
          type: string
        example: '2023-08-01'
      - name: end_date
        in: query
        description: The end date of the calendar formatted as yyyy-mm-dd.
        schema:
          type: string
        example: '2026-01-01'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    description: A list containing information about each day between the start_date and end_date.
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          description: The date in yyyy-mm-dd format.
                          type: string
                          example: '2023-08-01'
                        day_type:
                          description: The type of trading day.
                          type: string
                          enum:
                          - full_trading_day
                          - half_trading_day
                          - holiday
                          - weekend
