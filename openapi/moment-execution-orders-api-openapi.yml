openapi: 3.2.0
info:
  title: Execution Orders API
  description: 'Moment''s Orders API is a modern platform for algorithmic fixed income trading.

    For complete documentation on the Orders API and to obtain your keys, visit:

    Moment API Documentation.

    Once you have your keys, go to the environments tab to quickly get started.'
  version: 1.0.0
  contact:
    name: Moment Support
    email: support@withmoment.com
    url: https://withmoment.com/support
servers:
- url: https://live.moment-api.com
- url: https://paper.moment-api.com
tags:
- name: Execution Orders
paths:
  /v1/trading/order/{id}/execution-order/custodian/manual/:
    post:
      tags:
      - Execution Orders
      summary: Create a Custodian Manual Execution Order
      description: 'Creates an execution order routed directly to a custodian for the given parent order.


        **Requirements:**

        - The parent order must be in the `pending_execution` or `partially_filled` state.

        - `amount.type` must be `shares` or `notional`. `par` is not supported on this endpoint.

        - `limit_price`, when provided, is interpreted as price per share.

        - Multiple execution orders can be created for a single order provided that the sum of their open quantities does not exceed the open quantity of the order.


        Once submitted, you will receive one of the following events:

        - A `system_update` event with an `event_type` of `execution_order_request` that indicates the request was received.

        - A `system_update` event with an `event_type` of `execution_order_reject` if the request fails.

        - An `order_update` event with an `event_type` of `execution_order_create` if the request succeeds & is pending execution.


        All events include the `execution_order_id`.'
      operationId: createExecutionOrderCustodianManual
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderID'
      - name: Moment-User
        in: header
        required: true
        schema:
          type: string
      - name: Moment-Organization
        in: header
        required: true
        schema:
          type: string
      - name: Moment-Parent-Organization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionOrderRequest_CustodianManual'
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionOrderResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/trading/order/{id}/execution-order/external/:
    post:
      tags:
      - Execution Orders
      summary: Create an External Trade Execution Order
      description: 'Creates an execution order for processing an external trade for the specified order. A user may want to trade off-platform and report the trade to Moment for record-keeping & updating the order status, this endpoint facilitates that.


        **Requirements:**

        - The parent order must be in the `pending_execution` or `partially_filled` state.

        - Multiple execution orders can be created for a single order provided that the sum of their open quantities does not exceed the open quantity of the order.


        Once submitted, you will receive one of the following events:

        - A `system_update` event with an `event_type` of `execution_order_request` that indicates the request was received.

        - A `system_update` event with an `event_type` of `execution_order_reject` if the request fails.

        - An `order_update` event with an `event_type` of `execution_order_create` if the request succeeds & is pending execution.


        All events include the `execution_order_id`.'
      operationId: createExecutionOrderExternalTrade
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderID'
      - name: Moment-User
        in: header
        required: true
        schema:
          type: string
      - name: Moment-Organization
        in: header
        required: true
        schema:
          type: string
      - name: Moment-Parent-Organization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionOrderRequest_External'
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionOrderResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/trading/order/{id}/execution-order/lob/manual/:
    post:
      tags:
      - Execution Orders
      summary: Create a LOB Manual Execution Order
      description: 'Creates an execution order for trading on the limit order book for a specific venue and ISIN.


        **Requirements:**

        - The parent order must be in the `pending_execution` or `partially_filled` state.

        - Multiple execution orders can be created for a single order provided that the sum of their open quantities does not exceed the open quantity of the order.


        Once submitted, you will receive one of the following events:

        - A `system_update` event with an `event_type` of `execution_order_request` that indicates the request was received.

        - A `system_update` event with an `event_type` of `execution_order_reject` if the request fails.

        - An `order_update` event with an `event_type` of `execution_order_create` if the request succeeds & is pending execution.


        All events include the `execution_order_id`.'
      operationId: createExecutionOrderLobManual
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderID'
      - name: Moment-User
        in: header
        required: true
        schema:
          type: string
      - name: Moment-Organization
        in: header
        required: true
        schema:
          type: string
      - name: Moment-Parent-Organization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionOrderRequest_LOBManual'
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionOrderResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/trading/order/{id}/execution-order/lob/sor/:
    post:
      tags:
      - Execution Orders
      summary: Create a LOB SOR Execution Order
      description: 'Creates an execution order for trading on the limit order books using Smart Order Routing (SOR).


        **Requirements:**

        - The parent order must be in the `pending_execution` or `partially_filled` state.

        - Multiple execution orders can be created for a single order provided that the sum of their open quantities does not exceed the open quantity of the order.


        Once submitted, you will receive one of the following events:

        - A `system_update` event with an `event_type` of `execution_order_request` that indicates the request was received.

        - A `system_update` event with an `event_type` of `execution_order_reject` if the request fails.

        - An `order_update` event with an `event_type` of `execution_order_create` if the request succeeds & is pending execution.


        All events include the `execution_order_id`.'
      operationId: createExecutionOrderLobSor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderID'
      - name: Moment-User
        in: header
        required: true
        schema:
          type: string
      - name: Moment-Organization
        in: header
        required: true
        schema:
          type: string
      - name: Moment-Parent-Organization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionOrderRequest_LOBSOR'
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionOrderResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/trading/order/{id}/execution-order/rfq/autoex/:
    post:
      tags:
      - Execution Orders
      summary: Create an AutoEx RFQ Execution Order
      description: 'Creates an AutoEx RFQ execution order for the given order.


        **Requirements:**

        - The parent order must be in the `pending_execution` or `partially_filled` state.

        - Multiple execution orders can be created for a single order provided that the sum of their open quantities does not exceed the open quantity of the order.


        Once submitted, you will receive one of the following events:

        - A `system_update` event with an `event_type` of `execution_order_request` that indicates the request was received.

        - A `system_update` event with an `event_type` of `execution_order_reject` if the request fails.

        - An `order_update` event with an `event_type` of `execution_order_create` if the request succeeds & is pending execution.


        All events include the `execution_order_id`.'
      operationId: createExecutionOrderAutoExRFQ
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderID'
      - name: Moment-User
        in: header
        required: true
        schema:
          type: string
      - name: Moment-Organization
        in: header
        required: true
        schema:
          type: string
      - name: Moment-Parent-Organization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionOrderRequest_AutoExRFQ'
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionOrderResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/trading/order/{id}/execution-order/rfq/manual/:
    post:
      tags:
      - Execution Orders
      summary: Create an RFQ Quote Response Execution Order
      description: 'Creates an execution order in response to an RFQ quote for the given order.


        **Requirements:**

        - The parent order must be in the `pending_execution` or `partially_filled` state.

        - Multiple execution orders can be created for a single order provided that the sum of their open quantities does not exceed the open quantity of the order.


        Once submitted, you will receive one of the following events:

        - A `system_update` event with an `event_type` of `execution_order_request` that indicates the request was received.

        - A `system_update` event with an `event_type` of `execution_order_reject` if the request fails.

        - An `order_update` event with an `event_type` of `execution_order_create` if the request succeeds & is pending execution.


        All events include the `execution_order_id`.'
      operationId: createExecutionOrderManualRFQ
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderID'
      - name: Moment-User
        in: header
        required: true
        schema:
          type: string
      - name: Moment-Organization
        in: header
        required: true
        schema:
          type: string
      - name: Moment-Parent-Organization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionOrderRequest_ManualRFQ'
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionOrderResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/trading/order/{id}/execution-order/{execution_order_id}/:
    delete:
      tags:
      - Execution Orders
      summary: Cancel an Execution Order
      description: 'Cancels the specified execution order for the given order.


        **Requirements:**

        - The execution order must be in the `pending_execution` or `partially_filled` state.


        Event notifications:

        - On Reciept: a `system_update` event with an `event_type` of `execution_order_cancel_request`.

        - On failure: a `system_update` event with an `event_type` of `execution_order_cancel_reject`.

        - On success: an `order_update` event with an `event_type` of `execution_order_cancel`.


        All events include the `execution_order_id`.'
      operationId: cancelExecutionOrder
      parameters:
      - name: Moment-User
        in: header
        required: true
        schema:
          type: string
      - name: Moment-Organization
        in: header
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderID'
      - name: execution_order_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ExecutionOrderID'
      responses:
        '204':
          description: The cancellation request for the execution order has been submitted.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/trading/order/{id}/execution-order/{execution_order_id}/external/trade-report/:
    post:
      tags:
      - Execution Orders
      summary: Report an External Trade
      description: 'Reports an executed external trade for a pre-existing execution order.


        **Requirements:**

        - An execution order of protocol `external` must exist.

        - The execution order must be in the `pending_execution` state.


        Event notifications:

        - On Reciept: a `system_update` event with an `event_type` of `external_trade_report_request`.

        - On failure: a `system_update` event with an `event_type` of `external_trade_report_rejected`.

        - On success: an `order_update` event with an `event_type` of `execution` which includes the trade details & the execution order ID linked to the trade.


        All events include the `external_trade_report_id`.'
      operationId: reportExternalTrade
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderID'
      - name: execution_order_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ExecutionOrderID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalTradeReport'
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalTradeReportResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
components:
  schemas:
    ExecutionOrderID:
      description: The unique ID of the execution order.
      type: string
      example: 01JBFQZXMWZ08XDMTG08P2Z4XT
    PriceValueType:
      title: Price Value Type
      type: string
      description: The method used to represent the price value.
      enum:
      - percent
      - discount_yield
      - spread
      - money_market_yield
      - per_share
      x-enumNames:
      - PriceValueTypePercent
      - PriceValueTypeDiscountYield
      - PriceValueTypeSpread
      - PriceValueTypeMMYield
      - PriceValueTypePerShare
      default: percent
    FeeType:
      title: Fee Type
      type: string
      description: The type of fee to apply to the order. Valid values are "markup", "commission", and "sales_credit".
      enum:
      - markup
      - commission
      - sales_credit
      x-enumNames:
      - FeeTypeMarkup
      - FeeTypeCommission
      - FeeTypeSalesCredit
    SnapshotQuote:
      type: object
      properties:
        yield_to_maturity:
          type: number
          format: double
          description: 'Deprecated: not mapped to domain model, will be removed. Use post_fee_ytm instead.'
          deprecated: true
        yield_to_worst:
          type: number
          format: double
          description: 'Deprecated: not mapped to domain model, will be removed. Use post_fee_ytw instead.'
          deprecated: true
        size:
          type: integer
        min_size:
          type: integer
        venue_mpid:
          type: string
        spread_benchmark_isin:
          type:
          - string
          - 'null'
        spread_to_benchmark_bps:
          type:
          - string
          - 'null'
        min_balance_remaining:
          type:
          - integer
          - 'null'
        min_increment:
          type:
          - integer
          - 'null'
        source:
          type: string
          enum:
          - LOB
          - RFQ
        pre_fee_price:
          type: number
          format: double
        post_fee_price:
          type: number
          format: double
        pre_fee_ytw:
          type: number
          format: double
          description: Pre-fee yield to worst (street price, no fees).
        post_fee_ytw:
          type: number
          format: double
          description: Post-fee yield to worst (inclusive of Moment fees).
        pre_fee_ytm:
          type: number
          format: double
          description: Pre-fee yield to maturity (street price, no fees).
        post_fee_ytm:
          type: number
          format: double
          description: Post-fee yield to maturity (inclusive of Moment fees).
        pre_fee_spread_bps:
          type:
          - number
          - 'null'
          format: double
        post_fee_spread_bps:
          type:
          - number
          - 'null'
          format: double
        side:
          type: string
          enum:
          - bid
          - ask
        disabled:
          type: boolean
        rfq_quote_status:
          type: string
        rfq_id:
          type: string
        venue_quote_id:
          type: string
        settlement_date:
          type: integer
          format: int64
      required:
      - size
      - min_size
      - venue_mpid
      - source
      - pre_fee_price
      - post_fee_price
      - pre_fee_ytm
      - pre_fee_ytw
      - post_fee_ytm
      - post_fee_ytw
      - side
      - disabled
      - settlement_date
    ExternalTradeReportResponse:
      type: object
      properties:
        external_trade_report_id:
          $ref: '#/components/schemas/ExternalTradeReportID'
      required:
      - external_trade_report_id
    ExternalTradeReport:
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/OrderSize'
        annotation:
          description: Optional annotation for the trade.
          type:
          - string
          - 'null'
        bypass_street_side_leg:
          description: Flag to bypass street side leg. If true, we will not send the street side to the custodian.
          type: boolean
          example: false
          default: false
          x-go-type-skip-optional-pointer: true
        bypass_trade_booking:
          description: Flag to bypass trade booking. If true, the trade will not be booked in the system.
          type: boolean
          example: true
        client_external_trade_report_id:
          description: The client-provided idempotency key.
          type: string
        counterparty_clearing_firm_id:
          description: DTC ID of the counterparty's clearing firm.
          type: string
          example: '0123'
          x-go-type-skip-optional-pointer: true
        counterparty_id:
          description: MPID of the counterparty involved in the street trade.
          type: string
          example: MMNT
          x-go-type-skip-optional-pointer: true
        execution_id:
          description: Trade ID. Often times this will be the ID of the execution made at an external venue.
          type: string
          example: 01JBFQZXMWZ08XDMTG08P2Z4XT
        external_trade_report_id:
          description: 'Optional external trade report ID. If provided, this ID will be used instead of auto-generating one.

            Must start with ''etr_'' followed by a valid ULID.

            If not provided, the system will generate a unique ID automatically.

            '
          type: string
          example: etr_01JBFQZXMWZ08XDMTG08P2Z4XT
        price:
          description: The trade price. For mutual funds, if not provided, the backend will use the parent order's estimated price (NAV).
          type:
          - number
          - 'null'
          format: double
        settle_date:
          description: The settlement date for the trade.
          type: string
          format: date-time
        snapshot_id:
          description: Optional quote snapshot ID. If provided, this snapshot ID will be used instead of creating a new one.
          type: string
        trade_time:
          description: The timestamp when the trade occurred.
          type: string
          format: date-time
      required:
      - client_external_trade_report_id
      - amount
      - trade_time
      - settle_date
      - bypass_trade_booking
      title: External Trade Report
    OrderSize:
      type: object
      title: Amount
      description: 'The Amount of an order with a specified `type` indicating how the amount is represented.

        - **Par:** Represents the order size in face value (e.g., a corporate bond with a $1,000 face value).

        - **Notional:** Represents the order size in notional dollar value.

        - **Shares:** Represents the order size in number of shares (for equities).'
      properties:
        value:
          type: number
          example: 10000
          x-go-type: float64
        type:
          type: string
          enum:
          - par
          - notional
          - shares
          default: par
          x-enumNames:
          - SizeTypePar
          - SizeTypeNotional
          - SizeTypeShares
      required:
      - value
      - type
    ExecutionOrderResponse:
      type: object
      properties:
        execution_order_id:
          $ref: '#/components/schemas/ExecutionOrderID'
      required:
      - execution_order_id
    TwapParameters:
      title: TWAP Parameters
      type: object
      description: 'Parameters for a time-weighted average price (TWAP) algo. The algo slices the order into

        smaller pieces and works them evenly over the specified time window, aiming to match the

        time-weighted average price of the instrument over that window.'
      properties:
        start_time:
          type: string
          format: date-time
          description: Start of the absolute window to work the order.
        end_time:
          type: string
          format: date-time
          description: End of the absolute window to work the order.
        would:
          $ref: '#/components/schemas/WouldParameters'
        participate_opening_auction:
          type: boolean
          description: Whether the algo should participate in the opening auction.
          default: false
          x-go-type-skip-optional-pointer: true
        participate_closing_auction:
          type: boolean
          description: Whether the algo should participate in the closing auction.
          default: false
          x-go-type-skip-optional-pointer: true
        aggressiveness:
          $ref: '#/components/schemas/AggressivenessLevel'
        max_participation_percent:
          type:
          - integer
          - 'null'
          format: int64
          description: Hard ceiling on participation of market volume, as a percent (e.g. 20 = 20%).
    Price:
      title: Price
      type: object
      description: Price value with type specification for different pricing methods.
      required:
      - value
      - type
      properties:
        value:
          $ref: '#/components/schemas/Decimal'
        type:
          $ref: '#/components/schemas/PriceValueType'
        benchmark_isin:
          type:
          - string
          - 'null'
          description: The ISIN of the benchmark security, required when type is 'spread'.
    TimeInForce:
      title: Time In Force
      type: string
      description: Specifies how long the order remains in effect. Absence of this field is interpreted as DAY.
      enum:
      - day
      - good_till_date
      - at_the_opening
      - at_the_close
      x-enumNames:
      - Day
      - GoodTillDate
      - AtTheOpening
      - AtTheClose
    VwapParameters:
      title: VWAP Parameters
      type: object
      description: 'Parameters for a volume-weighted average price (VWAP) algo. The algo works the order in

        proportion to the expected market volume profile over the specified time window, aiming to

        match the volume-weighted average price of the instrument over that window.'
      properties:
        start_time:
          type: string
          format: date-time
          description: Start of the absolute window to work the order.
        end_time:
          type: string
          format: date-time
          description: End of the absolute window to work the order.
        would:
          $ref: '#/components/schemas/WouldParameters'
        participate_opening_auction:
          type: boolean
          description: Whether the algo should participate in the opening auction.
          default: false
          x-go-type-skip-optional-pointer: true
        participate_closing_auction:
          type: boolean
          description: Whether the algo should participate in the closing auction.
          default: false
          x-go-type-skip-optional-pointer: true
        aggressiveness:
          $ref: '#/components/schemas/AggressivenessLevel'
        max_participation_percent:
          type:
          - integer
          - 'null'
          format: int64
          description: Hard ceiling on participation of market volume, as a percent (e.g. 20 = 20%).
    FeeAmountType:
      title: Fee Amount Type
      type: string
      description: "The method used to calculate the fee amount. Supported types include:\n\n- `percentage_of_par`: Fee as a percentage of par value.\n  Example: `0.10` = 10 basis points of par value.\n\n- `percentage_of_market_value`: Fee as a percentage of the quote price (market value).\n  Example: `1` = 1% of market value.\n\n- `yield_bps`: Fee expressed in yield terms, in basis points.\n  Example: `100` = 100 basis points of yield.\n\n- `percentage_of_concession`: Fee applies to concession based quoting mechanism, especially for new issue CDs.\n  Example: `50` = 50 percent of all concession from the dealer.\n"
      enum:
      - percentage_of_par
      - percentage_of_market_value
      - yield_bps
      - percentage_of_concession
      x-enumNames:
      - FeeAmountTypePercentageOfPar
      - FeeAmountTypePercentageOfMarketValue
      - FeeAmountTypeYieldBps
      - FeeAmountTypePercentageOfConcession
    ExitCriteria:
      type: object
      title: Exit Criteria
      required:
      - timeout
      properties:
        timeout:
          type: string
          format: duration
