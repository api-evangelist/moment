openapi: 3.2.0
info:
  title: Account Management Extended Organization API
  version: 1.0.0
  description: Account Management Extended API for managing account metadata and cash raise operations.
servers:
- url: https://live.moment-api.com
- url: https://paper.moment-api.com
tags:
- name: Organization
paths:
  /v1/account/organizations/{organization_id}/advisor-codes/:
    get:
      tags:
      - Organization
      summary: Get advisor codes for an organization
      description: Retrieves advisor codes within an organization with account counts and pagination
      operationId: getOrganizationAdvisorCodes
      parameters:
      - name: organization_id
        in: path
        description: Organization ID
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number (1-based)
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        description: Number of items per page
        schema:
          type: integer
          default: 50
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  advisor_codes:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationAdvisorCode'
                required:
                - advisor_codes
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden - no access to organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
components:
  schemas:
    APIError:
      type: object
      description: Standard error response format returned by all API endpoints.
      properties:
        error:
          type: string
          description: Human-readable error message describing what went wrong.
        error_details:
          description: Additional structured information about the error.
          x-go-type: any
          x-go-type-skip-optional-pointer: true
          x-oapi-codegen-extra-tags:
            exhaustruct: optional
        error_type:
          $ref: '#/components/schemas/ErrorType'
      required:
      - error
      - error_type
    OrganizationAdvisorCode:
      type: object
      properties:
        account_count:
          description: Number of accounts for this advisor code
          type: integer
        advisor_code:
          description: The advisor code
          type: string
        custodian:
          description: Name of the custodian
          type: string
      required:
      - custodian
      - advisor_code
      - account_count
    ErrorType:
      type: string
      description: High-level error category for programmatic error handling.
      enum:
      - invalid_request
      - not_found
      - server_error
      - unauthorized
      - rate_limited
      - forbidden
      - closed
      - not_implemented
      - resource_conflict
      x-enum-varnames:
      - ErrorTypeInvalidRequest
      - ErrorTypeNotFound
      - ErrorTypeServerError
      - ErrorTypeUnauthorized
      - ErrorTypeRateLimited
      - ErrorTypeForbidden
      - ErrorTypeNeedsMarketState
      - ErrorTypeNotImplemented
      - ErrorTypeResourceConflict
