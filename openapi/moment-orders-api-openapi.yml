openapi: 3.2.0
info:
  title: Moment Orders API
  version: 1.0.0
  contact:
    name: Moment Support
    email: support@withmoment.com
    url: https://withmoment.com/support
  description: 'Operations tagged Orders across 2 of this provider''s published API definitions: moment-account-management-api-openapi.yml, moment-orders-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://live.moment-api.com
- url: https://paper.moment-api.com
tags:
- name: Orders
paths:
  /v1/account/{account_id}/order/:
    post:
      tags:
      - Orders
      summary: Place an Order for an Account
      operationId: placeOrder
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          description: The ID of the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/PostOrderRequest'
              - type: object
                properties:
                  sleeve_id:
                    type: string
                    description: The ID of the sleeve to place the order in. This only applies to 'buy' orders.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceOrderResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1account~1document~1/post/responses/403/content/application~1json/schema'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1account~1document~1/post/responses/403/content/application~1json/schema'
    servers:
    - url: https://live.moment-api.com
    - url: https://paper.moment-api.com
  /v1/account/{account_id}/order/{order_id}/:
    parameters:
    - name: account_id
      in: path
      required: true
      schema:
        type: string
        description: The ID of the account
    - schema:
        type: string
      name: order_id
      in: path
      required: true
      description: Order ID
    delete:
      tags:
      - Orders
      summary: Cancel an Order
      parameters: []
      responses:
        '204':
          description: No Content
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1account~1document~1/post/responses/403/content/application~1json/schema'
      operationId: cancelOrder
      description: Attempts to cancel an open Order. If the order is no longer cancelable, a subsequent cancel reject event will be sent to the client via the Real-Time Orders API.
    servers:
    - url: https://live.moment-api.com
    - url: https://paper.moment-api.com
  /v1/trading/order/:
    post:
      tags:
      - Orders
      summary: Create an Order
      description: Places a request for a new order for the given account.
      operationId: postOrder
      parameters:
      - name: Moment-User
        in: header
        required: false
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostOrderResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '501':
          description: Not Implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    get:
      tags:
      - Orders
      summary: List all Orders
      description: Retrieves a list of orders for the account, filtered by the supplied query parameters.
      operationId: getAllOrders
      parameters:
      - name: state
        in: query
        description: 'Order state to be queried: ''open'', ''closed'' or ''all''. Defaults to open. An open order has an order status of pending_approval, pending_execution, or partially_filled, while a closed order has an order status of filled, canceled, or rejected. For more information on order statuses, refer to [Order States and Statuses](https://docs.moment.com/reference/understand-orders#order-states-and-statuses).'
        schema:
          type: string
          example: open
          enum:
          - open
          - closed
          - all
      - name: account_id
        in: query
        description: Unique ID of user account to fetch orders for.
        schema:
          type: string
      - name: client_order_id
        in: query
        description: Filter orders by client order ID.
        schema:
          $ref: '#/components/schemas/ClientOrderID'
      - name: annotation
        in: query
        description: Filter orders by annotation contents.
        schema:
          type: string
      - name: ib_id
        in: query
        schema:
          $ref: '#/components/schemas/IntroducingBrokerID'
      responses:
        '200':
          description: 'Successful response


            An array of Order objects'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '501':
          description: Not Implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      x-internal: false
    servers:
    - url: https://live.moment-api.com
    - url: https://paper.moment-api.com
  /v1/trading/order/bulk/:
    post:
      tags:
      - Orders
      summary: Create Multiple Orders
      description: Creates multiple orders in a single request.
      operationId: bulkOrderSubmission
      parameters:
      - name: Moment-User
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkOrderSubmissionRequest'
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOrderSubmissionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal Server Error
    servers:
    - url: https://live.moment-api.com
    - url: https://paper.moment-api.com
  /v1/trading/order/{id}/:
    parameters:
    - name: id
      in: path
      description: Order ID
      required: true
      schema:
        type: string
    delete:
      tags:
      - Orders
      summary: Cancel an Order
      description: Attempts to cancel an open Order. If the order is no longer cancelable, a subsequent cancel reject event will be sent to the client via the Real-Time Orders API.
      operationId: deleteOrderByOrderID
      parameters:
      - name: cancel_group_members
        in: query
        description: When true, cancel the open quantity of every member of the group parent order along with the parent. Only valid for group parent orders; otherwise the cancel is rejected.
        required: false
        schema:
          type: boolean
      - name: reason
        in: query
        description: Optional free-text reason for the cancellation, supplied by the requesting user. Surfaced on the order activity timeline.
        required: false
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    get:
      tags:
      - Orders
      summary: Retrieve an Order
      description: Retrieves a single order for the given id.
      operationId: getOrderByOrderID
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '501':
          description: Not Implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    servers:
    - url: https://live.moment-api.com
    - url: https://paper.moment-api.com
  /v1/trading/order/{id}/allocate/:
    post:
      tags:
      - Orders
      summary: Allocate an Order
      description: Allocates a block order to one or more customer accounts.
      operationId: allocateOrderByOrderID
      parameters:
      - name: id
        in: path
        description: Order ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostOrderAllocationRequest'
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  allocation_id:
                    $ref: '#/components/schemas/AllocationID'
                required:
                - allocation_id
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    servers:
    - url: https://live.moment-api.com
    - url: https://paper.moment-api.com
  /v1/trading/order/{id}/approve/:
    post:
      tags:
      - Orders
      summary: Manually Approve an Order
      description: Approves an order for the given order ID. Applicable only for orders that are pending approval and held for manual review.
      operationId: approveOrderByOrderID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderID'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                annotation:
                  description: The annotation to be added to the order.
                  type:
                  - string
                  - 'null'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualApproveResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    servers:
    - url: https://live.moment-api.com
    - url: https://paper.moment-api.com
  /v1/trading/order/{id}/reject/:
    post:
      tags:
      - Orders
      summary: Reject an Order
      description: Rejects an order for the given order ID. Applicable only for orders that are pending approval and held for manual review.
      operationId: rejectOrderByOrderID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/OrderID'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  description: The reason for rejection, if provided.
                  type:
                  - string
                  - 'null'
                annotation:
                  description: The annotation to be added to the order for the rejection.
                  type:
                  - string
                  - 'null'
        required: true
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualRejectResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    servers:
    - url: https://live.moment-api.com
    - url: https://paper.moment-api.com
components:
  schemas:
    OrderSize:
      type: object
      title: Size
      description: The size of an order, with a specified `type` indicating how the size is represented. Par sizes represent the size of the order in face value; most corporate bonds have a face value of $1000, so an order with par $3000 would represent an order for 3 bonds. Notional sizes represent the size of the order in current dollar value, so an order with notional $3000 would represent an order to buy or sell $3000 worth of the bond at the current market prices. Currently, only par sizes are supported.
      properties:
        value:
          $ref: '#/components/schemas/Decimal'
        type:
          type: string
          enum:
          - par
          default: par
      required:
      - value
      - type
    BookingType:
      type: string
      description: The booking type for the account.
      enum:
      - cash
      - margin
    NullDecimal:
      type: number
      format: double
      x-go-type: decimal.NullDecimal
      x-go-type-skip-optional-pointer: true
      x-go-type-import:
        path: github.com/shopspring/decimal
        name: decimal
    OrderSide:
      type: string
      enum:
      - buy
      - sell
      example: buy
      title: OrderSide
      description: 'Represents which side this order is on:


        - buy

        - sell'
    ClientOrderID:
      type: string
      title: Client Order ID
      description: Client-provided unique ID for the order; for example, to cross-reference with an internal system. Must be unique within the trading day, otherwise duplicate orders will be rejected during pre-trade checks.
    PlaceOrderResponse:
      type: object
      description: Response from placing an order
      properties:
        id:
          type: string
          title: ID
          description: Moment-generated ULID identifier for the order
          example: 01JBFQZXMWZ08XDMTG08P2Z4XT
        client_order_id:
          $ref: '#/components/schemas/ClientOrderID'
      required:
      - id
      - client_order_id
    InstrumentID:
      type: string
      title: Instrument ID
      description: Instrument ISIN
      example: US594918AD66
    Decimal:
      type: number
      format: double
      x-go-type: decimal.Decimal
      x-go-type-import:
        path: github.com/shopspring/decimal
        name: decimal
    OrderType:
      type: string
      enum:
      - limit
      - market
      - rfq_response
      default: limit
      example: limit
      description: 'Represents the types of orders Moment currently supports.


        - limit

        - market

        - rfq_response'
    OrderRFQ:
      type: object
      title: Order Request RFQ
      description: Required for orders of type `rfq_response`, specifies the RFQ that the order is being placed against.
      required:
      - id
      - contra_quote_id
      properties:
        id:
          type: string
          description: The ID of the RFQ that led to the order request.
        contra_quote_id:
          type: string
          title: Contra Quote ID
          description: The ID of the quote that is being traded against.
    PostOrderRequest:
      description: Each order has a unique identifier generated by Moment. The ID will be returned when an order is placed and can be used to check the status of the order via the `GET /v1/trading/order/{id}/` endpoint. Updates on open orders at Moment will also be sent over the real-time API, which is the recommended method of maintaining order state.
      type: object
      title: Order Request
      properties:
        instrument_id:
          $ref: '#/components/schemas/InstrumentID'
        client_order_id:
          $ref: '#/components/schemas/ClientOrderID'
        amount:
          $ref: '#/components/schemas/OrderSize'
        side:
          $ref: '#/components/schemas/OrderSide'
        type:
          $ref: '#/components/schemas/OrderType'
        limit_price:
          $ref: '#/components/schemas/NullDecimal'
          description: The Percentage Price is represented as a percentage of par. For a typical $1,000 par value bond, a percentage price of $90 values the bond at $900. This is a clean price, which does not include accrued interest.
          example: 90
          minimum: 0
          x-go-type-skip-optional-pointer: true
        annotation:
          type: string
          title: annotation
          description: Custom, arbitrary, client-provided metadata.
        booking_instructions:
          type: object
          title: booking_instructions
          description: Client-provided information to configure trade booking for the order, as a map from string to string. Passing a multi-layer JSON map or something other than "string":"string" key-value pairs will result in an error. The specific contents of this field should be determined in conjunction with the back-office integration.
          additionalProperties:
            type: string
          example:
            key1: value1
            key2: value2
        extended_hours:
          type: boolean
          default: false
          description: (default) false. If true, eligible for execution outside regular trading hours. In live mode, trading hours are from 9:30 am to 4:00 pm ET. Extended hours are from 7:30 am to 5:30 pm ET. For paper trading, normal trading hours are from 9:30 am to 4:00 pm ET. Extended hours are from 1:00 am to 11:00 pm ET.
        rfq:
          $ref: '#/components/schemas/OrderRFQ'
        booking_type:
          $ref: '#/components/schemas/BookingType'
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Metadata is an arbitrary key-value store for client-provided data associated with the order.
          x-go-type-skip-optional-pointer: true
        review_required:
          type: boolean
          default: false
          description: Flag to indicate if the order requires manual review before execution.
          x-go-type-skip-optional-pointer: true
        review_reason:
          type: string
          description: Reason for why the order requires review. Only applicable when review_required is true.
          x-go-type-skip-optional-pointer: true
      required:
      - instrument_id
      - amount
      - side
      - type
      - client_order_id
      - booking_instructions
      - extended_hours
    Protocol:
      title: Protocol
      type: string
      description: The protocol used for the execution order.
      enum:
      - limit_order_book
      - request_for_quote
      - external
      - group
      - custodian
      x-enumNames:
      - ProtocolLimitOrderBook
      - ProtocolRequestForQuote
      - ProtocolExternal
      - ProtocolGroup
      - ProtocolCustodian
    PriceValueType:
      title: Price Value Type
      type: string
      description: The method used to represent the price value.
      enum:
      - percent
      - discount_yield
      - spread
      - money_market_yield
      - per_share
      x-enumNames:
      - PriceValueTypePercent
      - PriceValueTypeDiscountYield
      - PriceValueTypeSpread
      - PriceValueTypeMMYield
      - PriceValueTypePerShare
      default: percent
    FeeType:
      title: Fee Type
      type: string
      description: The type of fee to apply to the order. Valid values are "markup", "commission", and "sales_credit".
      enum:
      - markup
      - commission
      - sales_credit
      x-enumNames:
      - FeeTypeMarkup
      - FeeTypeCommission
      - FeeTypeSalesCredit
    AllOrNone:
      description: If set to true, the entire order quantity will be filled or none at all. There will be no partial fills.
      type: boolean
      default: false
      title: All or None
      x-go-type-skip-optional-pointer: true
    InstrumentID_2:
      description: Instrument CUSIP or ISIN
      type: string
      example: US594918AD66
      title: Instrument ID
    SnapshotQuote:
      type: object
      properties:
        yield_to_maturity:
          type: number
          format: double
          description: 'Deprecated: not mapped to domain model, will be removed. Use post_fee_ytm instead.'
          deprecated: true
        yield_to_worst:
          type: number
          format: double
          description: 'Deprecated: not mapped to domain model, will be removed. Use post_fee_ytw instead.'
          deprecated: true
        size:
          type: integer
        min_size:
          type: integer
        venue_mpid:
          type: string
        spread_benchmark_isin:
          type:
          - string
          - 'null'
        spread_to_benchmark_bps:
          type:
          - string
          - 'null'
        min_balance_remaining:
          type:
          - integer
          - 'null'
        min_increment:
          type:
          - integer
          - 'null'
        source:
          type: string
          enum:
          - LOB
          - RFQ
        pre_fee_price:
          type: number
          format: double
        post_fee_price:
          type: number
          format: double
        pre_fee_ytw:
          type: number
          format: double
          description: Pre-fee yield to worst (street price, no fees).
        post_fee_ytw:
          type: number
          format: double
          description: Post-fee yield to worst (inclusive of Moment fees).
        pre_fee_ytm:
          type: number
          format: double
          description: Pre-fee yield to maturity (street price, no fees).
        post_fee_ytm:
          type: number
          format: double
          description: Post-fee yield to maturity (inclusive of Moment fees).
        pre_fee_spread_bps:
          type:
          - number
          - 'null'
          format: double
        post_fee_spread_bps:
          type:
          - number
          - 'null'
          format: double
        side:
          type: string
          enum:
          - bid
          - ask
        disabled:
          type: boolean
        rfq_quote_status:
          type: string
        rfq_id:
          type: string
        venue_quote_id:
          type: string
        settlement_date:
          type: integer
          format: int64
      required:
      - size
      - min_size
      - venue_mpid
      - source
      - pre_fee_price
      - post_fee_price
      - pre_fee_ytm
      - pre_fee_ytw
      - post_fee_ytm
      - post_fee_ytw
      - side
      - disabled
      - settlement_date
    Strategy:
      title: Strategy
      type: string
      description: The strategy used for the execution order.
      enum:
      - smart_order_routing
      - manual
      - report
      - auto_ex
      x-enumNames:
      - StrategySmartOrderRouting
      - StrategyManual
      - StrategyReport
      - StrategyAutoEx
    ErrorType:
      type: string
      description: High-level error category for programmatic error handling.
      enum:
      - invalid_request
      - not_found
      - server_error
      - unauthorized
      - rate_limited
      - forbidden
      - closed
      - not_implemented
      - resource_conflict
      x-enum-varnames:
      - ErrorTypeInvalidRequest
      - ErrorTypeNotFound
      - ErrorTypeServerError
      - ErrorTypeUnauthorized
      - ErrorTypeRateLimited
      - ErrorTypeForbidden
      - ErrorTypeNeedsMarketState
      - ErrorTypeNotImplemented
      - ErrorTypeResourceConflict
    GroupMember:
      title: Group Member
      type: object
      description: A group member for an order
      required:
      - moment_order_id
      properties:
        moment_order_id:
          type: string
          description: The ID of the order in the group
          x-go-name: MomentOrderID
    RiskGroupID:
      description: The risk group ID to use for this order. If not specified, the default risk group for the organization will be used. The risk group must belong to the organization specified by ib_id. Orders for which the risk group does not belong to the specified organization will be rejected with "invalid risk group id."
      type: string
    LimitPrice:
      title: Limit Price
      description: The Percentage Price is represented as a percentage of par. For a typical $1,000 par value bond, a percentage price of $90 values the bond at $900. This is a clean price, which does not include accrued interest. Accepts a JSON number or a decimal string.
      example: 90
      x-go-type: PriceValue
      oneOf:
      - type:
        - number
        - 'null'
        minimum: 0
      - type: string
    ManualApproveResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ManualApprovalID'
      required:
      - id
    ExternalTradeReport:
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/OrderSize_2'
        annotation:
          description: Optional annotation for the trade.
          type:
          - string
          - 'null'
        bypass_street_side_leg:
          description: Flag to bypass street side leg. If true, we will not send the street side to the custodian.
          type: boolean
          example: false
          default: false
          x-go-type-skip-optional-pointer: true
        bypass_trade_booking:
          description: Flag to bypass trade booking. If true, the trade will not be booked in the system.
          type: boolean
          example: true
        client_external_trade_report_id:
          description: The client-provided idempotency key.
          type: string
        counterparty_clearing_firm_id:
          description: DTC ID of the counterparty's clearing firm.
          type: string
          example: '0123'
          x-go-type-skip-optional-pointer: true
        counterparty_id:
          description: MPID of the counterparty involved in the street trade.
          type: string
          example: MMNT
          x-go-type-skip-optional-pointer: true
        execution_id:
          description: Trade ID. Often times this will be the ID of the execution made at an external venue.
          type: string
          example: 01JBFQZXMWZ08XDMTG08P2Z4XT
        external_trade_report_id:
          description: 'Optional external trade report ID. If provided, this ID will be used instead of auto-generating one.

            Must start with ''etr_'' followed by a valid ULID.

            If not provided, the system will generate a unique ID automatically.

            '
          type: string
          example: etr_01JBFQZXMWZ08XDMTG08P2Z4XT
        price:
          description: The trade price. For mutual funds, if not provided, the backend will use the parent order's estimated price (NAV).
          type:
          - number
          - 'null'
          format: double
        settle_date:
          description: The settlement date for the trade.
          type: string
          format: date-time
        snapshot_id:
          description: Optional quote snapshot ID. If provided, this snapshot ID will be used instead of creating a new one.
          type: string
        trade_time:
          description: The timestamp when the trade occurred.
