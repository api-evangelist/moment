openapi: 3.2.0
info:
  title: Account Management Extended Metadata API
  version: 1.0.0
  description: Account Management Extended API for managing account metadata and cash raise operations.
servers:
- url: https://live.moment-api.com
- url: https://paper.moment-api.com
tags:
- name: Metadata
paths:
  /v1/account/{account_id}/extra/:
    patch:
      tags:
      - Metadata
      summary: Update account metadata
      description: 'Update account metadata for a specific account. This endpoint allows you to:

        - Add new metadata keys

        - Update existing metadata values

        - Delete keys by setting them to an empty string ("")'
      operationId: updateAccountMetadata
      parameters:
      - name: account_id
        in: path
        description: Account ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountMetadata'
        required: true
      responses:
        '200':
          description: Updated account metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMetadata'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden - no access to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
components:
  schemas:
    APIError:
      type: object
      description: Standard error response format returned by all API endpoints.
      properties:
        error:
          type: string
          description: Human-readable error message describing what went wrong.
        error_details:
          description: Additional structured information about the error.
          x-go-type: any
          x-go-type-skip-optional-pointer: true
          x-oapi-codegen-extra-tags:
            exhaustruct: optional
        error_type:
          $ref: '#/components/schemas/ErrorType'
      required:
      - error
      - error_type
    AccountMetadata:
      type: object
    ErrorType:
      type: string
      description: High-level error category for programmatic error handling.
      enum:
      - invalid_request
      - not_found
      - server_error
      - unauthorized
      - rate_limited
      - forbidden
      - closed
      - not_implemented
      - resource_conflict
      x-enum-varnames:
      - ErrorTypeInvalidRequest
      - ErrorTypeNotFound
      - ErrorTypeServerError
      - ErrorTypeUnauthorized
      - ErrorTypeRateLimited
      - ErrorTypeForbidden
      - ErrorTypeNeedsMarketState
      - ErrorTypeNotImplemented
      - ErrorTypeResourceConflict
