      type: string
      description: The refunded security of a PDEF corporate action event.
      example: US594918AD60
    CorporateActionEventMarketDeadline:
      type: string
      description: The deadline for an issuer or agent to respond to an outstanding offer by account servicer.
      example: '2023-12-06T18:00:00Z'
      format: date-time
    CorporateActionUpdateId:
      type: string
      description: Unique message identifier.
      example: '2024072434604568'
    CorporateActionsResponse:
      title: CorporateActionsResponse
      type: object
      description: Provides corporate action details for every event that matches the query.
      properties:
        count:
          type: integer
          description: The total number of corporate actions found that match the query.
        next:
          type:
          - string
          - 'null'
          format: URL
          description: The URL to the next page of results (if any exist). Null if no more pages.
        prev:
          type:
          - string
          - 'null'
          format: URL
          description: The URL to the previous page of results (if any exist). Null if no earlier pages.
        corporate_actions:
          type: array
          description: Array of corporate action events requested.
          items:
            anyOf:
            - $ref: '#/components/schemas/CorporateActionFullCallInfo'
            - $ref: '#/components/schemas/CorporateActionPartialCallInfo'
            - $ref: '#/components/schemas/CorporateActionPutInfo'
            - $ref: '#/components/schemas/CorporateActionPreRefundingInfo'
            - $ref: '#/components/schemas/CorporateActionPartialRedemptionWithPoolFactorReductionInfo'
            - $ref: '#/components/schemas/CorporateActionInterestInfo'
            - $ref: '#/components/schemas/CorporateActionRedemptionInfo'
            - $ref: '#/components/schemas/CorporateActionTenderInfo'
            - $ref: '#/components/schemas/CorporateActionBidsInfo'
            - $ref: '#/components/schemas/CorporateActionCapitalizationInfo'
      required:
      - corporate_actions
    CorporateActionPreRefundingInfo:
      title: pre_refunding
      type: object
      description: PDEF (Pre-Refunding / Defeasance) corporate action event details
      properties:
