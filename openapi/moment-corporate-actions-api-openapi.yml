        record_date:
          $ref: '#/components/schemas/CorporateActionEventRecordDate'
        lottery_type:
          $ref: '#/components/schemas/CorporateActionEventLotteryType'
        lottery_date:
          $ref: '#/components/schemas/CorporateActionEventLotteryDate'
    CorporateActionEventEarliestPaymentDate:
      type:
      - string
      - 'null'
      description: The earliest payment date of the corporate action event.
      format: date
      example: '2023-09-06'
    CorporateActionEventRateAmount:
      type:
      - string
      - 'null'
      description: Rate of the corporate action event.
    CorporateActionEventOptionQuantity:
      type:
      - string
      - 'null'
      description: Quantity of financial instruments that can be actioned upon.
    CorporateActionEventCancelDate:
      type:
      - string
      - 'null'
      description: Record date of the cancellation, optionally present when corporate action is a cancellation. YYYY-MM-DD.
      format: string
      example: '2010-08-18

        '
    CorporateActionEventConfirmation:
      type: string
      description: 'The confirmation status of the corporate action event.


        * "CONF" - Confirmed

        * "UCON" - Unconfirmed'
      example: CONF
      enum:
