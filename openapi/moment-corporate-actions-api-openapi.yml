        payment_date:
          $ref: '#/components/schemas/CorporateActionEventPaymentDate'
        additional_info:
          $ref: '#/components/schemas/CorporateActionEventAdditionalInfo'
        cancel_info:
          $ref: '#/components/schemas/CorporateActionEventCancelInfo'
        cancel_type:
