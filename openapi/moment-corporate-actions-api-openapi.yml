      - UCON
    CorporateActionEventLotteryType:
      type: string
      description: 'The lottery type of the corporate action event, if applicable.


        * "ORIG" - Original, As Announced

        * "SUPP" - Supplemental, Additional'
      example: ORIG
      enum:
      - ORIG
      - SUPP
    CorporateActionEventPutMinQuantity:
