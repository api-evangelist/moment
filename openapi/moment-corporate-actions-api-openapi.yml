    CorporateActionEventResultsPublicationDate:
      type:
      - string
      - 'null'
      description: The lottery results publication date of the corporate action event.
      format: date
      example: '2023-09-06'
    CorporateActionEventPayout:
      type: string
      description: 'The payout type of the corporate action event.


        * "CASH" - Cash

        * "SECU" - Securities

        * "CASE" - Cash and Securities'
      example: CASH
