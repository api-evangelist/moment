openapi: 3.2.0
info:
  title: Data Corporate Actions API
  description: Access Moment's evaluative and real-time US fixed income data, as well as daily reference data, through REST API and WebSocket.
  version: 1.0.0
  contact:
    name: Moment Support
    email: support@withmoment.com
    url: https://withmoment.com/support
servers:
- url: https://live.moment-api.com
- url: https://paper.moment-api.com
security:
- bearerAuth: []
tags:
- name: Corporate Actions
paths:
  /v1/data/corporate-actions/:
    get:
      tags:
      - Corporate Actions
      summary: All Corporate Actions
      parameters:
      - $ref: '#/components/parameters/corporate_action_start_date'
      - $ref: '#/components/parameters/corporate_action_end_date'
      - $ref: '#/components/parameters/corporate_action_instrument_ids'
      - $ref: '#/components/parameters/corporate_action_event_types'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorporateActionsResponse'
      operationId: listCorporateActions
      description: 'List the corporate actions that occurred in a particular time period. Optionally filter by security and event type. The returned events will be sorted in descending order by the update time.


        Currently, the supported event types are:


        * "DRAW" - Partial Call

        * "MCAL" - Full Call

        * "BPUT" - Partial Mandatory Put

        * "PDEF" - Pre-Refunding / Defeasance

        * "PRED" - Partial Redemption With Pool Factor Reduction

        * "INTR" - Interest Payment

        * "REDM" - Redemption (Final Maturity)

        * "TEND" - Tender Offer

        * "BIDS" - Repurchase Offer

        * "CAPI" - Capitalization


        Each event will have a different set of fields, depending on the event type. These are detailed in the schema for each event type.'
  /v1/data/corporate-actions/{event_id}/:
    get:
      tags:
      - Corporate Actions
      summary: Single Corporate Action
      parameters:
      - $ref: '#/components/parameters/corporate_action_event_id'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorporateActionDetailResponse'
      operationId: retrieveCorporateAction
      description: 'Retrieve complete details for the specified corporate action event including event details, past lifecycle details, and associated instruments. These will all have the same event ID and event type.


        The returned events will be sorted in descending order by the update time.'
components:
  parameters:
    corporate_action_end_date:
      name: end
      in: query
      required: true
      description: 'The inclusive end of the date range when searching corporate action announcements, formatted as YYYY-MM-DD.


        The maximum range is 31 days.'
      schema:
        type: string
        format: date
        example: '2024-09-01'
    corporate_action_event_types:
      name: event_types
      in: query
      required: false
      description: 'Comma separated list of corporate action event types to filter on.


        These follow the standard ISO 20022 event types.'
      schema:
        type: string
        example: MCAL,DRAW
    corporate_action_instrument_ids:
      name: instrument_ids
      in: query
      required: false
      description: 'Comma separated list of ISINs to filter on.


        At most 1000 ISINs may be specified.'
      schema:
        type: string
        example: US84858WAA45,US17298CHQ42
    page_size:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
      description: Number of items to return. Must be in range 1-1000, defaults to 100.
    corporate_action_event_id:
      name: event_id
      in: path
      required: true
      description: Corporate action event ID.
      schema:
        type: string
        example: US144543665
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
      description: Page number of results to return. Defaults to 1.
    corporate_action_start_date:
      name: start
      in: query
      required: true
      description: 'The inclusive start of the date range when searching corporate action announcements, formatted as YYYY-MM-DD.


        The maximum range is 31 days.'
      schema:
        type: string
        format: date
        example: '2024-08-01'
  schemas:
    CorporateActionUpdatedAt:
      type: string
      description: The time at which the corporate action event was last updated in RFC-3339 format.
      example: '2023-12-06T18:09:07Z'
      format: date-time
    CorporateActionEventInstructionExpirationDate:
      type:
      - string
      - 'null'
      format: date-time
      example: '2024-09-30T17:00:00-04:00'
      description: Date/time that the account servicer has set as the deadline to respond, with instructions, to an outstanding event, giving the holder eligibility to incentives.
    CorporateActionEventLotteryDate:
      type:
      - string
      - 'null'
      description: The lottery date of the corporate action event.
      format: date
      example: '2023-12-06'
    CorporateActionEventStatus:
      type: string
      description: 'The status of the corporate action event.


        * "COMP" - Complete

        * "INCO" - Incomplete'
      example: COMP
      enum:
      - COMP
      - INCO
    CorporateActionEventResponseDeadline:
      type: string
      description: The deadline for an account servicer to respond to an outstanding event.
      example: '2023-12-06T18:00:00Z'
      format: date-time
    CorporateActionTenderInfo:
      title: tender
      type: object
      description: TEND (Tender) corporate action event details
      properties:
        id:
          $ref: '#/components/schemas/CorporateActionId'
        update_id:
          $ref: '#/components/schemas/CorporateActionUpdateId'
        updated_at:
          $ref: '#/components/schemas/CorporateActionUpdatedAt'
        type:
          type: string
          description: The ISO event code of the corporate action event.
          example: TEND
        isin:
          $ref: '#/components/schemas/CorporateActionEventISIN'
        cusip:
          $ref: '#/components/schemas/CorporateActionEventCusip'
        status:
          $ref: '#/components/schemas/CorporateActionEventStatus'
        confirmation:
          $ref: '#/components/schemas/CorporateActionEventConfirmation'
        category:
          $ref: '#/components/schemas/CorporateActionEventCategory'
        price:
          $ref: '#/components/schemas/CorporateActionEventPrice'
        payout:
          $ref: '#/components/schemas/CorporateActionEventPayout'
        payment_date:
          $ref: '#/components/schemas/CorporateActionEventPaymentDate'
        additional_info:
          $ref: '#/components/schemas/CorporateActionEventAdditionalInfo'
        cancel_info:
          $ref: '#/components/schemas/CorporateActionEventCancelInfo'
        cancel_type:
          $ref: '#/components/schemas/CorporateActionEventCancelType'
        cancel_date:
          $ref: '#/components/schemas/CorporateActionEventCancelDate'
        instruction_expiration_date:
          $ref: '#/components/schemas/CorporateActionEventInstructionExpirationDate'
        withdrawal_expiration_date:
          $ref: '#/components/schemas/CorporateActionEventWithdrawalExpirationDate'
        actual_expiration_date:
          $ref: '#/components/schemas/CorporateActionEventActualExpirationDate'
        dispursed_security:
          $ref: '#/components/schemas/CorporateActionEventDispursedSecurity'
        option_price:
          $ref: '#/components/schemas/CorporateActionEventOptionPrice'
        option_quantity:
          $ref: '#/components/schemas/CorporateActionEventOptionQuantity'
    CorporateActionEventCancelInfo:
      type:
      - string
      - 'null'
      description: Additional information provided by the issuer, only populated when the corporate action is a cancellation.
      format: string
      example: 'As of the current date, the variable rate CMO has a normal payment structure, and interest is paid monthly.

        '
    CorporateActionEventRecordDate:
      type:
      - string
      - 'null'
      description: The record date of the corporate action event.
      format: date
      example: '2023-12-06'
    CorporateActionEventCusip:
      type: string
      description: The instrument Cusip of the corporate action event.
      example: 594918AD6
    CorporateActionEventOptionPrice:
      type:
      - string
      - 'null'
      description: Price of financial instruments that can be actioned upon.
    CorporateActionEventPrice:
      type: number
      description: The price that applies for the corporate action event.
      example: 103.25
    CorporateActionPartialRedemptionWithPoolFactorReductionInfo:
