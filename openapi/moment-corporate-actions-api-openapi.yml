        response_deadline:
          $ref: '#/components/schemas/CorporateActionEventResponseDeadline'
        put_min_quantity:
          $ref: '#/components/schemas/CorporateActionEventPutMinQuantity'
        put_min_increment:
          $ref: '#/components/schemas/CorporateActionEventPutMinIncrement'
    CorporateActionEventCancelType:
      type: string
      description: 'The cancellation type of the corporate action event. Only populated when the corporate action is a cancellation.


        * "PROC" - Canceled due to processing error

        * "WITH" - Withdrawn/canceled by the issuer'
      example: PROC
      enum:
      - PROC
      - WITH
    CorporateActionPartialCallInfo:
