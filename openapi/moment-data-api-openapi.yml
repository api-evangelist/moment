    CorporateActionId:
      type: string
      description: Unique corporate action event ID.
      example: US144595949
    CorporateActionUpdateId:
      type: string
      description: Unique message identifier.
      example: '2024072434604568'
    CorporateActionUpdatedAt:
      type: string
      description: The time at which the corporate action event was last updated in RFC-3339 format.
      example: '2023-12-06T18:09:07Z'
      format: date-time
    CorporateActionEventCategory:
      type: string
      description: "The category of the corporate action event.\n\n  * \"MAND\" - Mandatory\n  * \"VOLU\" - Voluntary\n  * \"CHOS\" - Mandatory with Options"
      example: MAND
      enum:
      - MAND
      - VOLU
      - CHOS
    CorporateActionEventStatus:
      type: string
      description: 'The status of the corporate action event.


        * "COMP" - Complete

        * "INCO" - Incomplete'
      example: COMP
      enum:
      - COMP
      - INCO
    CorporateActionEventConfirmation:
      type: string
      description: 'The confirmation status of the corporate action event.


        * "CONF" - Confirmed

        * "UCON" - Unconfirmed'
      example: CONF
      enum:
      - CONF
      - UCON
    CorporateActionEventISIN:
      type: string
      description: The instrument ISIN of the corporate action event.
      example: US594918AD66
    CorporateActionEventCusip:
      type: string
      description: The instrument Cusip of the corporate action event.
      example: 594918AD6
    CorporateActionEventRecordDate:
      type: string
      description: The record date of the corporate action event.
      format: date
      nullable: true
      example: '2023-12-06'
    CorporateActionEventLotteryDate:
      type: string
      description: The lottery date of the corporate action event.
      format: date
      nullable: true
      example: '2023-12-06'
    CorporateActionEventLotteryType:
      type: string
      description: 'The lottery type of the corporate action event, if applicable.


        * "ORIG" - Original, As Announced

        * "SUPP" - Supplemental, Additional'
      example: ORIG
      enum:
      - ORIG
      - SUPP
    CorporateActionEventRefundedSecurity:
      type: string
      description: The refunded security of a PDEF corporate action event.
      example: US594918AD60
    CorporateActionEventNonRefundedSecurity:
      type: string
      description: The non-refunded security of a PDEF corporate action event.
      example: US594918AE71
    CorporateActionEventPaymentDate:
      type: string
      description: The payment date of the corporate action event.
      format: date
      nullable: true
      example: '2023-09-06'
    CorporateActionEventAdditionalInfo:
      type: string
      description: Additional information provided by the issuer.
      format: string
      nullable: true
      example: 'Contact Number: 123-456-7890

        '
    CorporateActionEventCancelInfo:
      type: string
      description: Additional information provided by the issuer, only populated when the corporate action is a cancellation.
      format: string
      nullable: true
      example: 'As of the current date, the variable rate CMO has a normal payment structure, and interest is paid monthly.

        '
    CorporateActionEventCancelType:
      type: string
      description: 'The cancellation type of the corporate action event. Only populated when the corporate action is a cancellation.


        * "PROC" - Canceled due to processing error

        * "WITH" - Withdrawn/canceled by the issuer'
      example: PROC
      enum:
      - PROC
      - WITH
    CorporateActionEventCancelDate:
      type: string
      description: Record date of the cancellation, optionally present when corporate action is a cancellation. YYYY-MM-DD.
      format: string
      nullable: true
      example: '2010-08-18

        '
    CorporateActionEventResultsPublicationDate:
      type: string
      description: The lottery results publication date of the corporate action event.
      format: date
      nullable: true
      example: '2023-09-06'
    CorporateActionEventEarliestPaymentDate:
      type: string
      description: The earliest payment date of the corporate action event.
      format: date
      nullable: true
      example: '2023-09-06'
    CorporateActionEventPrice:
      type: number
      description: The price that applies for the corporate action event.
      example: 103.25
    CorporateActionEventMarketDeadline:
      type: string
      description: The deadline for an issuer or agent to respond to an outstanding offer by account servicer.
      example: '2023-12-06T18:00:00Z'
      format: date-time
    CorporateActionEventResponseDeadline:
      type: string
      description: The deadline for an account servicer to respond to an outstanding event.
      example: '2023-12-06T18:00:00Z'
      format: date-time
    CorporateActionEventPutMinQuantity:
      type: number
      description: The minimum put quantity of the corporate action event.
      example: 10000
    CorporateActionEventPutMinIncrement:
      type: number
      description: The minimum put increment of the corporate action event.
      example: 1000
    CorporateActionEventPayout:
      type: string
      description: 'The payout type of the corporate action event.


        * "CASH" - Cash

        * "SECU" - Securities

        * "CASE" - Cash and Securities'
      example: CASH
      enum:
      - CASH
      - SECU
      - CASE
    CorporateActionEventRateType:
      type: string
      nullable: true
      description: Type of the corporate action event rate.
    CorporateActionEventRateAmount:
      type: string
      nullable: true
      description: Rate of the corporate action event.
    CorporateActionEventInstructionExpirationDate:
      type: string
      format: date-time
      example: '2024-09-30T17:00:00-04:00'
      nullable: true
      description: Date/time that the account servicer has set as the deadline to respond, with instructions, to an outstanding event, giving the holder eligibility to incentives.
    CorporateActionEventWithdrawalExpirationDate:
      type: string
      format: date-time
      example: '2024-09-30T17:00:00-04:00'
      nullable: true
      description: Period during which the participant of the account servicer can revoke change or withdraw its instructions.
    CorporateActionEventActualExpirationDate:
      type: string
      format: date-time
      example: '2024-09-30T17:00:00-04:00'
