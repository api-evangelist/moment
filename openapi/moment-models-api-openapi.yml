    LadderPolicyConstraint:
      type: object
      properties:
        id:
          description: Unique identifier for this constraint. Must match the `constraint_id` on the enclosing `ConstraintOperation`. Required.
          type: string
          title: ID
        constraint_priority:
          $ref: '#/components/schemas/ConstraintPriority'
        end_period:
          description: The ending period of the ladder. Required unless `num_periods` is provided.
          type: integer
          example: 1
          title: End Period
        grace_period_months:
          description: The length of the grace period in months. The grace period is the time period after the assignment date where a dynamic ladder policy constraint are not yet being adjusted.
          type: integer
          default: 1
          title: Grace Period Months
        market_value_tolerance:
          description: The maximum market value deviation allowed for each bucket in the ladder, which can be specified instead of weight_tolerance.
          type: number
          format: double
          title: Market Value Tolerance
        maturity_option:
          description: Which date a ladder bucket measures against. Nullable because persisted payloads carry an explicit null, which readers already treat as the default.
          default: maturity_date
          x-omitempty: true
          allOf:
          - $ref: '#/components/schemas/MaturityOption'
        name:
          description: 'Optional user-supplied display label for the constraint, shown in place of the generated description. Cosmetic only: never read by the solver and never part of the constraint''s identity, so distinct constraints may share a name.'
          type: string
          maxLength: 200
          title: Name
        num_periods:
          description: Alternative to `end_period`; sets `end_period` to `start_period + num_periods`. May be sent with `end_period` only when they agree (`end_period == start_period + num_periods`); conflicting values are rejected.
          type: integer
          example: 6
          title: Num Periods
        period_length:
          description: The length of one ladder period in months.
          type: integer
          example: 12
          title: Period Length
        scope:
          $ref: '#/components/schemas/FilterDictionary'
        start_period:
          description: The starting period of the ladder.
          type: integer
          example: 0
          default: 0
          title: Start Period
        type:
          type: string
          enum:
          - ladder_policy
          title: Type
        use_call_adjusted_maturity:
          description: The call adjusted maturity date is the terminal date of the bond implied by its yield to worst. If set to true then the ladder policy constraint will use the call adjusted maturity date instead of the maturity date.
          type: boolean
          default: false
          title: Use Call Adjusted Maturity
        use_assignment_date:
          description: When true, the assignment date anchors the ladder policy time-line; when false, the time-to-maturity mode is used (rolling buckets relative to today). Defaults to true.
          type: boolean
          default: true
          title: Use Assignment Date
        weight_tolerance:
          description: The maximum weight deviation allowed for each bucket in the ladder.
          type: number
          format: double
          example: 0.05
          title: Weight Tolerance
      required:
      - type
      - period_length
      title: LadderPolicyConstraint
