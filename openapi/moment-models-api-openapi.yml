          type: string
          title: ID
        constraint_priority:
          $ref: '#/components/schemas/ConstraintPriority'
        filters:
          description: Ordered list of group-membership filters. Index 0 is the highest-precedence group. At least two filters are required.
          type: array
          items:
            $ref: '#/components/schemas/FilterDictionary'
          minItems: 2
          title: Filters
        name:
          description: 'Optional user-supplied display label for the constraint, shown in place of the generated description. Cosmetic only: never read by the solver and never part of the constraint''s identity, so distinct constraints may share a name.'
          type: string
          maxLength: 200
          title: Name
        scope:
          $ref: '#/components/schemas/FilterDictionary'
        type:
          type: string
          enum:
          - sell_precedence
          title: Type
      required:
      - type
      - filters
      title: SellPrecedenceConstraint
