        theoretical_minimum_rank:
          description: 'Exact numeric rank of `theoretical_minimum` for rating fields.

            Omitted for quantitative fields.'
          type:
          - number
          - 'null'
          format: double
          title: Theoretical Minimum Rank
        weighted_field_value:
          description: '`Σ(field_value × market_value)` over the same holdings

            `scoped_market_value` sums — the numerator of the securities-only

            weighted average, in field-units × dollars. For rating fields it is

            on the field''s rating-rank scale, so

            `weighted_field_value / scoped_market_value` is a rank rather than

            a letter. That quotient equals `holdings_average_value_rank` (or,

            for quantitative fields, `holdings_average_value`) only when

            `hardcode_cash_as_fund` is false; under the flag the reported

            average folds cash into both halves while these two fields do not.'
          type:
          - number
          - 'null'
          format: double
          title: Weighted Field Value
