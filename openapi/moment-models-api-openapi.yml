    CashflowBandConstraint:
      description: 'Levels the recurring cashflow targets of every account on the strategy:

        each live bucket of a recurring target is held within

        ±max_deviation_ratio of that target''s post-trade mean bucket cashflow,

        in raw dollars, while the objective is still maximized. Buckets with

        an amount override are left out of the band, as are one_time targets

        and targets with fewer than two remaining buckets. Assigned accounts

        inherit it; per-account customizations may override or remove it by

        id.'
      type: object
      properties:
        id:
          description: Unique identifier for this constraint. Must match the `constraint_id` on the enclosing `ConstraintOperation`. Required.
          type: string
          title: ID
        constraint_priority:
          description: Same as ConstraintPriority, but omitted defaults to 1, so the band relaxes before the cashflow floors (tier 2).
          allOf:
          - $ref: '#/components/schemas/ConstraintPriority'
          default: 1
        max_deviation_ratio:
          description: Half-width of the band as a fraction of the target's mean bucket, in (0, 1].
          type: number
          format: double
          maximum: 1
          title: Max Deviation Ratio
          exclusiveMinimum: 0
        name:
          description: 'Optional user-supplied display label for the constraint, shown in place of the generated description. Cosmetic only: never read by the solver and never part of the constraint''s identity, so distinct constraints may share a name.'
          type: string
          maxLength: 200
          title: Name
        type:
          type: string
          enum:
          - cashflow_band
          title: Type
      required:
      - type
      - max_deviation_ratio
      title: CashflowBandConstraint
    ShortStrategy:
