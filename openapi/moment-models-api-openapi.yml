openapi: 3.2.0
info:
  title: Models API
  description: Moment's Models API allows Clients to manage their portfolio models.
  version: 1.0.0
  contact:
    name: Moment Support
    email: support@withmoment.com
    url: https://withmoment.com/support
servers:
- url: https://live.moment-api.com
- url: https://paper.moment-api.com
tags:
- name: Models
paths:
  /v1/model/:
    get:
      tags:
      - Models
      summary: List all Models
      operationId: ListModels
      parameters:
      - name: strategy_type
        in: query
        description: Filter by strategy type. If not provided, returns all strategy types.
        required: false
        schema:
          type: string
          enum:
          - fixed_income
          - security_list
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShortStrategy'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    post:
      tags:
      - Models
      summary: Create a Model
      operationId: CreateModel
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CreateStrategyRequest'
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStrategyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/model/preview/:
    post:
      tags:
      - Models
      summary: Preview a Model
      operationId: PreviewModel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewModelRequest'
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewModelResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/model/{model_id}/:
    get:
      tags:
      - Models
      summary: Get a Model
      operationId: GetModel
      parameters:
      - $ref: '#/components/parameters/model_id'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStrategyResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    patch:
      tags:
      - Models
      summary: Update a Model
      operationId: UpdateModel
      parameters:
      - $ref: '#/components/parameters/model_id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStrategyRequest'
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStrategyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '409':
          description: Conflict - strategy_type mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    delete:
      tags:
      - Models
      summary: Delete a Model
      operationId: DeleteModel
      parameters:
      - $ref: '#/components/parameters/model_id'
      responses:
        '204':
          description: Model deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '409':
          description: Conflict - the strategy is referenced by live asset allocation templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyReferencedByTemplatesError'
        '422':
          description: Unprocessable Entity - strategy is not a model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/model/{model_id}/history/:
    get:
      tags:
      - Models
      summary: Get a Model's version history
      description: Returns the audit trail of changes for a security_list strategy, most recent first. Not available for fixed_income models.
      operationId: GetModelHistory
      parameters:
      - $ref: '#/components/parameters/model_id'
      - name: limit
        in: query
        description: Max versions to return (most recent first). Defaults to 20, capped at 100.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: Opaque pagination cursor from a previous response's next_cursor. Omit for the first (most recent) page.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyVersionPage'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
components:
  schemas:
    UpdateSecurityListStrategy:
      description: Security-list strategy update (all fields optional for PATCH)
      type: object
      properties:
        allocation_type:
          $ref: '#/components/schemas/AllocationType'
        notional_basis:
          description: The notional amount used as basis for weight calculations
          type: number
          default: 10000000
          title: Notional Basis
          x-go-type: float64
        schema_version:
          type: integer
          enum:
          - 1
          title: Schema Version
        securities:
          description: The list of securities with their allocations
          type: array
          items:
            $ref: '#/components/schemas/SecurityListItem'
          title: Securities
      title: UpdateSecurityListStrategy
    State:
      type: string
      enum:
      - AL
      - AK
      - AS
      - AZ
      - AR
      - CA
      - CO
      - CT
      - DC
      - DE
      - FL
      - GA
      - GU
      - HI
      - ID
      - IL
      - IN
      - IA
      - KS
      - KY
      - LA
      - ME
      - MD
      - MA
      - MI
      - MN
      - MS
      - MO
      - MP
      - MT
      - NE
      - NV
      - NH
      - NJ
      - NM
      - NY
      - NC
      - ND
      - OH
      - OK
      - OR
      - PA
      - PR
      - RI
      - SC
      - SD
      - TN
      - TX
      - UT
      - VI
      - VT
      - VA
      - WA
      - WV
      - WI
      - WY
      - ''
      title: State
    UpdateStrategyRequest:
      description: Request to update a strategy
      discriminator:
        propertyName: strategy_type
        mapping:
          fixed_income: '#/components/schemas/UpdateFixedIncomeStrategyRequest'
          security_list: '#/components/schemas/UpdateSecurityListStrategyRequest'
      oneOf:
      - $ref: '#/components/schemas/UpdateFixedIncomeStrategyRequest'
      - $ref: '#/components/schemas/UpdateSecurityListStrategyRequest'
    NullDecimal:
      type:
      - number
      - 'null'
      format: double
      title: NullDecimal
      x-go-type: decimal.NullDecimal
      x-go-type-import:
        path: github.com/shopspring/decimal
        name: decimal
    AverageValueConstraint:
      type: object
      properties:
        id:
          description: Unique identifier for this constraint. Must match the `constraint_id` on the enclosing `ConstraintOperation`. Required.
          type: string
          title: ID
        constraint_priority:
          $ref: '#/components/schemas/ConstraintPriority'
        field:
          description: The field to apply the average value constraint to.
          type: string
          title: Field
        max_average_value:
          description: The maximum average value for the field.
          anyOf:
          - type: number
          - type: string
          title: Max Average Value
        min_average_value:
          description: The minimum average value for the field.
          anyOf:
          - type: number
          - type: string
          title: Min Average Value
        name:
          description: 'Optional user-supplied display label for the constraint, shown in place of the generated description. Cosmetic only: never read by the solver and never part of the constraint''s identity, so distinct constraints may share a name.'
          type: string
          maxLength: 200
          title: Name
        scope:
          $ref: '#/components/schemas/FilterDictionary'
        target_average_value:
          description: The target average value for the field.
          anyOf:
          - type: number
          - type: string
          title: Target Average Value
        type:
          type: string
          enum:
          - average_value
          title: Type
      required:
      - type
      - field
      title: AverageValueConstraint
    GetFixedIncomeStrategyResponse:
      description: Response for getting a fixed_income strategy
      type: object
      allOf:
      - $ref: '#/components/schemas/FixedIncomeModel'
      - type: object
        properties:
          sample_holdings:
            type: array
            items:
              $ref: '#/components/schemas/Holding'
            readOnly: true
          sample_statistics:
            allOf:
            - $ref: '#/components/schemas/Statistics'
            readOnly: true
          strategy:
            $ref: '#/components/schemas/FixedIncomeStrategy'
          strategy_type:
            type: string
            enum:
            - fixed_income
        required:
        - strategy_type
    UpdateFixedIncomeStrategyResponse:
      description: Response for updating a fixed_income strategy
      allOf:
      - $ref: '#/components/schemas/GetFixedIncomeStrategyResponse'
    UpdateSecurityListStrategyRequest:
      type: object
      properties:
        account_minimum:
          description: Recommended minimum account size for assigning this strategy.
          type:
          - number
          - 'null'
          x-go-type: float64
        description:
          description: The description of the strategy
          type: string
        benchmark:
          description: Benchmark index the strategy is measured against (e.g., 'S&P 500'). Free-text, user-supplied; null when unset.
          type:
          - string
          - 'null'
        model_program:
          description: Program tag used for grouping models in a hierarchy (e.g., 'NEPC Passive Taxable'). Null when unset so downstream renderers can distinguish "no program assigned" from a real value.
          type:
          - string
          - 'null'
        unresolved_securities:
          description: CUSIPs from an external model feed that did not resolve to a security and are excluded from the holdings. Omitted or null keeps the current value; send an empty array to clear it.
          type:
          - array
          - 'null'
          items:
            type: string
        risk_class:
          description: Risk classification for the strategy (e.g., 'Conservative'). Free-text, user-supplied; null when unset.
          type:
          - string
          - 'null'
        sector:
          description: Sector classification for the strategy (e.g., 'Technology'). Free-text, user-supplied; null when unset.
          type:
          - string
          - 'null'
        name:
          description: The name of the strategy
          type: string
        portfolio_manager:
          description: Name of the portfolio manager. Used for compliance and trade attribution purposes. Null when unset — downstream renderers (e.g. trade memo) must guard on null to avoid emitting attribution lines without a name.
          type:
          - string
          - 'null'
        sharing_organization_id:
          description: The organization that owns the strategy
          type: string
        strategy:
          $ref: '#/components/schemas/UpdateSecurityListStrategy'
        strategy_type:
          type: string
          enum:
          - security_list
      required:
      - strategy_type
    UniverseTracker:
      type: object
      properties:
        compliant:
          type: boolean
          title: Compliant
        instrument_id:
          type: string
          title: Instrument ID
        market_value:
          type: number
          title: Market Value
          x-go-type: decimal.Decimal
          x-go-type-import:
            path: github.com/shopspring/decimal
            name: decimal
        weight:
          type: number
          title: Weight
          x-go-type: decimal.Decimal
          x-go-type-import:
            path: github.com/shopspring/decimal
            name: decimal
    DiversificationFieldValidation:
      type: object
      properties:
        compliant:
          type: boolean
        equal_weight_deviation:
          description: 'Set only on a held group an equal-weight rule flags as outside its

            equal_weight_target; such a group is not compliant.'
          allOf:
          - $ref: '#/components/schemas/EqualWeightDeviation'
        field_value:
          type: string
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/InstrumentID'
        market_value:
          type: number
          x-go-type: decimal.Decimal
          x-go-type-import:
            path: github.com/shopspring/decimal
            name: decimal
        on_track:
          type: boolean
        weight:
          type: number
          x-go-type: decimal.Decimal
          x-go-type-import:
            path: github.com/shopspring/decimal
            name: decimal
      required:
      - field_value
      - holdings
      - market_value
      - weight
      - compliant
      - on_track
    AllocationTemplateRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
      title: AllocationTemplateRef
    DiversificationConstraintValidation:
      type: object
      properties:
        compliant:
          type: boolean
          title: Compliant
        constraint:
          $ref: '#/components/schemas/DiversificationConstraint'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/DiversificationFieldValidation'
          title: Fields
        id:
          description: The ID of the constraint.
          type: string
          title: ID
        invalid_fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldValidation'
          title: Invalid Fields
        on_track:
          type: boolean
          title: On Track
        piece_condition:
          description: 'The matched piece''s condition, emitted only on a child of a

            `PiecewiseConstraint` whose piece carries one. Absent on every

            other constraint, and on a child of a conditionless piece.'
          allOf:
          - $ref: '#/components/schemas/PiecewiseCondition'
          title: Piece Condition
        relaxed:
          description: Whether this constraint was relaxed by the solver during the most recent solve.
          type: boolean
          default: false
          title: Relaxed
        relaxed_compliant:
          description: 'Whether the constraint is compliant against the relaxed bounds

            the solver actually used. Equals `compliant` when the constraint

            was not relaxed.'
          type:
          - boolean
          - 'null'
          title: Relaxed Compliant
        equal_weight_target:
          description: 'Present only on a rule with equal_weight_tolerance when at least two

            groups are held and the weight denominator is positive: the weight

            range every held group should fall in.'
          allOf:
          - $ref: '#/components/schemas/EqualWeightTarget'
          title: Equal Weight Target
        total_scoped_market_value:
          description: 'The denominator of each field group''s `weight`: market value of the

            holdings in the constraint''s scope, plus cash when the valuation

            config counts it (`total_mv`). Ignores the account''s target or

            desired market value. The weight bound is graded only while the

            scope holds securities. Null unless the constraint has a scope and a

            min or max weight bound.'
          allOf:
          - $ref: '#/components/schemas/NullDecimal'
          title: Total Scoped Market Value
          x-go-type-skip-optional-pointer: true
      required:
      - compliant
      - on_track
      - constraint
      - invalid_fields
    EqualWeightDeviation:
      description: Which side of its equal-weight target a held group falls on.
      type: string
      enum:
      - too_small
      - too_large
      x-enum-varnames:
      - EqualWeightDeviationTooSmall
      - EqualWeightDeviationTooLarge
      title: EqualWeightDeviation
    AllocationConstraint:
      type: object
      properties:
        id:
          description: Unique identifier for this constraint. Must match the `constraint_id` on the enclosing `ConstraintOperation`. Required.
          type: string
          title: ID
        constraint_priority:
          $ref: '#/components/schemas/ConstraintPriority'
        filter:
          $ref: '#/components/schemas/FilterDictionary'
        max_market_value:
          description: The maximum market value for the allocation constraint, which can be specified instead of max_weight.
          type: number
          format: double
          title: Max Market Value
        max_weight:
          description: The maximum weight for the allocation constraint. Bounded to [0, 1].
          type: number
          format: double
          minimum: 0
          maximum: 1
          title: Max Weight
        min_market_value:
          description: The minimum market value for the allocation constraint, which can be specified instead of min_weight.
          type: number
          format: double
          title: Min Market Value
        min_weight:
          description: The minimum weight for the allocation constraint. Bounded to [0, 1].
          type: number
          format: double
          minimum: 0
          maximum: 1
          title: Min Weight
        name:
          description: 'Optional user-supplied display label for the constraint, shown in place of the generated description. Cosmetic only: never read by the solver and never part of the constraint''s identity, so distinct constraints may share a name.'
          type: string
          maxLength: 200
          title: Name
        rel_buffer:
          description: Relative buffer applied around the target. Half-open [0, 1).
          type: number
          format: double
          minimum: 0
          default: 0.01
          title: Rel Buffer
          exclusiveMaximum: 1
        scope:
          $ref: '#/components/schemas/FilterDictionary'
        target_market_value:
          description: The target market value for the allocation constraint, which can be specified instead of target_weight.
          type: number
          format: double
          title: Target Market Value
        target_weight:
          description: The target weight for the allocation constraint. Bounded to [0, 1].
          type: number
          format: double
          minimum: 0
          maximum: 1
          title: Target Weight
        type:
          type: string
          enum:
          - allocation
          title: Type
      required:
      - filter
      - type
      title: AllocationConstraint
    PreviewModelRequest:
      type: object
      properties:
        assignment_date:
          description: The date to assign the model
          type: string
          format: date
          title: Assignment Date
          x-go-type: string
        cash:
          description: The amount of cash to invest in the model
          type: number
          title: Cash
          x-go-type: float64
        customizations:
          $ref: '#/components/schemas/Customizations'
        federal_tax_rate:
          description: The federal tax rate to apply to the model
          type: number
          default: 0
          title: Federal Tax Rate
          x-go-type: float64
        local_tax_rate:
          description: The local tax rate to apply to the model
          type: number
          default: 0
          title: Local Tax Rate
          x-go-type: float64
        risk_group_id:
          description: The ID of the risk group to apply to the model
          type: string
          title: Risk Group ID
        state:
          description: The state that the user is in. This will alter the tax treatments of the portfolio.
          allOf:
          - $ref: '#/components/schemas/State'
        state_tax_rate:
          description: The state tax rate to apply to the model
          type: number
          default: 0
          title: State Tax Rate
          x-go-type: float64
        strategy:
          $ref: '#/components/schemas/FixedIncomeStrategy'
      required:
      - state
      - strategy
    ObjectiveTermOperation:
      description: The operation to apply between objective terms.
      type: string
      enum:
      - add
      - subtract
      - multiply
      - divide
      - max
      - min
      title: ObjectiveTermOperation
    ConcreteObjectiveTerm:
      description: A leaf or operation node in an objective term tree — either a field reference or an operation applied to other nodes.
      discriminator:
        propertyName: type
        mapping:
          field: '#/components/schemas/FieldTerm'
          operation: '#/components/schemas/OperationTerm'
      oneOf:
      - $ref: '#/components/schemas/FieldTerm'
      - $ref: '#/components/schemas/OperationTerm'
      title: ConcreteObjectiveTerm
    EqualWeightTarget:
      description: 'The weight range, as fractions of the account''s weight denominator, that

        every held group of an equal-weight rule should fall in.'
      type: object
      properties:
        min_weight:
          type: number
          format: double
          title: Min Weight
        max_weight:
          type: number
          format: double
          title: Max Weight
      required:
      - min_weight
      - max_weight
      title: EqualWeightTarget
    FixedIncomeShortStatistics:
      type: object
      properties:
        average_coupon:
          description: The average coupon of the model's sample holdings
          type: number
          readOnly: true
          x-go-type: float64
        average_duration:
          description: The average duration of the model's sample holdings
          type: number
          readOnly: true
          x-go-type: float64
          x-oapi-codegen-extra-tags:
            excludable: 'true'
        average_maturity:
          description: The average maturity (in years) of the model's sample holdings
          type: number
          readOnly: true
          x-go-type: float64
        average_moodys_rating:
          description: The average Moody's rating of the model's sample holdings
          type: string
          readOnly: true
          x-oapi-codegen-extra-tags:
            excludable: 'true'
        average_sp_rating:
          description: The average SP rating of the model's sample holdings
          type: string
          readOnly: true
          x-oapi-codegen-extra-tags:
            excludable: 'true'
        average_tax_equivalent_ytw:
          description: The average tax equivalent yield to worst of the model's sample holdings
          type: number
          readOnly: true
          x-go-type: float64
        average_ytm:
          description: The average yield to maturity of the model's sample holdings
          type: number
          readOnly: true
          x-go-type: float64
        average_ytw:
          description: The average yield to worst of the model's sample holdings
          type: number
          readOnly: true
          x-go-type: float64
    SecurityListStrategy:
      description: Security-list strategy with explicit instrument allocations
      type: object
      properties:
        allocation_type:
          $ref: '#/components/schemas/AllocationType'
        notional_basis:
          description: The notional amount used as basis for weight calculations
          type: number
          default: 10000000
          title: Notional Basis
          x-go-type: float64
        schema_version:
          type: integer
          enum:
          - 1
          title: Schema Version
        securities:
          description: The list of securities with their allocations
          type: array
          items:
            $ref: '#/components/schemas/SecurityListItem'
          title: Securities
      required:
      - allocation_type
      - securities
      - schema_version
      title: SecurityListStrategy
    SecurityListShortStrategy:
      description: Short strategy representation for security list strategies
      type: object
      properties:
        account_minimum:
          description: Recommended minimum account size for assigning this strategy.
          type:
          - number
          - 'null'
          x-go-type: float64
        allocation_type:
          $ref: '#/components/schemas/AllocationType'
        created_by:
          description: The user who created the strategy
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        description:
          description: The description of the strategy
          type: string
        holdings_summary:
          allOf:
          - $ref: '#/components/schemas/HoldingsSummary'
          readOnly: true
        id:
          description: The ID of the strategy
          type: string
          readOnly: true
        benchmark:
          description: Benchmark index the strategy is measured against (e.g., 'S&P 500'). Free-text, user-supplied; null when unset.
          type:
          - string
          - 'null'
        model_program:
          description: Program tag used for grouping models in a hierarchy (e.g., 'NEPC Passive Taxable'). Null when unset so downstream renderers can distinguish "no program assigned" from a real value.
          type:
          - string
          - 'null'
        risk_class:
          description: Risk classification for the strategy (e.g., 'Conservative'). Free-text, user-supplied; null when unset.
          type:
          - string
          - 'null'
        sector:
          description: Sector classification for the strategy (e.g., 'Technology'). Free-text, user-supplied; null when unset.
          type:
          - string
          - 'null'
        name:
          description: The name of the strategy
          type: string
        portfolio_manager:
          description: Name of the portfolio manager. Used for compliance and trade attribution purposes. Null when unset — downstream renderers (e.g. trade memo) must guard on null to avoid emitting attribution lines without a name.
          type:
          - string
          - 'null'
        sharing_organization:
          allOf:
          - $ref: '#/components/schemas/Organization'
          readOnly: true
        sharing_organization_id:
          description: The organization that owns the strategy
          type: string
        strategy_type:
