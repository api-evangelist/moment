      - applies_to_asset_classes
      - control
      - name
    ExposureLimit:
      description: 'An exposure limit control manages the risk for the organization that is

        attempting to execute an order. The control is defined by an optional

        filter expression that is used to identify the set of securities that

        the control applies to. The control then evaluates the order and its

        anticipated effects against the state of the organization''s portfolio

        to determine if the order is within the limits set by the control.

        '
      allOf:
      - $ref: '#/components/schemas/ControlFilter'
      - $ref: '#/components/schemas/ExposureSettings'
      - properties:
          type:
            type: string
        required:
        - type
    OrderValidation:
      description: 'An order validation control is a control that is applied to an

        order before it is executed. The control is defined by an optional

        filter expression that is used to identify the set of securities

        that the control applies to. The control is then evaluated against

        the order to determine if the order is within the limits set by the

        control.

        '
      allOf:
      - $ref: '#/components/schemas/ControlFilter'
      - $ref: '#/components/schemas/OrderAttributes'
      - properties:
          type:
            type: string
        required:
        - type
    ScopeDef:
      description: 'Indicates the entities that the control applies to. The scope is an enum

        idicating the type of entity that the control applies to, and the

        entity_ids are the unique identifiers for the organizations/accounts/etc

        to which the control applies.

        '
      type: object
      properties:
        entity_ids:
          description: 'The list of entity IDs that the control applies to. This list can

            contain any number of entity IDs and can be used to apply the control

            to multiple entities.


            Generally the entity IDs will be [ULIDs](#ULID),

            but this restriction is not enforced. The values should simply make sense

            given the scope.


            Note: Cannot be used together with excluded_entity_ids.

            '
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: true
        excluded_entity_ids:
          description: 'The list of entity IDs that are excluded from the control. This list can

            contain any number of entity IDs and can be used to exclude specific

            entities from the control scope.


            Generally the entity IDs will be [ULIDs](#ULID),

            but this restriction is not enforced. The values should simply make sense

            given the scope.


            Note: Cannot be used together with entity_ids. Only available for organization scope.

            '
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: true
        scope:
          description: 'Indicates the type of entity a control applies to.

            '
          allOf:
          - $ref: '#/components/schemas/Scope'
      not:
        allOf:
        - properties:
            entity_ids:
              type: array
          required:
          - entity_ids
        - properties:
            excluded_entity_ids:
              type: array
          required:
          - excluded_entity_ids
      oneOf:
      - required:
        - entity_ids
      - required:
        - excluded_entity_ids
      required:
      - scope
    UniverseConstraint:
      description: "A universe constraint is a control that restricts the set of securities\nthat can be traded. The constraint is defined by a pair of filter\nexpressions, one required and one optional. The two expressions are combined, such that\nthe `parameters` expression is applied to the subset of securities indicated by the `filter`\nexpression.\n\n---\n\n```json\n{\n  \"filter\": {\n    \"type\": {\n      \"in\": [ \"treasury\" ]\n    }\n  },\n  \"parameters\": {\n    \"reg_s\": {\n      \"equal_to\": true\n    }\n  }\n}\n```\n\nThe above example constrains the set of tradeable treasury instruments to those\nthat are are Reg S eligible. Assuming no other controls are applicable, the affected\norganizations' tradeable universe would be:\n\n- Reg S-eligible treasuries;\n- all munis;\n- all corporates.\n\nUniverse constraints without a `filter` expression will be applied to all instruments. The\nfollowing control would restrict the tradeable universe to instruments denominated in USD:\n\
        \n```json\n{\n  \"parameters\": {\n    \"currency\": {\n      \"equal_to\": \"USD\"\n    }\n  }\n}\n```\n\nCombined with the first control, the affected organizations' tradeable universe would be:\n\n- Reg S-eligible treasuries denominated in USD;\n- all munis denominated in USD;\n- all corporates denominated in USD.\n\nWe could then add a third control:\n\n```json\n{\n  \"filter\": {\n    \"type\": {\n      \"in\": [\n        \"corporate\",\n        \"muninicpal\",\n      ]\n    }\n  },\n  \"parameters\": {\n    \"and\": [\n      \"reg_s\": {\n        \"equal_to\": true\n      },\n      \"144a\": {\n        \"equal_to\": true\n      }\n    ]\n  }\n}\n```\n\nwhich would further restrict the tradeable universe to:\n\n- Reg S-eligible treasuries denominated in USD;\n- 144A-eligible munis denominated in USD that are not also Reg S-eligible; and\n- 144A-eligible corporates denominated in USD that are not also Reg-S eligible.\n\n### Field-to-field comparisons\n\nFilter values can also\
        \ reference other fields on the same instrument using the\n`$field` syntax. For example, the following control ensures that an instrument's\n`days_to_next_sink` is greater than its `call_notification_min`:\n\n```json\n{\n  \"parameters\": {\n    \"days_to_next_sink\": {\n      \"greater_than\": { \"$field\": \"call_notification_min\" }\n    }\n  }\n}\n```\n\nField references are supported on all scalar comparison operators\n(`equal_to`, `greater_than`, `less_than`, etc.) but not on array\noperators (`in`, `not_in`).\n"
      allOf:
      - $ref: '#/components/schemas/ControlFilter'
      - $ref: '#/components/schemas/UniverseParameters'
      - properties:
          type:
            type: string
        required:
        - type
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
