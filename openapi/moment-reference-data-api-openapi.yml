    InventoryReturnField:
      description: "A field that can be requested in the `returns` array. Fields come from\nthree distinct sources — choose based on whether you want the live\nmarket or an evaluated model price:\n\n1. LIVE ORDER BOOK (real, executable quotes from dealers):\n   - `bids` / `asks`: full depth — every individual quote with its own\n     price, quantity, min_quantity, and yield_to_worst.\n   - `best_ask_ytw`: the live top-of-book ask yield — the YTW of the\n     best offer (lowest price, i.e. highest yield). Use this (or read\n     `asks`) for \"what's the yield on this bond / the best offer to buy\n     at\".\n   - `best_bid_ytw`: the live top-of-book bid yield — the YTW of the\n     best bid (highest price, i.e. lowest yield). Use this (or read\n     `bids`) for \"what could I sell this at\".\n   - `best_ask_price` / `best_bid_price`: the live top-of-book ask/bid\n     PRICE — the price of the same best offer/bid as `best_ask_ytw` /\n     `best_bid_ytw`. Use these (or read `asks` / `bids`) for \"what's the\n     price of the best offer / what could I sell this at\"; do NOT use the\n     deprecated `ask_price` / `bid_price`, which are evaluated-model\n     values, not live quotes.\n   - `best_ask_post_tax_ytw` / `best_bid_post_tax_ytw`,\n     `best_ask_tax_equivalent_yield` / `best_bid_tax_equivalent_yield`,\n     `market_spread_*`: derived from the live order book.\n\n2. EVALUATED MODEL (price-estimates feed — a modeled valuation, NOT a\n   live tradable quote):\n   - `eval_price` / `eval_ytw` / `eval_ytm`: the mid evaluated value.\n   - `eval_bid_*` / `eval_ask_*` / `eval_mid_*` (price, ytw, ytm, ytc,\n     spreads, oas): the evaluated curve's bid/ask/mid values. These are\n     model outputs, not order-book quotes.\n   - `ask_eval_ytw_diff` / `bid_eval_ytw_diff` (and the `_price_diff`\n     variants): live best book yield/price MINUS the evaluated value.\n\n3. REFERENCE / STATIC DATA: identifiers, descriptive, ratings, dates,\n   call schedule, etc. (`isin`, `cusip`, `issuer`, `coupon`, ...).\n\nDEPRECATED — a non-deprecated alternative always exists, so always find\nit and use it instead: the bare `bid_*` / `ask_*` / `mid_*` families\n(`ask_ytw`, `bid_ytw`, `mid_ytw`, `ask_price`, `bid_price`, `ask_oas`,\n`ask_ytw_spread_bps`, ...) are EVALUATED-MODEL values, NOT live\norder-book quotes despite the bid/ask naming. Each is an exact alias of\nits `eval_`-prefixed counterpart (e.g. `ask_ytw` == `eval_ask_ytw`,\n`ask_price` == `eval_ask_price`). They are retained only for backward\ncompatibility and will be removed. For the evaluated value use the\nexplicit `eval_*` name (`eval_ask_price`, `eval_ask_ytw`, ...); for the\nlive top-of-book use `best_ask_price` / `best_bid_price` /\n`best_ask_ytw` / `best_bid_ytw` or the `asks` / `bids` arrays.\n"
