openapi: 3.2.0
info:
  title: Risk Instruments API
  description: Moment's Risk API allows clients to configure and retrieve risk policies for pre-trade checks.
  version: 1.0.0
  contact:
    name: Moment Support
    email: support@withmoment.com
servers:
- url: https://live.moment-api.com
- url: https://paper.moment-api.com
security:
- bearerAuth: []
tags:
- name: Instruments
paths:
  /v1/risk/{ib_id}/group/{group_id}/universe/:
    get:
      tags:
      - Instruments
      summary: Eligible Universe
      description: Get the tradable universe for the specified risk group. This endpoint is paginated.
      operationId: getTradeableUniverse
      parameters:
      - name: ib_id
        in: path
        description: The introducing broker's ID.
        required: true
        schema:
          type: string
      - name: group_id
        in: path
        description: The risk group's ID.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaginatedTradableUniverse'
components:
  schemas:
    TradableInstrument:
      type: object
      properties:
        CUSIP:
          type: string
          description: The instrument's CUSIP.
        ISIN:
          type: string
          description: The instrument's ISIN.
    TradableUniverse:
      type: array
      items:
        $ref: '#/components/schemas/TradableInstrument'
    PaginatedTradableUniverse:
      type: object
      properties:
        count:
          type: integer
          description: The total number of items in the universe.
        next:
          type: string
          description: The URL for the next page of results. Null if there is no next page.
        previous:
          type: string
          description: The URL for the previous page of results. Null if there is no previous page.
        data:
          $ref: '#/components/schemas/TradableUniverse'
  parameters:
    page_size:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
      description: Number of items to return. Must be in range 1-1000, defaults to 100.
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
      description: Page number of results to return. Defaults to 1.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
