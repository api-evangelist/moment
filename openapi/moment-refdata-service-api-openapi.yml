          nullable: true
        holding_detail_type:
          type: string
          nullable: true
        holding_weighting:
          type: number
          format: double
          nullable: true
        holding_market_value:
          type: number
          format: double
          nullable: true
        holding_number_of_shares:
          type: number
          format: double
          nullable: true
        holding_duration:
          type: number
          format: double
          nullable: true
    SecurityResolveRequest:
      type: object
      properties:
        identifiers:
          type: array
          maxItems: 1000
          items:
            type: string
          description: 'Identifiers to resolve (ISIN, CUSIP, or symbol). Duplicates collapse

            into a single result.'
        fields:
          type: array
          items:
            type: string
          description: Fields to include in each resolved record. All fields when omitted.
        resolution_order:
          type: array
          items:
            type: string
            enum:
            - equity
