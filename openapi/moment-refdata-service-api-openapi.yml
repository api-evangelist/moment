          format: date
          nullable: true
        holding_security_name:
          type: string
          nullable: true
        holding_symbol:
          type: string
          nullable: true
        holding_cusip:
          type: string
          nullable: true
        holding_isin:
          type: string
          nullable: true
        holding_country_code:
          type: string
          nullable: true
        holding_currency_code:
