          nullable: true
        currency:
          type: string
          nullable: true
        symbol:
          type: string
          nullable: true
        cfi_code:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        inactive_date:
          type: string
          format: date
          nullable: true
        active:
