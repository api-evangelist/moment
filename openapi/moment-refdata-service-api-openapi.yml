openapi: 3.0.3
info:
  title: Refdata Service API
  version: 1.0.0
  description: API for accessing reference data internally.
paths:
  /health:
    get:
      summary: Health Check
      description: Returns the health status of the service
      operationId: getHealth
      tags:
      - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/equity/snapshot:
    get:
      summary: Get Equity Snapshot
      description: 'Returns equity records as newline-delimited JSON (NDJSON).

        Use the filter parameter to narrow results and the fields parameter to

        select which fields are returned.


        When the filter targets the cache key field (isin) with an "in" operator,

        the server performs direct cache lookups instead of scanning all records.

        Additional filters in the same request are applied to the narrowed set.'
      operationId: getEquitySnapshot
      tags:
      - Equity
      parameters:
      - $ref: '#/components/parameters/SnapshotFields'
      - $ref: '#/components/parameters/SnapshotFilter'
      responses:
        '200':
          description: Successful response (NDJSON stream)
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/Equity'
        '400':
          description: Invalid filter expression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/equity/{id}:
    get:
      summary: Get Equity by identifier
      description: 'Returns a single equity record by ISIN. If the identifier is not

        an ISIN, the service attempts to auto-detect the symbol type and

        resolve it to the underlying ISIN.'
      operationId: getEquityByID
      tags:
      - Equity
      parameters:
      - name: id
        in: path
        required: true
        description: 'Security identifier. ISINs are looked up directly; other formats

          (e.g., CUSIP) are auto-detected and resolved.'
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equity'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/fixed-income/analytics:
    post:
      summary: Compute Fixed-Income Analytics
      description: 'Accepts a matrix of symbols and analytic fields, computes the requested

        analytics for each symbol using in-memory reference data.'
      operationId: postFixedIncomeAnalytics
      tags:
      - FixedIncome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/fixed-income/snapshot:
    get:
      summary: Get FixedIncome Snapshot
      description: 'Returns fixed-income records as newline-delimited JSON (NDJSON).

        Use the filter parameter to narrow results and the fields parameter to

        select which fields are returned.


        When the filter targets the cache key field (isin) with an "in" operator,

        the server performs direct cache lookups instead of scanning all records.

        Additional filters in the same request are applied to the narrowed set.'
      operationId: getFixedIncomeSnapshot
      tags:
      - FixedIncome
      parameters:
      - $ref: '#/components/parameters/SnapshotFields'
      - $ref: '#/components/parameters/SnapshotFilter'
      responses:
        '200':
          description: Successful response (NDJSON stream)
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/FixedIncome'
        '400':
          description: Invalid filter expression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/fixed-income/{id}:
    get:
      summary: Get FixedIncome by identifier
      description: 'Returns a single fixed-income record by ISIN. If the identifier is not

        an ISIN, the service attempts to auto-detect the symbol type and

        resolve it to the underlying ISIN.'
      operationId: getFixedIncomeByID
      tags:
      - FixedIncome
      parameters:
      - name: id
        in: path
        required: true
        description: 'Security identifier. ISINs are looked up directly; other formats

          (e.g., CUSIP) are auto-detected and resolved.'
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedIncome'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/fund/holdings/snapshot:
    get:
      summary: Get Fund Holdings Snapshot
      description: 'Returns all fund holdings across all funds as NDJSON.

        Use the filter parameter to narrow results and the fields parameter to

        select which fields are returned.


        When the filter targets the cache key field with an "in" operator,

        the server performs direct cache lookups instead of scanning all records.

        Additional filters in the same request are applied to the narrowed set.'
      operationId: getFundHoldingsSnapshot
      tags:
      - FundHolding
      parameters:
      - $ref: '#/components/parameters/SnapshotFields'
      - $ref: '#/components/parameters/SnapshotFilter'
      responses:
        '200':
          description: Successful response (NDJSON stream)
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/FundHolding'
        '400':
          description: Invalid filter expression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/fund/holdings/{id}:
    get:
      summary: Get Fund Holdings
      description: 'Returns holdings for a single fund by ISIN. If the identifier is not

        an ISIN, the service attempts to auto-detect the symbol type and

        resolve it to the underlying ISIN.'
      operationId: getFundHoldings
      tags:
      - FundHolding
      parameters:
      - name: id
        in: path
        required: true
        description: 'Fund identifier. ISINs are looked up directly; other formats

          (e.g., CUSIP) are auto-detected and resolved.'
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundHoldingResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/fund/snapshot:
    get:
      summary: Get Fund Snapshot
      description: 'Returns fund records as newline-delimited JSON (NDJSON).

        Use the filter parameter to narrow results and the fields parameter to

        select which fields are returned.


        When the filter targets the cache key field (isin) with an "in" operator,

        the server performs direct cache lookups instead of scanning all records.

        Additional filters in the same request are applied to the narrowed set.'
      operationId: getFundSnapshot
      tags:
      - Fund
      parameters:
      - $ref: '#/components/parameters/SnapshotFields'
      - $ref: '#/components/parameters/SnapshotFilter'
      responses:
        '200':
          description: Successful response (NDJSON stream)
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/Fund'
        '400':
          description: Invalid filter expression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/fund/{id}:
    get:
      summary: Get Fund by identifier
      description: 'Returns a single fund record by ISIN. If the identifier is not

        an ISIN, the service attempts to auto-detect the symbol type and

        resolve it to the underlying ISIN.'
      operationId: getFundByID
      tags:
      - Fund
      parameters:
      - name: id
        in: path
        required: true
        description: 'Security identifier. ISINs are looked up directly; other formats

          (e.g., CUSIP) are auto-detected and resolved.'
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fund'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/security/resolve:
    post:
      summary: Resolve Securities in Bulk
      description: 'Resolves a batch of identifiers (ISIN, CUSIP, symbol) and returns one

        result per identifier, keyed by the identifier exactly as sent.


        Each identifier is looked up the same way GET /v1/security/{id} looks up

        one: identifiers are matched verbatim, so a lowercase symbol is

        not_found. Asset-type caches are consulted in the order given by

        resolution_order (or the default order when omitted), and asset types

        not listed are not searched.'
      operationId: postSecurityResolve
      tags:
      - Security
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityResolveRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityResolveResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/security/snapshot:
    get:
      summary: Get Security Snapshot
      description: 'Returns security records across all asset classes as NDJSON.

        Use the filter parameter to narrow results and the fields parameter to

        select which fields are returned.


        When the filter targets the cache key field (isin) with an "in" operator,

        the server performs direct cache lookups instead of scanning all records.

        Additional filters in the same request are applied to the narrowed set.'
      operationId: getSecuritySnapshot
      tags:
      - Security
      parameters:
      - $ref: '#/components/parameters/SnapshotFields'
      - $ref: '#/components/parameters/SnapshotFilter'
      responses:
        '200':
          description: Successful response (NDJSON stream)
          content:
            application/x-ndjson:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Equity'
                - $ref: '#/components/schemas/FixedIncome'
                - $ref: '#/components/schemas/Fund'
        '400':
          description: Invalid filter expression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/security/{id}:
    get:
      summary: Get Security by identifier
      description: 'Returns a single security record by ISIN across all asset classes.

        If the identifier is not an ISIN, the service attempts to auto-detect

        the symbol type and resolve it to the underlying ISIN.'
      operationId: getSecurityByID
      tags:
      - Security
      parameters:
      - name: id
        in: path
        required: true
        description: 'Security identifier. ISINs are looked up directly; other formats

          (e.g., CUSIP) are auto-detected and resolved.'
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Equity'
                - $ref: '#/components/schemas/FixedIncome'
                - $ref: '#/components/schemas/Fund'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
