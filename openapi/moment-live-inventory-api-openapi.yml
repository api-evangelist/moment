    LiveInventoryRequest:
      type: object
      properties:
        custom_capital_gains_tax:
          description: 'Capital gains tax rate as a decimal between 0 and 1. Meaningful

            when `tax_profile` is `custom_taxable` or `uk_taxable`; under

            `uk_taxable` it is overridden to 0 for Gilts and QCBs. The

            `us_taxable` profile does not apply a capital-gains adjustment —

            post-tax yield under `us_taxable` is computed multiplicatively from

            the effective income tax rate alone, deferring real capgain

            handling until a dedicated US capital-gains field is added.'
          type: number
          format: double
          maximum: 1
          minimum: 0
        custom_income_tax:
          description: 'Marginal income tax rate as a decimal between 0 and 1. Meaningful

            when `tax_profile` is `custom_taxable` or `uk_taxable`; ignored

            under `us_taxable`, which uses `federal_tax_rate` + `state_tax_rate`

            + `residing_state` per-bond rules instead.'
          type: number
          format: double
          maximum: 1
          minimum: 0
        federal_tax_rate:
          description: 'Investor''s marginal federal income tax rate, as a decimal 0-1.

            Used only under the `us_taxable` profile (alongside

            `state_tax_rate` + `residing_state`); ignored under

            `custom_taxable`/`uk_taxable`, which use `custom_income_tax`.

            Default 0.37.'
          type: number
          format: double
          default: 0.37
          maximum: 1
          minimum: 0
        filters:
          description: 'The filters to apply, as a JSON object whose keys are fields to filter on or

            operators. Send the object itself: this field is a nested object in the request

            body, not a JSON-encoded string (`objective_function` is the only field on this

            body that takes a JSON-encoded string).

            Example: {"cusip": {"in": ["035240AQ3"]}, "maturity_date": {"less_than": "2030-01-01"}}'
          $ref: '#/components/schemas/InventoryFilter'
        objective_function:
          description: 'JSON-encoded objective function that defines the scoring formula for ranking bonds.

            Contains a list of weighted terms, each referencing a field or an arithmetic expression.

            Unlike `filters`, this field is a string: serialize the objective to JSON and send

            the resulting string.

            Example: {"terms": [{"term": {"type": "field", "field": "duration", "factor": 0.01}, "factor": 1.0}]}


            `order_price`, `order_ytw` and `order_ytm` score the top of the book on the

            scoring side (`objective_side`, or `side` when absent), falling back to price

            estimates; an objective referencing them requires a scoring side (400 otherwise)

            and risk group headers. `spread_to_benchmark` is an accepted optimizer alias for

            `mid_ytw_spread_bps`, valid only inside the objective.'
          type: string
        objective_side:
          description: 'Which side of the book `objective_function`''s order fields score: ''sell'' the

            asks, ''buy'' the bids (''both'' is not accepted). Scoring-only — unlike `side` it

            never filters the results, and it takes precedence over `side` for scoring.

            Scoring order fields reads the live order book, so risk group headers are

            still required.'
          type: string
          enum:
          - buy
          - sell
        page:
          description: The page number of the results to return. If not provided, the default is page 1.
          type: integer
        page_size:
          description: The number of results to return per page. If not provided, the default is 100.
          type: integer
        residing_state:
          description: 'Two-letter state code of the investor''s state of residence.

            Example: "CA", "NY", "TX". Used only under the `us_taxable`

            profile (drives per-bond state-tax exemptions); ignored under

            `custom_taxable`/`uk_taxable`.'
          type: string
          maxLength: 2
          minLength: 2
        returns:
          description: The fields to return in the response.
          type: array
          items:
            $ref: '#/components/schemas/InventoryReturnField'
          example:
          - isin
          - cusip
          - description
          - bids
          - asks
        risk_group_id:
          description: 'The risk group ID to filter for tradable inventory. If left null,

            and a single risk group exists for the organization, it will be

            used as the default risk group. If left null, and more than one

            risk group exists, the request will fail.'
          type: string
        side:
          description: "Specify a side for inventory filters. Possible values:\n\n- 'buy' will limit the results to bonds that have quotes to buy\n  the instrument.\n- 'sell' will limit the results to bonds that have quotes to sell\n  the instrument.\n- 'both' will limit the results to bonds that have quotes on both\n  sides of the market, i.e. at least one quote to buy and one to sell.\n\nImportant note: If you are building a UI that leverages this API, you should be\nespecially cognizant that this value represents inventory side, not trade side.\n\nA client who wants to purchase a bond will look for asks/offers where the\ncounterparty wants to sell. Hence, they should pass 'sell' to the API.\n\nA client who wants to sell a bond will look for bids where the counterparty\nwants to buy. Hence, they should pass 'buy' to the API.\n\nWhen `objective_function` references `order_*` fields and `objective_side` is\nabsent, `side` also selects which side of the book those fields score ('both'\nor\
            \ no side is rejected with a 400). Use `objective_side` to choose the scoring\nside independently of this filter."
          type: string
          enum:
          - buy
          - sell
          - both
        sort_by:
          description: 'The fields to sort the results by. Each field can optionally specify a direction

            by appending ''.asc'' or ''.desc''. If no direction is specified, defaults to ascending order.'
          type: array
          items:
            type: string
          example:
          - isin.asc
          - cusip.desc
          - par_value.asc
          - maturity_date
          - issuer
        state_tax_rate:
          description: 'Investor''s marginal state income tax rate, as a decimal 0-1.

            Used only under the `us_taxable` profile; ignored under

            `custom_taxable`/`uk_taxable`.'
          type: number
          format: double
          default: 0
          maximum: 1
          minimum: 0
        tax_profile:
          description: "Tax profile classification controlling how post-tax yield fields\nand the post-tax objective term are computed.\n\n- `us_taxable` (default): post-tax yield is the pre-tax yield\n  multiplied by `(1 - effective_tax_rate)`, where\n  `effective_tax_rate` is the per-bond combination of\n  `federal_tax_rate` + `state_tax_rate` + `residing_state` with\n  treasury, US-territory, state-exempt-agency, and muni\n  federal/state exemption carve-outs applied per bond. Capital\n  gains is not applied under this profile (deferred until a real\n  US capgain field is defined).\n- `custom_taxable`: post-tax yield is the bivariate Taylor\n  expansion of after-tax YTW evaluated at constants\n  (`s = custom_income_tax`, `g = custom_capital_gains_tax`).\n  Federal/state/residing-state are ignored.\n- `uk_taxable`: same Taylor expansion as `custom_taxable`\n  (using `custom_income_tax` and `custom_capital_gains_tax`), but\n  the capital-gains rate is forced to 0 for instruments exempt\
            \ from\n  UK capital gains tax — Gilts (`ice_sector_1 = Sovereign` and\n  `currency = GBP`) and QCBs (`qcb_indicator = true`). Income tax\n  still applies to exempt instruments.\n- `non_taxable`: no tax is applied to any instrument. Post-tax yield\n  equals the pre-tax yield and tax-equivalent yield receives no\n  gross-up. All rate fields are ignored."
          type: string
          default: us_taxable
          enum:
          - us_taxable
          - custom_taxable
          - uk_taxable
          - non_taxable
        trade_size:
          description: 'Filtering by trade_size will only return `asks` and `bids` that

            would completely fill an order of the specified quantity. More

            specifically, it will return quotes where the minimum quantity is

            less than or equal to the specified trade_size and the total

            quantity is greater than or equal to the specified trade_size.

            Optionally, set value to "lowest" to get all the quotes sorted from

            least to greatest `min_quantity`.'
          type: string
        use_close_data_after_hours:
          description: 'Whether to use close data after market hours. When false (default),

            only reference data is returned when market is closed. When true,

            orders are shown as available even after market close (9:30 AM - 4:00 PM EST/EDT, Monday-Friday).'
          type: boolean
          default: false
      required:
      - returns
    InventoryFilterCondition:
      type: object
      properties:
        ends_with:
          description: String to end with in the filter.
          type: string
        equal_to:
          description: Exact value for the filter.
          oneOf:
          - type: string
          - type: number
        greater_than:
          description: Greater than value for the filter.
          oneOf:
          - type: string
          - type: number
        greater_than_or_equal_to:
          description: Greater than or equal to value for the filter.
          oneOf:
          - type: string
          - type: number
        in:
          description: Array of values for the filter.
          type: array
          items:
            oneOf:
            - type: string
            - type: number
        in_filter_list:
          description: Filter by values from a named filter list. The value is the filter list ID (e.g., "list_01ABC123").
          type: string
        includes:
          description: String to include in the filter.
          type: string
        is_null:
          description: Boolean to filter for null / not-null values.
          type: boolean
        less_than:
          description: Less than value for the filter.
          oneOf:
          - type: string
          - type: number
        less_than_or_equal_to:
          description: Less than or equal to value for the filter.
          oneOf:
          - type: string
          - type: number
        not_equal_to:
          description: Not equal to value for the filter.
          oneOf:
          - type: string
          - type: number
        not_in:
          description: Array of values not to include in the filter.
          type: array
          items:
            oneOf:
            - type: string
            - type: number
        not_in_filter_list:
          description: Exclude values that are in a named filter list. The value is the filter list ID (e.g., "list_01ABC123").
          type: string
        not_includes:
          description: String not to include in the filter.
          type: string
        starts_with:
          description: String to start with in the filter.
          type: string
    InventoryFilter:
      description: 'In a filter object, each key is either a field to filter on or an operator.

        Each value is either a filter condition object or, in the case of certain

        operators, an array of filter objects.


        Some of the fields which can be filtered on are explicitly defined on this schema.

        Any of the other fields in the reference data model can be used as an

        InventoryFilter key.'
      type: object
      properties:
        and:
          description: Filter operator key with array value of filter objects to be combined with AND.
          type: array
          items:
            $ref: '#/components/schemas/InventoryFilter'
        country_issue:
          $ref: '#/components/schemas/InventoryFilterCondition'
        country_of_risk:
