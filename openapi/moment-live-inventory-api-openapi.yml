openapi: 3.0.3
info:
  title: Live Inventory API
  version: 1.0.0
  description: 'Live Inventory REST API for filtering and retrieving bond inventory data.

    This service provides access to live bond inventory with filtering capabilities

    for both reference data fields and real-time market data.'
  contact:
    name: Moment Support
    email: support@withmoment.com
    url: https://withmoment.com/support
servers:
- url: https://live.moment-api.com
- url: https://paper.moment-api.com
paths:
  /v1/data/inventory/:
    post:
      tags:
      - Reference Data
      - Market Data
      summary: Inventory Filtering
      description: "The inventory filtering endpoint filters for bonds that are available\nfor trading at the time of the request. Multiple fields can be filtered\nfor, including reference data fields (such as S&P rating, bond type) as\nwell as the bid / ask price and yields. These filters should be\nspecified in the `filters` field. We're also able to filter for ISINs\nthat fulfill a specific trade size.\n\nTwo types of filtering are supported:\n\n- Reference data filtering: specify filters for reference data fields,\n  such as S&P rating, bond type, and more.\n- Live inventory filtering: specify filters for price, yield to\n  maturity, and yield to worst, filter for quotes that match a trade\n  size, and get `bids` and `asks` from the `returns` field.\n\nIn addition, specific fields can be requested in the response. These\nfields should be specified in the `returns` field."
      operationId: postLiveInventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveInventoryRequest'
            examples:
              us_taxable:
                summary: US taxable investor (federal + state rates)
                description: 'The `us_taxable` profile drives post-tax yield from the

                  `federal_tax_rate`, `state_tax_rate`, and `residing_state`

                  fields. The `custom_*` fields are ignored.'
                value:
                  risk_group_id: rg_123
                  tax_profile: us_taxable
                  federal_tax_rate: 0.37
                  state_tax_rate: 0.0882
                  residing_state: NY
              custom_taxable:
                summary: Custom flat income + capital-gains rates
                description: 'The `custom_taxable` profile uses `custom_income_tax` and

                  `custom_capital_gains_tax`; the federal/state/residing-state

                  fields are ignored.'
                value:
                  risk_group_id: rg_123
                  tax_profile: custom_taxable
                  custom_income_tax: 0.45
                  custom_capital_gains_tax: 0.2
              uk_taxable:
                summary: UK investor (Gilt/QCB capital-gains exemption)
                description: 'The `uk_taxable` profile uses the same `custom_income_tax`

                  and `custom_capital_gains_tax` fields as `custom_taxable`,

                  but the capital-gains rate is forced to 0 for Gilts and QCBs.

                  The federal/state/residing-state fields are ignored.'
                value:
                  risk_group_id: rg_123
                  tax_profile: uk_taxable
                  custom_income_tax: 0.45
                  custom_capital_gains_tax: 0.2
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveInventoryResponsePOST'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1data~1inventory~1/get/responses/400/content/application~1json/schema'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1data~1inventory~1/get/responses/400/content/application~1json/schema'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1data~1inventory~1/get/responses/400/content/application~1json/schema'
    get:
      tags:
      - Reference Data
      - Market Data
      summary: Inventory Filtering
      description: "The inventory filtering endpoint filters for bonds that are available\nfor trading at the time of the request. Multiple parameters can be\nfiltered for, including reference data fields (such as S&P rating, bond\ntype) as well as the bid / ask price and yields. These filters should\nbe specified in the `filters` query parameter. We're also able to\nfilter for ISINs that fulfil a specific trade size.\n\nTwo types of filtering are supported:\n\n- Reference data filtering: specify filters for reference data fields,\n  such as S&P rating, bond type, and more.\n- Live inventory filtering: specify filters for price, yield to\n  maturity, and yield to worst, filter for quotes that match a trade\n  size, and get `bids` and `asks` from the `returns` query parameter.\n\nIn addition, specific fields can be requested in the response. These\nfields should be specified in the `returns` query parameter."
      operationId: getLiveInventory
      parameters:
      - $ref: '#/components/parameters/inventory_filters'
      - $ref: '#/components/parameters/inventory_returns'
      - $ref: '#/components/parameters/inventory_sort_by'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/trade_size'
      - $ref: '#/components/parameters/objective_function'
      - name: side
        in: query
        description: "Specify a side for inventory filters. Possible values:\n\n- 'buy' will limit the results to bonds that have quotes to buy\n  the instrument.\n- 'sell' will limit the results to bonds that have quotes to sell\n  the instrument.\n- 'both' will limit the results to bonds that have quotes on both\n  sides of the market, i.e. at least one quote to buy and one to sell.\n\nImportant note: If you are building a UI that leverages this API, you should be\nespecially cognizant that this value represents inventory side, not trade side.\n\nA client who wants to purchase a bond will look for asks/offers where the\ncounterparty wants to sell. Hence, they should pass 'sell' to the API.\n\nA client who wants to sell a bond will look for bids where the counterparty\nwants to buy. Hence, they should pass 'buy' to the API.\n\nWhen `objective_function` references `order_*` fields and `objective_side` is\nabsent, `side` also selects which side of the book those fields score ('both'\nor no\
          \ side is rejected with a 400). Use `objective_side` to choose the scoring\nside independently of this filter."
        schema:
          type: string
          enum:
          - buy
          - sell
          - both
      - name: objective_side
        in: query
        description: 'Which side of the book `objective_function`''s order fields score: ''sell'' the

          asks, ''buy'' the bids (''both'' is not accepted). Scoring-only — unlike `side` it

          never filters the results, and it takes precedence over `side` for scoring.

          Scoring order fields reads the live order book, so risk group headers are

          still required.'
        schema:
          type: string
          enum:
          - buy
          - sell
      - name: risk_group_id
        in: query
        description: 'The risk group ID to filter for tradable inventory. If left null,

          and a single risk group exists for the organization, it will be

          used as the default risk group. If left null, and more than one

          risk group exists, the request will fail.'
        schema:
          type: string
      - name: use_close_data_after_hours
        in: query
        description: 'Whether to use close data after market hours. When false (default),

          only reference data is returned when market is closed. When true,

          orders are shown as available even after market close (9:30 AM - 4:00 PM EST/EDT, Monday-Friday).'
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveInventoryResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                description: Standard error response format returned by all API endpoints.
                properties:
                  error:
                    type: string
                    description: Human-readable error message describing what went wrong.
                  error_details:
                    description: Additional structured information about the error.
                    x-go-type: any
                    x-go-type-skip-optional-pointer: true
                    x-oapi-codegen-extra-tags:
                      exhaustruct: optional
                  error_type:
                    type: string
                    description: High-level error category for programmatic error handling.
                    enum:
                    - invalid_request
                    - not_found
                    - server_error
                    - unauthorized
                    - rate_limited
                    - forbidden
                    - closed
                    - not_implemented
                    - resource_conflict
                    x-enum-varnames:
                    - ErrorTypeInvalidRequest
                    - ErrorTypeNotFound
                    - ErrorTypeServerError
                    - ErrorTypeUnauthorized
                    - ErrorTypeRateLimited
                    - ErrorTypeForbidden
                    - ErrorTypeNeedsMarketState
                    - ErrorTypeNotImplemented
                    - ErrorTypeResourceConflict
                required:
                - error
                - error_type
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1data~1inventory~1/get/responses/400/content/application~1json/schema'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1data~1inventory~1/get/responses/400/content/application~1json/schema'
  /v1/data/maturity-bucket/percentile/:
    get:
      tags:
      - Market Data
      summary: Maturity Bucket Percentiles
      description: 'The maturity bucket percentiles endpoint groups bond inventory by maturity

        buckets and calculates yield to worst percentiles for each bucket.


        This endpoint accepts the same filtering parameters as the inventory endpoint

        to filter bonds, then groups them by maturity ranges and returns ask and bid

        yield to worst (YTW) values at the specified percentile for each bucket.


        Bucket Selection:

        - Use ''bucket_selection'' parameter to choose between ''maturity_date'' or ''workout_date'' for grouping

        - Use ''buckets'' parameter to filter for specific maturity buckets only


        Available maturity buckets:

        - 1-3 mo

        - 3-6 mo

        - 6-9 mo

        - 9-12 mo

        - 1-1.5 yr

        - 1.5-2.5 yr

        - 2.5-3.5 yr

        - 3.5-4.5 yr

        - 4.5-5.5 yr

        - 5.5-6.5 yr

        - 6.5-7.5 yr

        - 7.5-8.5 yr

        - 8.5-9.5 yr

        - 9.5-10.5 yr

        - 10.5-11.5 yr

        - 11.5-12.5 yr

        - 12.5-13.5 yr

        - 13.5-14.5 yr

        - 14.5-15.5 yr

        - 15.5-16.5 yr

        - 16.5-17.5 yr

        - 17.5-18.5 yr

        - 18.5-19.5 yr

        - 19.5-20.5 yr

        - 20.5-21.5 yr

        - 21.5-22.5 yr

        - 22.5-23.5 yr

        - 23.5-24.5 yr

        - 24.5-25.5 yr

        - 25.5-26.5 yr

        - 26.5-27.5 yr

        - 27.5-28.5 yr

        - 28.5-29.5 yr

        - 29.5+ yr'
      operationId: getMaturityBucketPercentiles
      parameters:
      - $ref: '#/components/parameters/inventory_filters'
      - name: percentile
        in: query
        description: The percentile value to calculate for each maturity bucket (0-100)
        required: true
        schema:
          type: number
          maximum: 100
          minimum: 0
        example: 75
      - name: bucket_selection
        in: query
        description: 'The date field to use for maturity bucket selection. Defaults to ''maturity_date''.

          - ''maturity_date'': Group bonds by their maturity date

          - ''workout_date'': Group bonds by their workout date (call adjusted maturity date)'
        schema:
          type: string
          default: maturity_date
          enum:
          - maturity_date
          - workout_date
      - name: buckets
        in: query
        description: 'Comma-separated list of specific maturity buckets to include in the response.

          If not specified, all buckets with data will be returned.

          Available buckets: 1-3 mo, 3-6 mo, 6-9 mo, 9-12 mo, 1-1.5 yr, 1.5-2.5 yr, 2.5-3.5 yr, 3.5-4.5 yr, 4.5-5.5 yr, 5.5-6.5 yr, 6.5-7.5 yr, 7.5-8.5 yr, 8.5-9.5 yr, 9.5-10.5 yr, 10.5-11.5 yr, 11.5-12.5 yr, 12.5-13.5 yr, 13.5-14.5 yr, 14.5-15.5 yr, 15.5-16.5 yr, 16.5-17.5 yr, 17.5-18.5 yr, 18.5-19.5 yr, 19.5-20.5 yr, 20.5-21.5 yr, 21.5-22.5 yr, 22.5-23.5 yr, 23.5-24.5 yr, 24.5-25.5 yr, 25.5-26.5 yr, 26.5-27.5 yr, 27.5-28.5 yr, 28.5-29.5 yr, 29.5+ yr'
        schema:
          type: string
        example: 1.5-2.5 yr,2.5-3.5 yr,3.5-4.5 yr
      - name: risk_group_id
        in: query
        description: 'The risk group ID to filter for tradable inventory. If left null,

          and a single risk group exists for the organization, it will be

          used as the default risk group. If left null, and more than one

          risk group exists, the request will fail.'
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaturityBucketResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1data~1inventory~1/get/responses/400/content/application~1json/schema'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1data~1inventory~1/get/responses/400/content/application~1json/schema'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1data~1inventory~1/get/responses/400/content/application~1json/schema'
  /v1/data/maturity-bucket/percentile/batch/:
    post:
      tags:
      - Market Data
      summary: Batched Maturity Bucket Percentiles
      description: 'Computes several maturity-bucket percentile series in a single request.

        Each series is identical in semantics to a `GET

        /v1/data/maturity-bucket/percentile/` call: the shared `percentile`,

        `bucket_selection`, `buckets`, and `risk_group_id` fields apply to every

        series, and each series supplies its own `filters` object.


        Use this instead of firing one request per filter set — the series run

        concurrently server-side and share the request''s caches.


        The response keys each series'' result by the `key` the request supplied.

        Errors are all-or-nothing: if any series fails, the whole request fails

        with the status the single-series endpoint would have returned.'
      operationId: postMaturityBucketPercentilesBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaturityBucketPercentileBatchRequest'
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaturityBucketPercentileBatchResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1data~1inventory~1/get/responses/400/content/application~1json/schema'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1data~1inventory~1/get/responses/400/content/application~1json/schema'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1data~1inventory~1/get/responses/400/content/application~1json/schema'
components:
  schemas:
    isin:
      description: The International Securities Identification Number (ISIN) is a 12-digit alphanumeric code that uniquely identifies a specific security.
      type: string
      example: US594918AD66
      maxLength: 12
      minLength: 12
      title: ISIN
    cusip:
      description: 'The CUSIP is a nine-digit numeric or nine-character alphanumeric code that identifies a North American financial security.


        Note: Available to licensed users only.

        The Committee on Uniform Securities Identification Procedures (CUSIP) identifier for all stocks and registered bonds.

        CUSIPs are unique security identifiers managed by The CUSIP Service Bureau.'
      type: string
      example: H00402625
      maxLength: 9
      minLength: 9
      nullable: true
      title: CUSIP
    BondType:
      description: The type of fixed income security.
      type: string
      example: agency
      enum:
      - agency
      - cd
      - corporate
      - government
      - municipal
      - treasury
    TreasurySubtype:
      description: 'The subtype of a treasury. Possible values include:

        * bond: long term i.e. 20, 30 years

        * note: intermediate term i.e. 2, 3, 5, 7, and 10 years

        * bill: short term i.e. 4, 8, 13, 17, 26, 52 weeks (<= 1 year)

        * tips: treasury inflation-protected securities

        * strips: separate trading of registered interest and principal of securities

        * floating: floating rate notes'
      type: string
      example: bill
      enum:
      - bond
      - bill
      - note
      - strips
      - tips
      - floating
      nullable: true
    CountryIssue:
      description: 'The country where the security is issued/registered, in the 2-alpha country code format (e.g., US, CA). This is the registration country, NOT the risk country: an SEC-registered Yankee bond is `US` here even when its issuer and economic risk sit elsewhere. For risk-geography decisions use `country_of_risk` (and `emerging_status` for EM/DM), not this field.'
      type: string
      example: US
      nullable: true
    CountryDomicile:
      description: The country where the bond/issuer legally resides, in the 2-alpha country code format (e.g., US, CA). Differs from `country_issue` when a security is registered in one country for an issuer that resides in another — e.g. a Brazilian corporation issuing an SEC-registered bond in the US is `country_issue` = US but `country_domicile` = BR. For risk-geography decisions prefer `country_of_risk`.
      type: string
      example: US
      nullable: true
    CountryOfRisk:
      description: The country whose economy/credit the bond is exposed to — the risk country, in the 2-alpha country code format (e.g., US, ID, CN). This is the field to use for risk-geography decisions; it can differ from both `country_issue` (registration) and `country_domicile` (legal residence). For example, an emerging-market sovereign or corporate issuing an SEC-registered USD bond is `country_issue` = US but `country_of_risk` = the EM country.
      type: string
      example: US
      nullable: true
    EmergingStatus:
      description: The emerging-vs-developed-market classification of the bond, sourced from ICE. This is the field to use to answer "is this bond EM?" — use `emerging_status = Emerging` to include emerging markets and `emerging_status = Developed` to exclude them. May be null when ICE has not classified the instrument.
      type: string
      example: Developed
      enum:
      - Developed
      - Emerging
      nullable: true
    Currency:
      description: The 3-alpha currency code of the currency the bond is denominated in (e.g., USD, CAD).
      type: string
      example: USD
      nullable: true
    Ticker:
      description: The stock ticker for publicly traded companies, or a similar styled abbreviation for securities issued by a company that is not publicly traded. This field is only populated for corporate bonds.
      type: string
      example: AAPL
      nullable: true
    Seniority:
      description: The order of priority in which bondholders are repaid in the event of a default by the issuing corporation such as bankruptcy or liquidation. This field is only populated for corporate bonds.
      type: string
      example: senior_secured
      nullable: true
    Issuer:
      description: Name of the bond issuer
      type: string
      example: AAA United States Government Money Market Account Inc.
    Sector:
      description: Sector classification of issuer (e.x. Financial Services, Healthcare Facilities, Industrials, Professional Services, Energy, etc.)
      type: string
      example: Financial Services
      nullable: true
    NaicsSector:
      description: North American Industry Classification System (NAICS) standard classification of the bond
      type: string
      example: Finance And Insurance
      nullable: true
    NaicsSubsector:
      description: North American Industry Classification System (NAICS) standard sub-classification of the bond
      type: string
      example: Securities, Commodity Contracts, And Other Financial Investments And Related Activities
      nullable: true
    Description:
      description: 'Full text description of the bond following the format: [issuer] [coupon]%, [maturity_date: MM/DD/YYYY]'
      type: string
      example: AAA UNITED STATES GOVERNMENT MONEY MARKET ACCOUNT INC 2.6%, 11/30/2022
    DescriptionShort:
      description: 'Short text description of the bond following the format: [abbreviated issuer] [coupon]% [maturity_date: MM/DD/YYYY]'
      type: string
      example: MI 5.0% 05/01/2034
      nullable: true
    Purpose:
      description: The purpose of a bond refers to the specific reason or the objective for which the bond is issued. It defines how the issuer intends to use the funds raised from the bond sale. May be null for bonds where the purpose is not captured in the prospectus.
      type: string
      example: Water & Sewer
      nullable: true
    MaturityDate:
      description: 'The date on which the bond matures and the principal amount is paid back to the bondholder by the issuer. Note: not all bonds have a maturity date, such as perpetual bonds.'
      type: string
      format: date
      example: '2023-01-15'
      nullable: true
    TreasuryBenchmark:
      description: ISIN that represents the reference U.S. Treasury security used as a benchmark for pricing and evaluating the fixed income instrument. Typically, this is the closest-maturity Treasury bond or note that serves as a basis for determining relative yield and spread.
      type: string
      nullable: true
    WorkoutDate:
      description: 'Workout date, also know as the "call adjusted maturity date", is the terminal date of the bond implied by its yield to worst.


        If a bond''s yield to worst is equal to its yield to maturity, that means the market believes that it will not be redeemed until maturity. Hence, the workout date is the maturity date.


        If a bond''s yield to worst is less than the yield to maturity, that means that the market believes it will get called, and are evaluating the bond''s yield according to that predicted call date. Hence, the workout date is the date the market believes the bond will be called.'
      type: string
    Coupon:
      description: The coupon is the annual interest rate paid on the bond as a percentage of par value. This field is set to zero for zero-coupon bonds.
      type: number
      example: 5
      nullable: true
    CouponFrequency:
      description: 'The frequency, or how often, the coupon is paid to the bondholder. There are a few standard coupon frequencies:

        * annual: Paid out once per year.

        * semi_annual: Paid out twice per year.

        * quarterly: Paid out four times per year, every quarter.

        * monthly: Paid out twelve times per year, every month.

        * zero: No coupon payments.

        * at_maturity: Coupon paid out once, at maturity. Interest accrues over the life of the bond, and is repaid with the principal. Note: this typically only applies for bonds with a total life of less than 1 year.'
      type: string
      example: annual
      enum:
      - annual
      - semi_annual
      - quarterly
      - monthly
      - zero
      - at_maturity
      nullable: true
    CouponType:
      description: 'The type of coupon rate.

        * fixed: The coupon payment is a fixed percentage of the bond''s par value.

        * floating: The coupon payment is pegged to some benchmark rate that frequently changes based off a benchmark, such as SOFR. Typically, the coupon payment is the benchmark rate plus a spread.

        * variable: The coupon payment changes over the life of the bond. Similar to a floating rate, but typically updates less frequently, such as once every coupon payment.

        * zero: Zero-coupon bonds do not pay a coupon over their lifetime.

        * complex: A coupon rate that does not belong in any of the above categories.'
      type: string
      example: fixed
      enum:
      - fixed
      - floating
      - variable
      - zero
      - complex
      nullable: true
    FirstCouponDate:
      description: The date of the first coupon payment on the bond. Null for zero-coupon bonds.
      type: string
      format: date
      example: '2017-11-01'
      nullable: true
    NextCouponDate:
      description: The date of the next upcoming coupon payment. Null for zero-coupon bonds. Please note that this date may not be when the actual coupon is paid; most coupons will be paid on the following business day if the coupon date falls on a holiday or a weekend.
      type: string
      format: date
      example: '2024-05-01'
      nullable: true
    LastCouponDate:
      description: The date of the last coupon payment on the bond. Null for zero-coupon bonds.
      type: string
      format: date
      example: '2033-11-03'
      nullable: true
    IssueSize:
      description: The total size amount of the bond issue in the issuing currency.
      type: number
      example: 1625000
      nullable: true
    IssueDate:
      description: The date on which the bond was issued. In case of a reissue, this will be the latest issuance date.
      type: string
      format: date
      example: '2017-02-18'
    OriginalIssueDate:
      description: The initial date of issuance for treasury bonds, used to differentiate between original and re-issued bonds.
      type: string
      format: date
      example: '2015-02-18'
      nullable: true
    OriginalIssuePrice:
      description: The price at which the bond was originally issued as a percentage of par value. This is populated for treasury bonds that were reissued.
      type: number
      example: 99.68
      nullable: true
    OriginalIssueSize:
      description: The size of the bond when it was originally issued. This is populated for treasury bonds that were reissued.
      type: number
      example: 1000000
      nullable: true
    IssuePrice:
      description: The price at which the bond was originally issued as a percentage of par value. In case of a reissue, this will be the latest issuance price.
      type: number
      example: 113.68
      nullable: true
    IssueMinimumDenomination:
      description: The smallest unit of the bond that can be purchased at its initial offering.
      type: number
      example: 5000
      nullable: true
    ParValue:
      description: The amount that the issuer of the bond will pay back to the bondholder upon maturity. Also known as face value or nominal value.
      type: number
      example: 5000
    AccruedInterest:
      description: The interest that has accumulated on a bond in dollars per bond bewteen the last interest payment and the present date that has not yet been paid to the bondholder.
      type: number
      format: double
      example: 56.25
      nullable: true
    Callable:
      description: Whether the bond is callable, meaning the issuer has the right, but not the obligation to redeem the bond — in other words, pay out the bondholder — before its maturity date at a set price (the call price).
      type: boolean
      example: true
      nullable: true
    CallType:
      description: 'The type of call on the bond refers to one of a variety of circumstances under which a callable bond may be called. Null if the bond is not callable.

        * ordinary: The most common call type, which grants the issuer the ability to redeem the bond before its maturity date.

        * make_whole: A make whole call provision allows an issuer to redeem the bond before maturity at a price that is usually calculated based on the present value of future coupon payments and the redemption value, discounted at a specified rate.

        * regulatory: A regulatory call type gives the issuer the right to redeem the bond before its maturity due to changes in regulatory or tax laws that adversely affect the bond or its issuer.

        * special: A special call allows the issuer to call the bond before its maturity under specific circumstances, conditions, or events that are outside the typical operations of the issuer, as outlined in the bond''s indenture.'
      type: string
      example: ordinary
      enum:
      - ordinary
      - make_whole
      - regulatory
      - special
      nullable: true
    NextCallDate:
      description: The date of the next possible call on the bond. Null if the bond is not callable.
      type: string
      format: date
      example: '2027-05-01'
      nullable: true
    NextCallPrice:
      description: The price at which a callable bond can be redeemed by the issuer on the next call date, as a percentage of par. Null if the bond is not callable.
      type: number
      example: 100
      nullable: true
    Puttable:
      description: Whether the bond is puttable, meaning the bondholder has the right, but not the obligation, to sell the security back to the issuer at a predetermined price and date.
      type: boolean
      example: false
      nullable: true
    Convertible:
      description: A flag indicating whether the bond is convertible. If a bond is convertible, the investor has the right or the obligation to exchange the bond for a predetermined number of shares in the issuing company at certain times throughout a bond's lifetime. Only specified for corporate bonds issued by publicly traded companies.
      type: boolean
      example: false
      nullable: true
    BondWarrant:
      description: A financial instrument that gives holder the right, but not the obligation, to purchase a certain number of shares of the issuer's stock at a specified price (the strike price) before the warrant expires.
      type: boolean
      example: false
      nullable: true
    IsStructuredProduct:
      description: Indicates whether the bond is a structured product, which is a security derived from or linked to a pool of underlying assets, such as indices or derivatives.
      type: boolean
      example: false
      nullable: true
    SinkingFund:
      description: A sinking fund is a pool of money a bond issuer sets aside to repay the bond, typically through periodic buybacks, offering added security to bondholders. For bonds with a sinking fund provision, the bond issuer is obligated to retire or pay down a portion of the principal at specified intervals throughout the bond's lifetime. This means bondholders receive both periodic coupon payments and portions of the principal before maturity, rather than receiving the entire principal amount solely at maturity.
      type: boolean
      example: false
      nullable: true
    Perpetual:
      description: A flag representing whether a bond is perpetual, meaning it does not have a maturity date, and pays interest indefinitely. If this is set, the bond's maturity date will be null.
      type: boolean
      example: true
      nullable: true
    Insured:
      description: Indicates whether the bond is insured, meaning a third-party insurance company will guarantee the payment of principal and interest in case the issuer defaults.
      type: boolean
      example: true
      nullable: true
    PrivatePlacement:
      description: 'Indicates whether the security was part of private placement, or issued directly to a limited pool of investors rather than through a public offering. These bonds are unregistered with the SEC and are not part of the open market. Note: retail investors may not be eligible to participate in bonds offered via private placement — please consult an attorney for more information.'
      type: boolean
      example: false
      nullable: true
    144A:
      description: 'Indicates whether the security was part of Rule 144A, an SEC rule that provides a safe harbor exemption from the registration requirements for certain private resales of restricted securities to qualified institutional buyers. 144A applies to securities that are not registered with the SEC and are typically sold through private placements. Note: only qualified institutional buyers, such as those with with at least $100 million in investable assets, are eligible to purchase 144A securities.'
      type: boolean
      example: false
      nullable: true
    RegS:
      description: Indicates whether the security falls under Regulation S, a rule that provides an exemption from the registration requirements for securities offerings made outside the United States. This regulation allows U.S. and foreign issuers to sell securities in non-U.S. markets without the need to register these securities with SEC.
      type: boolean
      example: false
      nullable: true
    TraceEligible:
      description: Indicates whether the security is TRACE eligible, meaning it is subject to the Trade Reporting and Compliance Engine (TRACE) reporting requirements. Trades on these instruments must be reported to FINRA within 15 minutes of execution.
      type: boolean
      example: true
      nullable: true
    DayCount:
      description: 'The day count convention used to calculate accrued interest.

        * A/360: calculates the daily interest using a 360-day year and then multiplies that by the actual number of days in each time period.

        * A/365: calculates the daily interest using a 365-day year and then multiplies that by the actual number of days in each time period.

        * 30/360: calculates the daily interest using a 360-day year and then multiplies that by 30 (standardized month).

        * A/A: calculates the daily interest using the actual number of days in the year and then multiplies that by the actual number of days in each time period.

        * 30E/360: number of days equals to the actual number of days (for February). If the start date or the end date of the period is the 31st of a month, that date is set to the 30th. The number of days in a year is 360.

        * B/252: calculates the daily interest using a 252-business-day year and then multiplies that by the actual number of days in each time period.

        * A/364: calculates the daily interest using a 364-day year and then multiplies that by the actual number of days in each time period.'
      type: string
      example: 30/360
      enum:
      - A/360
      - A/365
      - 30/360
      - 30/365
      - A/A
      - 30E/360
      - B/252
      - A/364
      nullable: true
    SettlementConvention:
      description: The standard process through which the legal transfer of bonds from the seller to the buyer is completed, and payment is made by the buyer, including details like the timing and the specific procedures involved in the settlement of a trade.
      type: string
      example: T+2
      nullable: true
    DatedDate:
      description: The dated date marks the beginning of the period for which interest starts accruing on the bond.
      type: string
      format: date
      example: '2024-04-01'
      nullable: true
    MunicipalState:
      description: The state or territory of the issuing municipality formatted as a two-letter USPS state abbreviation. Only specified for municipal bonds.
      type: string
      example: AZ
      nullable: true
    MunicipalType:
      description: The type of revenue backing. General obligation bonds are not tied to any particular revenue-generating project. Revenue bonds, in contrast are repaid from the income generated by specific projects, enterprises, or sources, rather than from general taxation. Only specified for municipal bonds.
      type: string
      example: revenue
      enum:
      - general_obligation
      - revenue
      nullable: true
    MunicipalTaxableFederal:
      description: Whether a municipal bond is subject to US federal taxes. Only specified for municipal bonds.
      type: boolean
      example: false
    BankQualified:
      description: Indicates whether the bond is bank qualified, which is a type of municipal bond specifically designated for purchase by commercial banks. Bank qualified bonds can offer specific tax benefits because they allow banks to deduct interest costs of carrying the bond. For example, they must be issued by a small issuer who expects to issue no more than $10 million in bonds during a calendar year. Banks can also deduct 80% of the interest expense they incur to buy and carry these bonds.
      type: boolean
      example: true
    IsAMTApplicable:
      description: A flag representing whether a bond is AMT (Alternative Minimum Tax) applicable, which means that the bond's interest may be subject to the alternative minimum tax. Only specified for municipal bonds.
      type: boolean
      example: false
      nullable: true
    LowestRating:
      description: 'The bond''s lowest (worst) credit rating across S&P, Moody''s, and Fitch, expressed as a string on the S&P scale in the standard AAA - D format. Moody''s ratings are converted to their S&P equivalent before comparison, so the returned value is always S&P notation regardless of which agency supplied the worst rating. Agencies reporting NR/WR/WD are skipped, so a single agency''s not-rated or withdrawn marker does not outweigh a real rating from another agency; NR is returned only when no agency provides a real rating. Null if no agency reports any value. See lowest_rating_rank for the numeric form used in sorting and objective_function arithmetic. Note: this is a computed field derived from the underlying agency rating strings, not raw vendor reference data. Because it may be sourced from Standard & Poor''s, it is available to S&P licensed users only. This data includes Standard & Poor''s (S&P) ratings and related financial information. S&P ratings and data are proprietary
        to Standard & Poor''s Financial Services LLC. The information is used under license and is subject to copyright and other intellectual property rights held by Standard & Poor''s or its affiliates.'
      type: string
      example: BBB+
      nullable: true
    LowestRatingRank:
      description: 'Integer rank of the bond''s lowest credit rating across the rating agencies, mapped onto a numeric scale of 2 (D, lowest) to 27 (AAA, highest) — a higher rank means better credit. 0 means not rated / unrated / unknown: no rating is available from any agency, or the rating is NR or NULL. This is a computed field derived from the underlying agency rating strings, not raw vendor reference data, and is always present as an integer (it is never null; unrated bonds are 0, not null). Caveat for objective_function arithmetic: an unrated bond''s rank evaluates to 0, i.e. it is treated as *worse* than D (rank 2) rather than excluded. If you want to exclude unrated bonds instead of ranking them below D, filter on the rating string fields (e.g. sp_rating). Bucket AVG() aggregations exclude the 0 (unrated) values rather than averaging them in.'
      type: integer
      example: 19
      maximum: 27
      minimum: 0
    SpRating:
      description: 'Standard & Poor''s rating for the bond in the standard AAA - D format. NR if marked as not rated by the agency. Null if there is no rating (AAA - D or NR) provided by the agency. Note: available to S&P licensed users only. This data includes Standard & Poor''s (S&P) ratings and related financial information. S&P ratings and data are proprietary to Standard & Poor''s Financial Services LLC. The information is used under license and is subject to copyright and other intellectual property rights held by Standard & Poor''s or its affiliates.'
      type: string
      example: AAA
      nullable: true
    SpRatingDate:
      description: 'The date in the timezone of the issuing country of the most recent Standard & Poor''s rating for the bond in YYYY-MM-DD format. Null if no rating is available or rating date not available. Note: available to S&P licensed users only.'
      type: string
      format: date
      example: '2018-07-24'
      nullable: true
    SpCreditwatch:
      description: 'S&P''s CreditWatch highlights S&P''s opinion regarding the potential direction of a short-term or long-term rating. Null if no information is provided by the agency. Note: available to S&P licensed users only.'
      type: string
      example: positive
      enum:
      - positive
      - negative
      - developing
      - not_meaningful
      nullable: true
    SpCreditwatchDate:
      description: 'The date of the most recent Standard & Poor''s CreditWatch for the bond in YYYY-MM-DD format. This field will be null if no information about outlook is available or CreditWatch date not available. Note: available to S&P licensed users only.'
      type: string
      format: date
      example: '2020-07-22'
      nullable: true
    SpOutlook:
      description: 'A Standard & Poor''s rating outlook indicates S&P''s view regarding the potential direction of a long-term credit rating over the intermediate term (2 years for investment grade, 1 year for speculative grade). Null if no information is provided by the agency. Note: available to S&P licensed users only.'
      type: string
      example: negative
      enum:
      - positive
      - negative
      - developing
      - stable
      - not_rated
      - not_meaningful
      nullable: true
    SpOutlookDate:
      description: 'The date of the most recent Standard & Poor''s outlook for the bond in YYYY-MM-DD format. Null if no information about outlook is available or outlook date not available. Note: available to S&P licensed users only.'
      type: string
      format: date
      example: '2022-06-15'
      nullable: true
    Duration:
      description: 'The duration of a bond represents how long it will take, on average, to receive the returns of investment, including the regular interest payments on the bond as well as the final lump sum payment. Moment provides modified duration, a modification of Macaulay duration (which measures the weighted average time it takes to receive all cash flows, both interest and principal, from a bond). Modified duration provides a more direct measure of a bond''s price sensitivity to interest rates, as it provides an estimate for how much the price of a bond will change in response to a 1% change in interest rates. Note: this field is available to users licensed for pricing analytics only.'
      type: number
      format: double
      example: 0.71
      nullable: true
    Convexity:
      description: 'The convexity of a bond measures the degree to which the duration of a bond changes as interest rates change. While duration estimates a bond''s price sensitivity to small interest rate movements, convexity accounts for the fact that this relationship is not linear—especially for larger rate changes. A bond with higher convexity will exhibit more price gain when interest rates fall and less price loss when rates rise, compared to a bond with lower convexity. Moment provides effective convexity, which approximates this curvature by comparing the bond''s price change under small upward and downward shifts in yield. Note: this field is available to users licensed for pricing analytics only.'
      type: number
      format: double
      example: 0.41
      nullable: true
    LiquidityMicroBuy:
      description: 'Score (from 1-5 if the bond is priced, or null if the bond is not tradable) reflecting the historical depth of executable liquidity to buy with minimum trading sizes less than or equal to $1,000.00. A higher score means that the bond is more likely to have  offers at the minimum trading size. Note: available to users licensed for pricing analytics only. See reference data glossary for breakdown of how this proprietary analytic is calculated by Moment.'
      type: integer
      example: 3
      nullable: true
    LiquidityMicroSell:
      description: 'Score (from 1-5 or null if the bond is not priced/tradable) reflecting the historical depth of executable liquidity to sell with minimum trading sizes less than or equal to $1,000.00. A higher score means that the bond is more likely to have bids at the minimum trading size. Note: available to users licensed for pricing analytics only. See reference data glossary for breakdown of how this proprietary analytic is calculated by Moment.'
      type: integer
      example: 5
      nullable: true
    LiquidityMicroAggregate:
      description: 'Score (from 1-5 or null if the bond is not priced/tradable) reflecting the historical depth of executable liquidity to buy or sell with minimum trading sizes less than or equal to $1,000.00. A higher score means that the bond is more likely to have bids and offers at the minimum trading size. Note: available to users licensed for pricing analytics only. See reference data glossary for breakdown of how this proprietary analytic is calculated by Moment.'
      type: integer
      example: 5
      nullable: true
    LiquidityRetailBuy:
      description: 'Score (from 1-5 or null if the bond is not priced/tradable) reflecting the historical depth of executable liquidity to buy with minimum trading sizes less than or equal to $10,000.00. A higher score means that the bond is more likely to have bids and offers at the minimum trading size. Note: available to users licensed for pricing analytics only. See reference data glossary for breakdown of how this proprietary analytic is calculated by Moment.'
      type: integer
      example: 1
      nullable: true
    LiquidityRetailSell:
      description: 'Score (from 1-5 or null if the bond is not priced/tradable) reflecting the historical depth of executable liquidity to sell with minimum trading sizes less than or equal to 10,000. A higher score means that an order to sell will generally have faster execution. Note: available to users licensed for pricing analytics only. See reference data glossary for breakdown of how this proprietary analytic is calculated by Moment.'
      type: integer
      example: 2
      nullable: true
    LiquidityRetailAggregate:
      description: 'Score (from 1-5 or null if the bond is not priced/tradable) reflecting the historical depth of executable liquidity to buy or sell with minimum trading sizes less than or equal to 10,000. A higher score means that an order to buy or sell will generally have faster execution. Note: available to users licensed for pricing analytics only. See reference data glossary for breakdown of how this proprietary analytic is calculated by Moment.'
      type: integer
      example: 4
      nullable: true
    LiquidityInstitutionalBuy:
      description: 'Score (from 1-5 or null if the bond is not priced/tradable) reflecting the historical depth of executable liquidity to buy (no minimum trading sizes). A higher score means that an order to buy will generally have faster execution. Note: available to users licensed for pricing analytics only. See reference data glossary for breakdown of how this proprietary analytic is calculated by Moment.'
      type: integer
      example: 4
      nullable: true
    LiquidityInstitutionalSell:
      description: 'Score (from 1-5 or null if the bond is not priced/tradable) reflecting the historical depth of executable liquidity to sell (no minimum trading sizes). A higher score means that an order to sell will generally have faster execution. Note: available to users licensed for pricing analytics only. See reference data glossary for breakdown of how this proprietary analytic is calculated by Moment.'
      type: integer
      example: 3
      nullable: true
    LiquidityInstitutionalAggregate:
      description: 'Score (from 1-5 or null if the bond is not priced/tradable) reflecting the historical depth of executable liquidity to buy or sell (no minimum trading sizes). A higher score means that an order to buy or sell will generally have faster execution. Note: available to users licensed for pricing analytics only. See reference data glossary for breakdown of how this proprietary analytic is calculated by Moment.'
      type: integer
      example: 2
      nullable: true
    ClosePrice:
      description: 'The close price, or “end of day price” is the price of the last transaction of a security before the market closes for normal trading, shown as a percentage of par value. Note: available to users licensed for end-of-day prices only.'
      type: number
      example: 100.2
      nullable: true
    CloseYTW:
      description: 'The close Yield to Worst refers to the YTW of the last transaction of a security before the market officially closes for normal trading. Note: available to users licensed for end-of-day prices only.'
      type: number
      format: double
      example: 5.486
      nullable: true
    CloseYTM:
      description: 'The close Yield to Maturity refers to the YTM of the last transaction of a security before the market officially closes for normal trading. Note: available to users licensed for end-of-day prices only.'
      type: number
      format: double
      example: 5.486
      nullable: true
    ClosePriceAsOf:
      description: 'The timestamp on which the close price and yield were recorded in RFC-3339 format. Note: available to users licensed for end-of-day prices only.'
      type: string
      format: date-time
      example: '2023-12-06T18:09:07.441247Z'
      nullable: true
    BondStatus:
      description: 'The status of the bond reflects many possible states a bond can be in.


        * called: The bond has been called by the issuer.

        * converted: The bond has been converted into another type of security. Usually this is from the issue being converted into common stock.

        * defaulted: The bond issuer has failed to make timely payments on the bond and has entered default.

        * funged: The bond has been funged (replaced/exchanged) for another. This sometimes happens when an issuer combines two classes of bond into one parent bond.

        * liquidated: The issuer has been liquidated.

        * matured: The bond has reached its maturity date and the bondholders have been repaid their principal.

        * outstanding: The bond is still active and has not reached its maturity date.

        * pre_issuance: There is reference data for this bond but it has not yet been issued and is unavailable for trading.

        * put: The bond has been put (sold back) to the issuer.

        * repaid: The bond has been repaid before its maturity date using a covenant other than an option such as a put or call. For example, through prepayment.

        * tendered: The bond has been tendered (offered for repurchase) by the issuer.

        * repurchased: The bond has been repurchased by the issuer.

        * restructured: The security has been restructured into a new security or into a security with materially different terms.

        * unknown: The status of the bond is unknown.'
      type: string
      example: called
      enum:
      - called
      - converted
      - defaulted
      - funged
      - liquidated
      - matured
      - outstanding
      - pre_issuance
      - put
      - repaid
      - tendered
      - repurchased
      - restructured
      - unknown
    UpdatedAt:
      description: The timestamp at which the bond was last updated in Moment's system in RFC-3339 format with nanosecond precision.
      type: string
      format: date-time
      example: '2023-12-06T18:09:07.441248Z'
