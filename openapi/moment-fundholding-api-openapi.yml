openapi: 3.2.0
info:
  title: Refdata Service Fund Holding API
  version: 1.0.0
  description: API for accessing reference data internally.
tags:
- name: FundHolding
paths:
  /v1/fund/holdings/snapshot:
    get:
      summary: Get Fund Holdings Snapshot
      description: 'Returns all fund holdings across all funds as NDJSON.

        Use the filter parameter to narrow results and the fields parameter to

        select which fields are returned.


        When the filter targets the cache key field with an "in" operator,

        the server performs direct cache lookups instead of scanning all records.

        Additional filters in the same request are applied to the narrowed set.'
      operationId: getFundHoldingsSnapshot
      tags:
      - FundHolding
      parameters:
      - $ref: '#/components/parameters/SnapshotFields'
      - $ref: '#/components/parameters/SnapshotFilter'
      responses:
        '200':
          description: Successful response (NDJSON stream)
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/FundHolding'
        '400':
          description: Invalid filter expression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/fund/holdings/{id}:
    get:
      summary: Get Fund Holdings
      description: 'Returns holdings for a single fund by ISIN. If the identifier is not

        an ISIN, the service attempts to auto-detect the symbol type and

        resolve it to the underlying ISIN.'
      operationId: getFundHoldings
      tags:
      - FundHolding
      parameters:
      - name: id
        in: path
        required: true
        description: 'Fund identifier. ISINs are looked up directly; other formats

          (e.g., CUSIP) are auto-detected and resolved.'
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundHoldingResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    FundHoldingResponse:
      type: object
      properties:
        isin:
          type: string
        portfolio_date:
          type:
          - string
          - 'null'
          format: date-time
        holdings_count:
          type: integer
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/FundHolding'
      required:
      - isin
      - holdings_count
      - holdings
    FundHolding:
      type: object
      properties:
        fund_isin:
          type:
          - string
          - 'null'
        fund_cusip:
          type:
          - string
          - 'null'
        fund_symbol:
          type:
          - string
          - 'null'
        portfolio_date:
          type:
          - string
          - 'null'
          format: date
        holding_security_name:
          type:
          - string
          - 'null'
        holding_symbol:
          type:
          - string
          - 'null'
        holding_cusip:
          type:
          - string
          - 'null'
        holding_isin:
          type:
          - string
          - 'null'
        holding_country_code:
          type:
          - string
          - 'null'
        holding_currency_code:
          type:
          - string
          - 'null'
        holding_detail_type_id:
          type:
          - string
          - 'null'
        holding_detail_type:
          type:
          - string
          - 'null'
        holding_weighting:
          type:
          - number
          - 'null'
          format: double
        holding_market_value:
          type:
          - number
          - 'null'
          format: double
        holding_number_of_shares:
          type:
          - number
          - 'null'
          format: double
        holding_duration:
          type:
          - number
          - 'null'
          format: double
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
      - error
  parameters:
    SnapshotFilter:
      name: filter
      in: query
      required: false
      description: 'JSON filter expression. Supported operators: equal_to, not_equal_to,

        greater_than, greater_than_or_equal_to, less_than, less_than_or_equal_to,

        in, not_in, is_null, includes, not_includes, starts_with, ends_with.

        Logical combinators: and, or, not.'
      schema:
        type: string
      example: '{"isin":{"in":["US0378331005","US5949181045"]}}'
    SnapshotFields:
      name: fields
      in: query
      required: false
      description: Comma-separated list of fields to include in the response
      schema:
        type: string
      example: isin,cusip,issuer
