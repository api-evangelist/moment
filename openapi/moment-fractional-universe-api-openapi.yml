  title: Quotes Fractional Universe API
  description: 'Moment''s Quotes API is a modern platform for algorithmic fixed income trading.

    For complete documentation on the Quotes API and to obtain your keys, visit:

    Moment API Documentation.

    Once you have your keys, go to the environments tab to quickly get started.'
  version: 1.0.0
  contact:
    name: Moment Support
    email: support@withmoment.com
    url: https://withmoment.com/support
servers:
- url: https://live.moment-api.com
- url: https://paper.moment-api.com
tags:
- name: Fractional Universe
paths:
  /v1/trading/fractional-universe/:
    get:
      tags:
      - Fractional Universe
      summary: Fractional Universe
      description: The GET fractional universe endpoint returns a list of ISINs representing all fractional bonds available for trading on the platform.
      operationId: getFractionalUniverse
      parameters:
      - name: side
        in: query
        schema:
          description: Filters out ISINs that are available for the specified side.
          type: string
          example: buy
          enum:
          - buy
          - sell
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  description: Instrument ISIN
                example:
                - US594918AD66
                - US1234567890
